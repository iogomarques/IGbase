/* ============================================================
   PIX — payload BR Code (padrão EMV/Banco Central) + QR Code visual
   ============================================================ */
function bytesUtf8Pix(str){
  return new TextEncoder().encode(str).length;
}
function tlvPix(id, value){
  var len = String(bytesUtf8Pix(value));
  while(len.length < 2) len = '0' + len;
  return id + len + value;
}
function crc16Pix(str){
  var crc = 0xFFFF;
  for(var i=0;i<str.length;i++){
    crc ^= (str.charCodeAt(i) << 8);
    for(var j=0;j<8;j++){
      crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF;
    }
  }
  var hex = crc.toString(16).toUpperCase();
  while(hex.length < 4) hex = '0' + hex;
  return hex;
}
/* Remove acentos e troca por espaço qualquer caractere que não seja letra,
   número ou espaço (mantendo as palavras separadas) — exigido pelo padrão EMV
   pros campos de texto (nome do beneficiário, cidade). */
function sanitizarTextoEmv(s, maxLen){
  var limpo = String(s||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toUpperCase()
    .replace(/[^A-Z0-9 ]/g, ' ')
    .replace(/\s+/g,' ').trim();
  return limpo.slice(0, maxLen);
}
/* Validação de CPF pelos dígitos verificadores — usada só pra desambiguar CPF
   de celular quando os dois têm 11 dígitos (ex.: CPF "12345678909" e celular
   "62999674430" têm a mesma quantidade de dígitos, mas só um passa no
   checksum oficial de CPF). */
function ehCpfValidoPix(cpf){
  if(!/^\d{11}$/.test(cpf)) return false;
  if(/^(\d)\1{10}$/.test(cpf)) return false;
  var soma = 0, resto, i;
  for(i=1;i<=9;i++) soma += parseInt(cpf.charAt(i-1),10) * (11-i);
  resto = (soma*10) % 11; if(resto===10||resto===11) resto=0;
  if(resto !== parseInt(cpf.charAt(9),10)) return false;
  soma = 0;
  for(i=1;i<=10;i++) soma += parseInt(cpf.charAt(i-1),10) * (12-i);
  resto = (soma*10) % 11; if(resto===10||resto===11) resto=0;
  if(resto !== parseInt(cpf.charAt(10),10)) return false;
  return true;
}
/* Identifica o tipo da chave Pix (telefone / CPF / CNPJ / e-mail / aleatória)
   a partir de QUALQUER formato digitado (com parênteses, traços, espaços,
   pontos, barras, com ou sem +55) e devolve ela já limpa, exatamente no
   formato que o Banco Central exige dentro do payload — sem isso, o
   Mercado Pago (validação rígida) recusa o QR mesmo que outros bancos leiam. */
function higienizarChavePix(chaveRaw){
  var bruta = String(chaveRaw||'').trim();
  if(!bruta) return '';

  if(bruta.indexOf('@') > -1) return bruta.toLowerCase().replace(/\s+/g,'');

  var evp = bruta.toLowerCase();
  if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(evp)) return evp;

  var comMais = bruta.indexOf('+') === 0;
  var digitos = bruta.replace(/\D/g,'');

  if(digitos.length === 14) return digitos;                     // CNPJ
  if(digitos.length === 11){
    if(ehCpfValidoPix(digitos)) return digitos;                 // CPF
    return '+55' + digitos;                                     // celular sem +55
  }
  if(digitos.length === 10) return '+55' + digitos;              // fixo sem +55
  if(comMais && (digitos.length === 12 || digitos.length === 13)) return '+' + digitos;
  if(!comMais && (digitos.length === 12 || digitos.length === 13) && digitos.indexOf('55') === 0) return '+' + digitos;

  return bruta; // não bateu em nenhum padrão reconhecido — devolve só com espaços das pontas já removidos
}
/* Gera o "copia e cola" do Pix (BR Code) com o valor exato do mês — o cliente
   escaneia e o valor já vem preenchido certinho, sem digitar nada. */
function gerarPayloadPix(chave, nomeBeneficiario, cidade, valor){
  var chaveLimpa = higienizarChavePix(chave);
  var nome = sanitizarTextoEmv(nomeBeneficiario || 'SOLAR ORGANIZATION', 25) || 'SOLAR ORGANIZATION';
  var cid = sanitizarTextoEmv(cidade || 'BRASIL', 15) || 'BRASIL';

  var merchantInfo = tlvPix('00','br.gov.bcb.pix') + tlvPix('01', chaveLimpa);
  var payload =
    tlvPix('00','01') +
    tlvPix('01','11') +
    tlvPix('26', merchantInfo) +
    tlvPix('52','0000') +
    tlvPix('53','986') +
    (valor > 0 ? tlvPix('54', valor.toFixed(2)) : '') +
    tlvPix('58','BR') +
    tlvPix('59', nome) +
    tlvPix('60', cid) +
    tlvPix('62', tlvPix('05','***')) +
    '6304';
  return payload + crc16Pix(payload);
}
var bibliotecasExportacao = {};
function carregarBibliotecaExportacao(chave, fontes, disponivel){
  if(disponivel()) return Promise.resolve(true);
  if(bibliotecasExportacao[chave]) return bibliotecasExportacao[chave];
  var tarefa = new Promise(function(resolve){
    var indice = 0;
    function tentar(){
      if(disponivel()){resolve(true);return;}
      if(indice >= fontes.length){resolve(false);return;}
      var script = document.createElement('script'), concluido = false, timer;
      script.src = fontes[indice++]; script.async = true;
      function terminar(ok){
        if(concluido) return; concluido = true; clearTimeout(timer);
        script.onload = null; script.onerror = null;
        if(ok){resolve(true);return;}
        script.remove(); tentar();
      }
      script.onload = function(){terminar(disponivel());};
      script.onerror = function(){terminar(false);};
      timer = setTimeout(function(){terminar(disponivel());},12000);
      document.head.appendChild(script);
    }
    tentar();
  });
  bibliotecasExportacao[chave] = tarefa;
  tarefa.then(function(){if(bibliotecasExportacao[chave] === tarefa)delete bibliotecasExportacao[chave];});
  return tarefa;
}
function carregarQrCodeLib(){
  return carregarBibliotecaExportacao('qrcode',[
    'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js',
    'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js'
  ],function(){return typeof window.qrcode === 'function';});
}
/* Devolve uma data URL (PNG) do QR Code do Pix pra este cliente/mês, ou null se
   o cliente não tiver ligado a opção ou faltar dado essencial (chave/beneficiário). */
async function gerarQrPixDataUrl(client, valorTotal){
  if(!client || !client.gerarQrCodePix || !client.chavePix) return null;
  var ok = await carregarQrCodeLib();
  if(!ok || !window.qrcode)throw new Error('Não foi possível carregar o QR Code Pix. Confira a conexão e tente novamente.');
  try{
    var payload = gerarPayloadPix(client.chavePix, client.beneficiario, client.cidadePix, valorTotal);
    var qr = window.qrcode(0, 'M');
    qr.addData(payload);
    qr.make();
    return qr.createDataURL(10, 10);
  }catch(e){
    console.error(e);
    throw new Error('Não foi possível gerar o QR Code Pix. Confira os dados de pagamento e tente novamente.');
  }
}

function escalaPngSegura(largura,altura){
  return Math.min(2,Math.sqrt(3000000 / Math.max(1,largura * altura)),4096 / Math.max(1,largura,altura));
}
async function aguardarImagensDocumento(container){
  if(document.fonts && document.fonts.ready)await esperarComLimite(document.fonts.ready,6000);
  await Promise.all(Array.from(container.querySelectorAll('img')).map(function(img){
    if(img.complete){if(!img.naturalWidth)throw new Error('Não foi possível carregar uma imagem da fatura.');return;}
    return new Promise(function(resolve,reject){
      var timer = setTimeout(function(){limpar();reject(new Error('A imagem da fatura demorou para carregar. Tente novamente.'));},12000);
      function limpar(){clearTimeout(timer);img.onload=null;img.onerror=null;}
      img.onload=function(){limpar();resolve();};
      img.onerror=function(){limpar();reject(new Error('Não foi possível carregar uma imagem da fatura.'));};
    });
  }));
}

    await aguardarImagensDocumento(container);

/* O Safari recebe um link real e um novo toque para salvar/compartilhar,

async function compartilharOuBaixarBlob(blob, filename, mimeType){

        await navigator.share({files:[arquivo.file],title:filename});

      }catch(e){
        if(e && e.name==='AbortError')statusExportacao('Compartilhamento cancelado. O arquivo continua disponível para salvar.');

    catch(e){statusExportacao('O download automático não iniciou. Use Baixar novamente.');}

function nomeArquivoDocumento(client, referencia, sufixo){
  var partes = (referencia || '').split('/');
  var nomeMes = partes[0] || '', ano = partes[1] || '';
  var idxMes = MESES_PT.indexOf(nomeMes);
  var mesNum = idxMes > -1 ? String(idxMes + 1).padStart(2, '0') : '00';
  var nomeCliente = (client.nome || '').toUpperCase();
  return (ano + ' ' + mesNum + ' ' + nomeCliente + ' ' + sufixo).trim();
}
function hexToRgb(hex){
  hex = (hex || '#1B4D3E').replace('#','');
  if(hex.length === 3) hex = hex.split('').map(function(c){ return c+c; }).join('');
  var num = parseInt(hex, 16);
  if(isNaN(num)) num = 0x1B4D3E;
  return [ (num>>16)&255, (num>>8)&255, num&255 ];
}
function carregarDimensoesImagem(base64){
  return new Promise(function(resolve){
    try{
      var img = new Image();
      img.onload = function(){ resolve({ w: img.naturalWidth || 1, h: img.naturalHeight || 1 }); };
      img.onerror = function(){ resolve(null); };
      img.src = base64;
    }catch(e){ resolve(null); }
  });
}
function formatoImagemBase64(base64){
  if(base64.indexOf('image/png') > -1) return 'PNG';
  if(base64.indexOf('image/webp') > -1) return 'WEBP';
  return 'JPEG';
}

/* Composição medida em pontos: o cliente recebe uma página legível ou nenhum
   arquivo. Nunca truncar textos nem produzir uma segunda página silenciosa. */
function criarPdfClienteUmaPagina(m, qr, logoDim){
  var formatos=[{fonte:10,linha:13,espaco:5},{fonte:9.5,linha:12,espaco:4},{fonte:9,linha:11,espaco:3}];
  var cor=hexToRgb(m.dc.corPrimaria || '#1B4D3E');

  function texto(v){return limparTextoExibicao(v).replace(/[\u00a0\u202f]/g,' ').replace(/[—–−]/g,'-');}
  for(var tentativa=0;tentativa<formatos.length;tentativa++){
    var f=formatos[tentativa],doc=new window.jspdf.jsPDF({unit:'pt',format:'a4'});
    var pw=doc.internal.pageSize.getWidth(),ph=doc.internal.pageSize.getHeight();
    var margem=36,largura=pw-2*margem,y=38,limite=ph-36;
    function fonte(t,b,c){doc.setFont('helvetica',b?'bold':'normal');doc.setFontSize(t);doc.setTextColor.apply(doc,c || escuro);}
    function cabe(h){if(y+h>limite) throw {codigo:'FATURA_NAO_CABE'};}
    function escreve(s,x,yy,op){doc.text(texto(s),x,yy,op || {});}
    function dividir(s,w,t,b){fonte(t,b);return doc.splitTextToSize(texto(s),w);}
    function paragrafo(s,w,x,t,b,c){
      var ls=dividir(s,w,t || f.fonte,b);cabe(ls.length*f.linha);
      fonte(t || f.fonte,b,c);ls.forEach(function(l){escreve(l,x === undefined?margem:x,y);y+=f.linha;});
    }
    function titulo(s){
      cabe(20);y+=f.espaco;fonte(9.5,true,cor);escreve(s,margem,y);y+=6;
      doc.setDrawColor(221,229,218);doc.setLineWidth(.5);doc.line(margem,y,pw-margem,y);y+=f.linha;
    }
    function tabela(ls){
      ls.forEach(function(l){
        var nomes=dividir(l.rotulo,largura-126,f.fonte,false),valores=dividir(l.valor,116,f.fonte,true);
        var h=Math.max(nomes.length,valores.length)*f.linha+f.espaco;cabe(h);
        fonte(f.fonte,false,cinza);nomes.forEach(function(n,i){escreve(n,margem,y+i*f.linha);});
        fonte(f.fonte,true);valores.forEach(function(v,i){escreve(v,pw-margem,y+i*f.linha,{align:'right'});});y+=h;
      });
    }
    try{
      var inicio=y,logoW=logoDim?Math.min(140,70*logoDim.w/logoDim.h):0,logoH=logoDim?logoW*logoDim.h/logoDim.w:0;
      var nomeW=largura-(logoW?logoW+18:0);
      IGCompanies.lines(m.dc).forEach(function(l,i){paragrafo(l,nomeW,margem,i?9:12,!i,cinza);});
      if(logoDim)doc.addImage(m.dc.logoBase64,formatoImagemBase64(m.dc.logoBase64),pw-margem-logoW,inicio-8,logoW,logoH);
      y=Math.max(y,inicio+logoH)+f.espaco;
      titulo('IDENTIFICAÇÃO DO CLIENTE');
      linhasIdentificacaoCliente(m.client).forEach(function(l){paragrafo(l,largura,margem,9,false,cinza);});
      paragrafo('Referência: '+m.referencia,largura,margem,9,false,cinza);
      titulo('FATURA');tabela([{rotulo:'VALOR A PAGAR',valor:m.total}]);
      var metricas=linhasResumoEnergia(m.energia),metade=largura/2;
      var celulas=metricas.map(function(l){return {rotulo:dividir(l.rotulo,metade-20,9,false),valor:dividir(l.valor,metade-20,11,true)};});
      var alturas=[0,2].map(function(i){return Math.max(celulas[i].rotulo.length+celulas[i].valor.length,celulas[i+1].rotulo.length+celulas[i+1].valor.length)*f.linha+8;});
      var altura=alturas[0]+alturas[1]+4;cabe(altura+f.espaco);
      doc.setFillColor(244,247,243);doc.roundedRect(margem,y,largura,altura,4,4,'F');
      var sy=y+f.linha;
      celulas.forEach(function(l,i){
        var x=margem+10+(i%2)*metade,cy=sy+(i>1?alturas[0]:0);
        fonte(9,false,cinza);l.rotulo.forEach(function(t){escreve(t,x,cy);cy+=f.linha;});
        fonte(11,true,cor);l.valor.forEach(function(t){escreve(t,x,cy);cy+=f.linha;});
      });y+=altura+f.linha;
      paragrafo(notaResumoEnergia(m.energia),largura,margem,9,false,cinza);
      titulo('COMPOSIÇÃO DA COBRANÇA');tabela(m.financeiro);
      if(m.extras.length){
        titulo('DETALHES SELECIONADOS');
        for(var i=0;i<m.extras.length;i+=2){
          var pares=m.extras.slice(i,i+2).map(function(l){return dividir(l.rotulo+': '+l.valor,metade-12,9,false);});
          var h=Math.max.apply(null,pares.map(function(ls){return ls.length;}))*f.linha+f.espaco;cabe(h);
          fonte(9,false,cinza);pares.forEach(function(ls,j){ls.forEach(function(l,k){escreve(l,margem+j*metade,y+k*f.linha);});});y+=h;
        }

      if(m.observacoes){

        String(m.observacoes).split(/\r?\n/).forEach(function(l){if(l.trim())paragrafo(l,largura,margem,9,false,cinza);else{cabe(f.linha);y+=f.linha;}});
      }
      y+=f.espaco;cabe(20);doc.setDrawColor(221,229,218);doc.line(margem,y,pw-margem,y);y+=f.linha;
      var pagamentoY=y,pixW=largura-(qr?104:0),qrSize=90;
      paragrafo('PAGAMENTO VIA PIX',pixW,margem,9.5,true,cor);
      paragrafo(m.client.chavePix || 'Chave não informada',pixW,margem,10,true);
      var banco=[m.client.banco,m.client.beneficiario].filter(Boolean).join(' · ');

      if(m.client.condicaoPagamento)paragrafo(m.client.condicaoPagamento,pixW,margem,9,false,cinza);
      if(qr){
        cabe(Math.max(0,pagamentoY+qrSize-y));
        doc.addImage(qr,formatoImagemBase64(qr),pw-margem-qrSize,pagamentoY-6,qrSize,qrSize);
        y=Math.max(y,pagamentoY+qrSize);
      }
      var contatos=linhasContatoEmpresa(m.dc);
      if(contatos.length){titulo('ENDEREÇO E CONTATO DA EMPRESA');contatos.forEach(function(t){paragrafo(t,largura,margem,9,false,cinza);});}
      if(m.dc.textoRodape){y+=f.espaco;paragrafo(m.dc.textoRodape,largura,margem,9,false,cinza);}
      cabe(10);fonte(9,false,cinza);escreve('Página 1 de 1',pw-margem,ph-20,{align:'right'});
      return {doc:doc,fonteMinima:9,alturaUtilizada:y,formato:tentativa};
    }catch(e){if(!e || e.codigo!=='FATURA_NAO_CABE')throw e;}
  }
  var erro=new Error('O conteúdo não cabe em uma página legível. Reduza os detalhes extras selecionados ou revise as observações. O PDF interno mantém a conferência completa. Nenhum texto foi cortado.');
  erro.codigo='FATURA_NAO_CABE';throw erro;
}

/* Download direto: sem janela intermediária e sem alterar os dados da fatura. */

        if(d.ajusteExcedenteAplicado !== false && d.ajusteExcedenteRS > 0.004){
          linhas([{rotulo:'Compensação financeira do saldo já cobrado',valor:fmtBRL(-d.ajusteExcedenteRS)}]);
        }
      }
    }
    if(m.observacoes){titulo('OBSERVAÇÕES');paragrafo(m.observacoes,9);}
    if(!interno){
      var pixH=qr?114:62;checkBreak(pixH+16);
      doc.setDrawColor(221,229,218);doc.setLineWidth(0.6);doc.line(margin,y,pageW-margin,y);y+=18;
      fonte(9,true,rgb);escrever('PAGAMENTO VIA PIX',margin,y);
      var pixY=y+17,pixW=width-(qr?126:0);
      fonte(10.5,true);
      var chaveLinhas=doc.splitTextToSize(texto(client.chavePix || 'Chave não informada'),pixW);
      chaveLinhas.forEach(function(l){checkBreak(14);escrever(l,margin,pixY);pixY+=14;});
      fonte(8.5,false,[92,111,99]);
      doc.splitTextToSize(texto([client.banco,client.beneficiario].filter(Boolean).join(' · ')),pixW).forEach(function(l){escrever(l,margin,pixY);pixY+=11;});
      if(qr){try{doc.addImage(qr,'PNG',pageW-margin-100,y-8,100,100);}catch(e){}}
      y=Math.max(pixY+10,y+(qr?106:45));
      if(client.condicaoPagamento)paragrafo(client.condicaoPagamento,8.5);
    }
    var contatosEmpresa=linhasContatoEmpresa(dc);
    if(contatosEmpresa.length){
      titulo('ENDEREÇO E CONTATO DA EMPRESA');
      contatosEmpresa.forEach(function(c){paragrafo(c,8.5,null,2);});
    }
    if(dc.textoRodape)paragrafo(dc.textoRodape,8,[133,147,135]);
    var paginas=doc.internal.getNumberOfPages();
    for(var i=1;i<=paginas;i++){
      doc.setPage(i);fonte(8,false,[133,147,135]);
      if(interno)escrever('Uso interno - não enviar ao cliente.',margin,pageH-24);
      escrever('Página '+i+' de '+paginas,pageW-margin,pageH-24,{align:'right'});
    }
    var filename=nomeArquivoDocumento(client,d.referencia,interno?'RESUMO':'FATURA')+'.pdf';
    doc.setProperties({title:filename});
    if(!conferirDraftExportacao(d))return;
    await compartilharOuBaixarBlob(doc.output('blob'),filename,'application/pdf');
  }catch(e){
    console.error(e);var mensagem=e && e.codigo==='FATURA_NAO_CABE'?e.message:'Erro ao gerar o PDF. Tente novamente em instantes.';
    if(emissaoStatus)emissaoStatus.textContent=mensagem;toast(mensagem);
  }
  }catch(e){
    console.error(e);var erroEmissao='Não foi possível gerar o PDF. Tente novamente nesta tela.';
    if(emissaoStatus)emissaoStatus.textContent=erroEmissao;toast(erroEmissao);
  }finally{baixandoPdf=false;finalizarExportacao();}
}


function handleConfirmClick(el, cb){
  if(el.dataset.confirming === '1'){ clearTimeout(el._confirmTimeout); cb(); }
  else{
    var original = el.textContent;
    el.dataset.confirming = '1'; el.dataset.original = original; el.textContent = 'Confirmar exclusão';
    el._confirmTimeout = setTimeout(function(){ el.dataset.confirming=''; el.textContent = el.dataset.original; }, 3000);
  }
}

function varRowHtml(v, withCategoria){
  v = v || {};
  var rid = uid();
  var formatoVisivel=apresentacaoCampoFatura(v,{possuiItensMultiplos:false},null).formato;
  var categoriaHtml = withCategoria ? (
    '<select class="v-categoria">' +
      '<option value="mensal"'+(v.categoria==='mensal'?' selected':'')+'>Mensal</option>' +
      '<option value="fixo"'+(v.categoria==='fixo'?' selected':'')+'>Fixo do perfil</option>' +
    '</select>') : '';
  /* "Tipo" e "Calc." só existem para variáveis de item (por ponto): a maioria é numérica
     e digitada; às vezes um ponto precisa de uma marcação Sim/Não (ex.: "é o ponto
     principal?"), e às vezes o valor não é digitado — é sempre calculado pelo sistema
     (ex.: consumo/Fio B quando "distribuição automática" está ligada no perfil). */
  var tipoHtml = !withCategoria ? (
    '<select class="v-tipo">' +
      '<option value="numero"'+(v.tipo!=='checkbox'?' selected':'')+'>Número</option>' +
      '<option value="checkbox"'+(v.tipo==='checkbox'?' selected':'')+'>Sim / Não</option>' +
    '</select>') : '';
  var calcHtml = !withCategoria ? (
    '<label class="v-calc-label" title="Somente leitura — preenchido pelo sistema, não digitado"><input type="checkbox" class="v-calc"'+(v.calculado?' checked':'')+'> calc.</label>') : '';
  return '<div class="var-row' + (withCategoria?'':' item-row') + '" data-var-id="' + rid + '">' +
    '<input type="text" class="v-rotulo" placeholder="Rótulo (ex: Consumo do mês)" value="' + escapeHtml(v.rotulo||'') + '">' +
    '<input type="text" class="v-chave" placeholder="chave" value="' + escapeHtml(v.chave||'') + '" data-touched="' + (v.chave?'1':'0') + '">' +
    categoriaHtml + tipoHtml +
    '<input type="text" inputmode="decimal" class="v-padrao" placeholder="valor padrão" value="' + (v.valorPadrao!==undefined?fmtNum(v.valorPadrao):'0') + '">' +
    '<select class="v-formato">' +
      '<option value="moeda"'+(formatoVisivel==='moeda'?' selected':'')+'>R$</option>' +
      '<option value="tarifa"'+(formatoVisivel==='tarifa'?' selected':'')+'>R$/kWh</option>' +
      '<option value="kwh"'+(formatoVisivel==='kwh'?' selected':'')+'>kWh</option>' +
      '<option value="percentual"'+(formatoVisivel==='percentual'?' selected':'')+'>%</option>' +
      '<option value="numero"'+(formatoVisivel==='numero'?' selected':'')+'>número</option>' +
      '<option value="booleano"'+(formatoVisivel==='booleano'?' selected':'')+'>Sim/Não</option>' +
    '</select>' +
    calcHtml +
    '<button type="button" class="rm-btn" data-action="'+(withCategoria?'remove-var-row':'remove-itemvar-row')+'" data-id="' + rid + '">✕</button>' +
  '</div>';
}
function readVarRows(containerId, withCategoria){
  var rows = document.querySelectorAll('#'+containerId+' .var-row');
  var list = [];
  rows.forEach(function(row){
    var rotulo = row.querySelector('.v-rotulo').value.trim();
    if(!rotulo) return;
    var chave = row.querySelector('.v-chave').value.trim() || slugify(rotulo);
    var categoriaEl = row.querySelector('.v-categoria');
    var categoria = withCategoria && categoriaEl ? categoriaEl.value : 'mensal';
    var tipoEl = row.querySelector('.v-tipo');
    var tipo = (!withCategoria && tipoEl) ? tipoEl.value : 'numero';
    var valorPadrao = tipo === 'checkbox'
      ? (row.querySelector('.v-padrao') ? (parseNumBR(row.querySelector('.v-padrao').value) ? 1 : 0) : 0)
      : parseNumBR(row.querySelector('.v-padrao').value);
    var formato = row.querySelector('.v-formato').value;
    var item = {chave:chave, rotulo:rotulo, categoria:categoria, valorPadrao:valorPadrao, formato:formato};
    if(!withCategoria){
      item.tipo = tipo;
      var calcEl = row.querySelector('.v-calc');
      item.calculado = calcEl ? calcEl.checked : false;
    }
    list.push(item);
  });
  return list;
}

      '<p class="hint" style="margin:-8px 0 12px">Quando ligado: crie uma variável de item do tipo "Sim/Não" com a chave <code class="mono">pontoPrincipal</code> (só um ponto pode ficar marcado por vez — os outros são desmarcados automaticamente) e duas variáveis numéricas marcadas como "calculado" com as chaves <code class="mono">consumoKwh</code> e a que você escolher no campo "Qual variável do item mostrar separadamente ao cliente?" abaixo (ex.: Fio B). Nas variáveis mensais/fixas do perfil, use as chaves <code class="mono">energiaAtiva</code>, <code class="mono">fioB</code>, <code class="mono">consumoTotal</code>, <code class="mono">injecaoNaConta</code> e <code class="mono">injecaoTotal</code> — o sistema calcula: consumo do principal = energiaAtiva + (consumoTotal − injecaoNaConta); Fio B do principal = fioB; e os demais pontos dividem entre si o que sobra de injecaoTotal, com Fio B na mesma proporção R$/kWh do principal (fioB ÷ energiaAtiva).</p>' +
      '<fieldset><legend>Variáveis por item (preenchidas a cada ponto de consumo)</legend>' +

        '<button type="button" class="add-var-btn" data-action="add-itemvar-row">+ Adicionar variável do item</button>' +
      '</fieldset>' +
      '<fieldset><legend>Fórmula do item (uma ou mais linhas, roda para cada ponto)</legend>' +
        '<div class="formula-box"><textarea id="pe-item-formulas" spellcheck="false">' + escapeHtml((p.itemFormulas||(p.itemFormula?[p.itemFormula]:[])).join('\n')) + '</textarea>' +
        '<span class="hint">Uma atribuição por linha. A última linha é o valor total do ponto. Ex.: valorItem = consumoKwh*precoComDesconto - fioBPonto</span></div>' +
      '</fieldset>' +

        '<div class="formula-box"><textarea id="pe-formulas-finais" spellcheck="false">' + escapeHtml((p.formulasFinais||[]).join('\n')) + '</textarea>' +
        '<span class="hint">Use itens_&lt;chave&gt; para agregações, ex.: sum(itens_valorItem). Variável sempre disponível: ajuste.</span></div>' +
      '</fieldset>' +
      '<div class="field"><label>Rótulo de cada item no documento do cliente</label><input type="text" id="pe-rotulo-item" value="' + escapeHtml(p.rotuloItemPrefixo||'Injeção em ') + '"><span class="hint">Aparece antes do nome do ponto, ex.: "Injeção em Casa: R$ ..."</span></div>' +
      '<div class="field"><label>Qual variável do item mostrar separadamente ao cliente? (opcional, ex.: Fio B)</label><select id="pe-item-fiob-chave"></select><span class="hint">Deixe em "(nenhuma)" se não precisar mostrar um valor extra por ponto.</span></div>' +

      '<div class="field"><label>Quais campos aparecem por padrão no documento do cliente?</label>' +

      '<button class="btn btn-primary" data-action="save-profile" data-new="'+(isNew?'1':'0')+'">' + (isNew ? 'Salvar como novo modelo' : 'Salvar alterações') + '</button>' +

/* Alternar "ponto único" <-> "múltiplos pontos" troca a seção de fórmulas por um preset
   correspondente (as fórmulas de um modo não fazem sentido no outro), mas preserva
   nome/descrição já digitados e, principalmente, preserva qual perfil está sendo editado
   (via state.editingProfileId, nunca via p.id) para que "Salvar" continue atualizando o
   perfil certo em vez de criar um duplicado. */
function toggleMultiploFields(isMulti, profileOriginal){
  var nome = txt('pe-nome');
  var descricao = txt('pe-descricao');
  var novoDraft = isMulti ? presetGD2ComFioBMultiplos() : presetGD1();
  novoDraft.nome = nome;
  novoDraft.descricao = descricao;
  novoDraft.isPreset = false;
  renderProfileEditor(profileOriginal, novoDraft);
}

function lerProfileDoFormulario(){
  var isMulti = document.getElementById('pe-multiplos') ? document.getElementById('pe-multiplos').checked : false;
  var p = {
    nome: txt('pe-nome'), descricao: txt('pe-descricao'), possuiItensMultiplos: isMulti,
    variaveis: readVarRows('pe-vars', true),
    rotuloTotalCliente: txt('pe-rotulo-total') || 'VALOR FINAL A SER PAGO',
    textoIntroducao: txt('pe-intro')
  };
  if(isMulti){
    var fc = document.getElementById('pe-formulas-compartilhadas');
    p.formulasCompartilhadas = fc ? fc.value.split('\n') : [];
    p.itemVariaveis = document.getElementById('pe-item-vars') ? readVarRows('pe-item-vars', false) : [];
    var ifEl = document.getElementById('pe-item-formulas');
    p.itemFormulas = ifEl ? ifEl.value.split('\n') : [];
    var ff = document.getElementById('pe-formulas-finais');
    p.formulasFinais = ff ? ff.value.split('\n') : [];
    var riEl = document.getElementById('pe-rotulo-item');
    p.rotuloItemPrefixo = riEl ? riEl.value : 'Injeção em ';
    var fioBSel = document.getElementById('pe-item-fiob-chave');
    p.chaveItemFioB = fioBSel && fioBSel.value ? fioBSel.value : null;
    var riFioBEl = document.getElementById('pe-rotulo-item-fiob');
    p.rotuloItemFioBPrefixo = riFioBEl ? riFioBEl.value : 'Fio B em ';
    var distAutoEl = document.getElementById('pe-distribuicao-auto');
    p.distribuicaoAutomaticaPontos = distAutoEl ? distAutoEl.checked : false;
    p.formulas = [];
  } else {
    var fe = document.getElementById('pe-formulas');
    p.formulas = fe ? fe.value.split('\n') : [];
    p.formulasCompartilhadas = []; p.itemVariaveis = []; p.itemFormulas = []; p.formulasFinais = [];
    p.chaveItemFioB = null; p.rotuloItemFioBPrefixo = ''; p.distribuicaoAutomaticaPontos = false;
  }
  var totalSel = document.getElementById('pe-total-final');
  p.chaveTotalFinal = totalSel ? totalSel.value : '';
  p.camposVisiveisCliente = Array.prototype.slice.call(document.querySelectorAll('.campo-visivel-editor:checked')).map(function(cb){ return cb.dataset.chave; });
  var rotulosCampos = Object.assign({},p.rotulosCampos || {}), formatosCampos = Object.assign({},p.formatosCampos || {});
  document.querySelectorAll('.campo-rotulo-editor').forEach(function(inp){ rotulosCampos[inp.dataset.chave] = inp.value.trim() || inp.dataset.chave; });
  document.querySelectorAll('.campo-formato-editor').forEach(function(sel){ formatosCampos[sel.dataset.chave] = sel.value; });
  p.rotulosCampos = rotulosCampos;
  p.formatosCampos = formatosCampos;
  return p;
}

function popularSelectTotalFinal(p){
  var sel = document.getElementById('pe-total-final');
  if(!sel) return;
  var chaves = [];
  (p.variaveis||[]).forEach(function(v){ chaves.push(v.chave); });
  var linhas = p.possuiItensMultiplos
    ? linhasExecutaveis(p.formulasCompartilhadas).concat(linhasExecutaveis(p.formulasFinais))
    : linhasExecutaveis(p.formulas);
  linhas.forEach(function(line){ var k = parseAssignKey(line); if(k && chaves.indexOf(k)===-1) chaves.push(k); });
  sel.innerHTML = chaves.map(function(k){ return '<option value="'+k+'"'+(k===p.chaveTotalFinal?' selected':'')+'>'+k+'</option>'; }).join('');
  if(!p.chaveTotalFinal && chaves.length){ sel.value = chaves[chaves.length-1]; }
}
function popularSelectItemFioB(p){
  var sel = document.getElementById('pe-item-fiob-chave');
  if(!sel) return;
  if(!p.possuiItensMultiplos){ sel.innerHTML = ''; return; }
  var chaves = (p.itemVariaveis||[]).map(function(v){ return v.chave; });
  linhasExecutaveis(p.itemFormulas).forEach(function(line){ var k = parseAssignKey(line); if(k && chaves.indexOf(k)===-1) chaves.push(k); });
  var opcoes = '<option value="">(nenhuma)</option>' + chaves.map(function(k){
    return '<option value="'+k+'"'+(k===p.chaveItemFioB?' selected':'')+'>'+k+'</option>';
  }).join('');
  sel.innerHTML = opcoes;
}

function onTestarFormulas(){
  var p = lerProfileDoFormulario();

  (p.variaveis||[]).forEach(function(v){ valoresEntrada[v.chave] = v.valorPadrao; });
  valoresEntrada.ajuste = 0;
  var itensInput = null;
  if(p.possuiItensMultiplos){
    var itemVals = {}; (p.itemVariaveis||[]).forEach(function(v){ itemVals[v.chave] = v.valorPadrao; });
    itensInput = [ Object.assign({nome:'Item de teste 1'}, itemVals), Object.assign({nome:'Item de teste 2'}, itemVals) ];
  }
  var resultado = avaliarPerfil(p, valoresEntrada, itensInput);
  var selectedBefore = document.getElementById('pe-total-final') ? document.getElementById('pe-total-final').value : p.chaveTotalFinal;
  p.chaveTotalFinal = selectedBefore;
  popularSelectTotalFinal(p);
  popularSelectItemFioB(p);

async function onSaveProfile(isNew){

  if(!p.chaveTotalFinal){ toast('Escolha qual variável representa o valor final a pagar.'); return; }

/* Compara e aplica as correções dos modelos padrão (GD1/GD2) automaticamente.
   Só mexe em perfis com isPreset:true — no momento em que o usuário edita ou
   duplica um preset, o próprio código já marca isPreset:false (ver salvarPerfil
   e duplicarPerfil), então perfis personalizados NUNCA são tocados aqui.
   mostrarToast=true: sempre avisa (usado pelo botão manual).
   mostrarToast=false: só avisa se algo realmente mudou (usado no login automático),
   para não incomodar o usuário toda vez que abrir o app sem necessidade. */
async function sincronizarModelosPadrao(mostrarToast){
  var anteriores = copiarDados(state.profiles);
  var novos = presetsPadrao();
  var nomesAtuais = novos.map(function(np){ return np.nome; });
  var atualizados = 0, adicionados = 0, removidos = 0, presosEmUso = [];
  novos.forEach(function(np){
    var existente = state.profiles.find(function(p){ return p.isPreset && p.nome === np.nome; });
    if(existente){
      var comparavel = Object.assign({}, np, { id: existente.id });
      var mudou = assinaturaDados(existente) !== assinaturaDados(comparavel);
      if(mudou){
        np.id = existente.id; /* preserva o id: clientes já vinculados continuam apontando certo */
        var idx = state.profiles.indexOf(existente);
        state.profiles[idx] = np;
        atualizados++;
      }
    } else {
      state.profiles.push(np);
      adicionados++;
    }
  });
  /* Presets antigos que saíram da lista (ex.: um modelo descontinuado) são removidos
     sozinhos, desde que nenhum cliente ainda esteja vinculado a eles — só apagamos o
     que dá pra apagar com segurança, sem quebrar vínculo de cliente nenhum. */
  state.profiles = state.profiles.filter(function(p){
    if(!p.isPreset || nomesAtuais.indexOf(p.nome) > -1) return true;
    var emUso = state.clients.some(function(c){ return c.profileId === p.id; });
    if(emUso){ presosEmUso.push(p.nome); return true; }
    removidos++;
    return false;
  });
  if(atualizados > 0 || adicionados > 0 || removidos > 0){
    if(!await saveProfiles()){state.profiles=anteriores;throw new Error('Não foi possível salvar os modelos padrão. Confira a conexão e tente novamente.');}
    if(mostrarToast){
      var partes = [];
      if(atualizados) partes.push(atualizados + ' corrigido(s)');
      if(adicionados) partes.push(adicionados + ' novo(s)');
      if(removidos) partes.push(removidos + ' descontinuado(s) removido(s)');
      toast('Modelos padrão atualizados (' + partes.join(', ') + '). Clientes e orçamentos não foram alterados.');
    }
  } else if(mostrarToast === true){
    toast('Os modelos padrão já estavam atualizados.');
  }
  if(presosEmUso.length){
    toast('Modelo(s) descontinuado(s) ainda em uso por algum cliente, então não foram removidos: ' + presosEmUso.join(', ') + '. Troque o perfil desse(s) cliente(s) em "Editar cliente" se quiser limpar.');
  }
  return { atualizados: atualizados, adicionados: adicionados, removidos: removidos };
}
async function atualizarModelosPadrao(){
  try{await sincronizarModelosPadrao(true);renderPerfis();}
  catch(e){console.error(e);toast(e.message || 'Não foi possível atualizar os modelos. Tente novamente.');}
}

async function saveClientFromModal(existingId){
  var nome = limparTextoExibicao(txt('m-nome'));
  if(!nome){ toast('Informe o nome do cliente.'); return; }
  var profileId = document.getElementById('m-profile').value;
  var programacao=lerVigenciasModal();if(programacao.erro){toast(programacao.erro);return;}
  var overridesFixos = {};
  document.querySelectorAll('.m-fixo').forEach(function(inp){ overridesFixos[inp.dataset.chave] = parseNumBR(inp.value); });
  var pontosTexto = txt('m-pontos');
  var pontosPadrao = pontosTexto ? pontosTexto.split('\n').map(function(linha){
    var partes = linha.split(' - ');
    if(partes.length >= 2){ return { nome: limparTextoExibicao(partes[0]), uc: limparTextoExibicao(partes.slice(1).join(' - ')) }; }
    return { nome: limparTextoExibicao(linha), uc: '' };
  }).filter(function(p){ return p.nome; }) : [];

  var existente = existingId ? state.clients.find(function(c){ return c.id === existingId; }) : null;
  var data = Object.assign({}, existente || {}, {
    id: existingId || uid(), nome: nome, uc: limparTextoExibicao(txt('m-uc')), profileId: profileId,
    documento:limparTextoExibicao(txt('m-documento')), local:limparTextoExibicao(txt('m-local')), projeto:txt('m-projeto'),
    overridesFixos: overridesFixos, pontosPadrao: pontosPadrao,
    vigenciasTarifarias: programacao.rows,
    chavePix: txt('m-pix'), banco: txt('m-banco'), beneficiario: txt('m-beneficiario'), condicaoPagamento: txt('m-condicao'),
    locadorPagaFatura: !!(document.getElementById('m-paga-fatura') && document.getElementById('m-paga-fatura').checked),
    cidadePix: txt('m-cidade-pix'),
    gerarQrCodePix: !!(document.getElementById('m-gerar-qr-pix') && document.getElementById('m-gerar-qr-pix').checked),
    camposVisiveisPadrao: existente ? existente.camposVisiveisPadrao : undefined
  });
  var clients = state.clients.slice();
  if(existingId){
    var idx = state.clients.findIndex(function(c){ return c.id === existingId; });
    if(idx > -1) clients[idx] = data;
  } else { clients.push(data); }
  if(!await saveClients(clients)){toast('Não foi possível salvar o cliente. Confira a conexão e tente novamente.');return;}
  state.clients = clients;
  state.selectedClientId = data.id;
  closeModal(); renderAll();
  toast('Cliente salvo.');
}
async function deleteClient(id){
  if(!await salvarColecoesEstado([
    {campo:'clients',chave:'usinas:v2:clients',valor:state.clients.filter(function(c){return c.id !== id;})},
    {campo:'quotes',chave:'usinas:v2:quotes',valor:state.quotes.filter(function(q){return q.clientId !== id;})}
  ]))return;
  if(state.selectedClientId === id){ state.selectedClientId = state.clients.length ? state.clients[0].id : null; }
  closeModal(); renderAll();
  toast('Cliente excluído.');
}

var authMode = 'signin'; /* 'signin' | 'signup' */
var authMsg = null; /* {tipo:'error'|'info', texto} */
var authStep = 'form'; /* 'form' | 'verify' — 'verify' = tela de código enviado por e-mail */
var pendingSignup = null; /* {email, username} — guardado entre o cadastro e a confirmação do código */

/* Nome de usuário: letras/números/ponto/underscore, começando com letra, 3–30 caracteres. */
function usernameValido(u){ return /^[A-Za-z][A-Za-z0-9_.]{2,29}$/.test(u || ''); }

function renderAuthConfigWarning(motivo){
  var texto = motivo === 'sdk'
    ? '<p>A biblioteca do Supabase não carregou (conexão instável, bloqueador de scripts, ou o CDN está fora do ar). Verifique sua internet e recarregue a página.</p>'
    : '<p>Este arquivo precisa da URL e da anon key do seu projeto Supabase para funcionar. Abra o arquivo, procure por <code>SUPABASE_URL</code> e <code>SUPABASE_ANON_KEY</code> perto do início do &lt;script&gt;, e cole os valores do seu projeto (Painel do Supabase → Settings → API). Depois, rode o script <code>setup-supabase.sql</code> uma vez no SQL Editor do Supabase.</p>';
  document.getElementById('auth-root').innerHTML =
    '<div class="auth-config-warning">' +
      '<h2 style="font-family:var(--serif);margin-top:0">' + (motivo==='sdk' ? 'Não foi possível carregar o Supabase' : 'Supabase ainda não configurado') + '</h2>' +
      texto +
    '</div>';
  document.getElementById('app-root').style.display = 'none';
  document.getElementById('app-footer').style.display = 'none';
}

function renderAuthScreen(){
  if(authMode === 'signup' && authStep === 'verify'){ renderAuthVerifyScreen(); return; }
  var msgHtml = authMsg ? '<div class="auth-msg ' + authMsg.tipo + '">' + escapeHtml(authMsg.texto) + '</div>' : '';
  var usernameFieldHtml = authMode === 'signup'
    ? '<div class="field"><label>Nome de usuário</label>' +
      '<input type="text" id="auth-username" autocomplete="off" placeholder="usuario123" maxlength="30">' +
      '<span class="hint">Letras, números, ponto ou _ — começando com letra (3 a 30 caracteres). Precisa ser único.</span></div>'
    : '';
  var loginLabel = authMode === 'signin' ? 'E-mail ou nome de usuário' : 'E-mail';
  var loginPlaceholder = authMode === 'signin' ? 'voce@exemplo.com ou seu usuário' : 'voce@exemplo.com';
  document.getElementById('auth-root').innerHTML =
    '<div class="auth-screen"><div class="auth-card">' +
      '<div class="brand" style="flex-direction:column;text-align:center;margin-bottom:18px">' + sunIconSvg('clamp(90px,22vw,130px)') + '<span style="color:var(--ink-soft);font-size:12.5px;margin-top:6px">orçamentos de aluguel de usinas</span></div>' +
      '<p class="hint"><a href="/#entrar">Entrar pelo IG Base e acessar todos os subsites</a></p>' +
      '<div class="auth-tabs">' +
        '<button class="auth-tab-btn' + (authMode==='signin'?' active':'') + '" data-action="auth-set-mode" data-mode="signin">Entrar</button>' +
        '<button class="auth-tab-btn' + (authMode==='signup'?' active':'') + '" data-action="auth-set-mode" data-mode="signup">Criar conta</button>' +
      '</div>' +
      msgHtml +
      usernameFieldHtml +
      '<div class="field"><label>' + loginLabel + '</label><input type="text" id="auth-email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="' + loginPlaceholder + '"></div>' +
      '<div class="field"><label>Senha</label><input type="password" id="auth-password" autocomplete="' + (authMode==='signin'?'current-password':'new-password') + '" placeholder="••••••••"></div>' +
      '<div class="btn-row"><button class="btn btn-primary btn-block" style="width:100%;justify-content:center" data-action="' + (authMode==='signin'?'sign-in':'sign-up') + '">' + (authMode==='signin'?'Entrar':'Criar conta') + '</button></div>' +
    '</div></div>';
  document.getElementById('app-root').style.display = 'none';
  document.getElementById('app-footer').style.display = 'none';
}

function renderAuthVerifyScreen(){
  var msgHtml = authMsg ? '<div class="auth-msg ' + authMsg.tipo + '">' + escapeHtml(authMsg.texto) + '</div>' : '';
  var email = pendingSignup ? pendingSignup.email : '';
  document.getElementById('auth-root').innerHTML =
    '<div class="auth-screen"><div class="auth-card">' +
      '<div class="brand" style="flex-direction:column;text-align:center;margin-bottom:18px">' + sunIconSvg('clamp(90px,22vw,130px)') + '</div>' +
      '<h1>Confirme seu e-mail</h1>' +
      '<div class="sub">Enviamos um código de 6 dígitos para<br><b>' + escapeHtml(email) + '</b></div>' +
      msgHtml +
      '<div class="field"><label>Código de verificação</label>' +
      '<input type="text" id="auth-code" class="auth-code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="Código"></div>' +
      '<div class="btn-row"><button class="btn btn-primary btn-block" style="width:100%;justify-content:center" data-action="confirm-code">Confirmar código</button></div>' +
      '<div class="auth-resend">Não recebeu? <button type="button" class="btn btn-ghost btn-sm" data-action="resend-code">Reenviar código</button></div>' +
      '<div class="btn-row" style="justify-content:center;margin-top:6px"><button type="button" class="btn btn-ghost btn-sm" data-action="cancel-verify">Voltar</button></div>' +
    '</div></div>';
  document.getElementById('app-root').style.display = 'none';
  document.getElementById('app-footer').style.display = 'none';
}

function setAuthMode(mode){ authMode = mode; authStep = 'form'; authMsg = null; pendingSignup = null; renderAuthScreen(); }

var signInBusy=false;
async function onSignIn(){
  if(signInBusy)return;
  var entrada=txt('auth-email'),senha=document.getElementById('auth-password').value;
  if(!entrada||!senha){authMsg={tipo:'error',texto:'Preencha e-mail ou nome de usuário e senha.'};renderAuthScreen();return;}
  signInBusy=true;var button=document.querySelector('[data-action="sign-in"]');if(button)button.disabled=true;
  try{await IGLogin.signIn(supabaseClient,entrada,senha);}
  catch(e){authMsg={tipo:'error',texto:e.message};renderAuthScreen();}
  finally{signInBusy=false;if(button?.isConnected)button.disabled=false;}
}

async function onSignUp(){
  var email = txt('auth-email'), senha = document.getElementById('auth-password').value;
  var username = txt('auth-username');
  if(!email || !senha || !username){ authMsg = {tipo:'error', texto:'Preencha nome de usuário, e-mail e senha.'}; renderAuthScreen(); return; }
  if(senha.length < 6){ authMsg = {tipo:'error', texto:'A senha precisa ter pelo menos 6 caracteres.'}; renderAuthScreen(); return; }
  if(!usernameValido(username)){
    authMsg = {tipo:'error', texto:'Nome de usuário inválido — use letras, números, ponto ou _, começando com letra (3 a 30 caracteres).'};
    renderAuthScreen(); return;
  }

  /* 1) Verificação de nome de usuário único (checagem no banco via função RPC,
        pois o cadastro ainda não tem uma sessão autenticada nesse momento). */
  var disponivel;
  try{ disponivel = await supabaseClient.rpc('username_disponivel', { p_username: username }); }
  catch(e){ disponivel = { error: e }; }
  if(disponivel.error){
    authMsg = {tipo:'error', texto:'Não foi possível verificar o nome de usuário agora. Confirme se o script SQL de configuração foi executado no Supabase e tente novamente.'};
    renderAuthScreen(); return;
  }
  if(disponivel.data === false){
    authMsg = {tipo:'error', texto:'Esse nome de usuário já está em uso. Escolha outro.'};
    renderAuthScreen(); return;
  }

  /* 2) Cria a conta no Supabase Auth (o username fica também salvo nos metadados do
        usuário, como referência extra, além da tabela perfis_usuario). */
  var resp = await supabaseClient.auth.signUp({ email: email, password: senha, options: { data: { username: username } } });
  if(resp.error){ authMsg = {tipo:'error', texto: resp.error.message}; renderAuthScreen(); return; }

  var user = resp.data && resp.data.user;

  /* 3) Verificação de e-mail único: quando o e-mail já pertence a uma conta CONFIRMADA,
        o Supabase (por segurança, para não revelar quais e-mails existem) responde sem
        erro e sem enviar e-mail, mas com "identities" vazio — é assim que detectamos
        o reuso e bloqueamos o cadastro. */
  var emailJaCadastrado = user && Array.isArray(user.identities) && user.identities.length === 0;
  if(emailJaCadastrado){
    authMsg = {tipo:'error', texto:'Este e-mail já está cadastrado. Faça login ou use "Esqueci minha senha".'};
    authMode = 'signin';
    renderAuthScreen();
    return;
  }

  if(user && !resp.data.session){
    /* Conta criada (ou reenvio de uma conta ainda não confirmada) — falta digitar o código. */
    pendingSignup = { email: email, username: username };
    authStep = 'verify';
    authMsg = null;
    renderAuthScreen();
    return;
  }

  /* Caso a confirmação por e-mail esteja desativada no projeto, a sessão já vem pronta
     e onAuthStateChange mostra o app sozinho — só falta gravar o username. */
  if(user){ await salvarUsername(user.id, username, email); }
}

/* 4) Confirmação via código: o usuário digita o código de 6 dígitos recebido por e-mail
      (o template "Confirm signup" do Supabase precisa estar configurado para mostrar
      {{ .Token }} — veja a explicação enviada junto com este arquivo). Só depois de
      confirmado o código a conta é ativada e uma sessão é aberta. */
async function onConfirmarCodigo(){
  if(!pendingSignup) return;
  var codigo = txt('auth-code');
  if(!codigo){ authMsg = {tipo:'error', texto:'Digite o código recebido por e-mail.'}; renderAuthScreen(); return; }
  var resp = await supabaseClient.auth.verifyOtp({ email: pendingSignup.email, token: codigo, type: 'signup' });
  if(resp.error){
    authMsg = {tipo:'error', texto:'Código inválido ou expirado. Confira o número ou peça um novo código.'};
    renderAuthScreen(); return;
  }
  var user = resp.data && resp.data.user;
  var dadosPendentes = pendingSignup;
  pendingSignup = null; authStep = 'form'; authMsg = null;
  if(user){ await salvarUsername(user.id, dadosPendentes.username, dadosPendentes.email); }
  /* onAuthStateChange detecta a nova sessão e chama aoLogar() automaticamente. */
}
async function onReenviarCodigo(){
  if(!pendingSignup) return;
  var resp = await supabaseClient.auth.resend({ type: 'signup', email: pendingSignup.email });
  if(resp.error){ authMsg = {tipo:'error', texto: resp.error.message}; }
  else { authMsg = {tipo:'info', texto:'Novo código enviado para ' + pendingSignup.email + '.'}; }
  renderAuthScreen();
}
function onCancelarVerificacao(){
  pendingSignup = null; authStep = 'form'; authMsg = null; authMode = 'signin';
  renderAuthScreen();
}
/* Grava o nome de usuário (único) vinculado ao usuário autenticado. Se, por uma corrida
   rara, alguém tiver acabado de registrar o mesmo nome, a restrição UNIQUE do banco
   rejeita a gravação — a conta continua válida, só o username fica pendente. */
async function salvarUsername(userId, username, email){
  try{
    var resp = await supabaseClient.from('perfis_usuario').upsert(
      { user_id: userId, username: username, email: email },
      { onConflict: 'user_id' }
    );
    if(resp.error){
      console.error(resp.error);
      toast('Conta criada, mas não foi possível reservar esse nome de usuário (pode ter sido usado por outra pessoa agora há pouco).');
    }
  }catch(e){ console.error(e); }
}
async function onSignOut(){
  await supabaseClient.auth.signOut();
  /* onAuthStateChange cuida de limpar o estado e voltar pra tela de login */
}

/* ============================================================
   VERSÃO E AVISO DE NOVIDADES (padrão IG Base — mesmo código nos dois sites)
   A cada atualização grande: subir IG_BASE_VERSION e reescrever IG_BASE_CHANGELOG.
   O aviso aparece uma vez por versão por navegador (localStorage compartilhado
   entre o site principal e os subsites, pois ficam no mesmo domínio).
   ============================================================ */
var IG_BASE_VERSION = window.IGBaseRelease?.version || '1.10.07';
var IG_BASE_RELEASE_ID = window.IGBaseRelease?.releaseId || '1.10.07-2026-10-23';
var IG_BASE_CHANGELOG = [
  "Solar Organization não mostra mais o aviso de modelos padrão a cada entrada.",
  "Visual padronizado com as cores e as letras do IG Base."
];
function igbMostrarChangelog(){
  var KEY = 'igbase_changelog_visto';
  try{ if(window.localStorage.getItem(KEY) === IG_BASE_RELEASE_ID) return; }
  catch(e){ return; } /* sem acesso ao armazenamento: melhor não insistir a cada carregamento */
  if(document.getElementById('igb-cl-overlay')) return;
  var check = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  var spark = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/></svg>';
  var itens = IG_BASE_CHANGELOG.map(function(t){ return '<li>' + check + '<span>' + escapeHtml(t) + '</span></li>'; }).join('');
  var wrap = document.createElement('div');
  wrap.id = 'igb-cl-overlay';
  wrap.className = 'igb-cl-overlay';
  wrap.innerHTML =
    '<div class="igb-cl-card" role="dialog" aria-modal="true" aria-labelledby="igb-cl-title">' +
      '<div class="igb-cl-top"><span class="igb-cl-badge">' + spark + '</span><span class="igb-cl-ver">Versão ' + escapeHtml(IG_BASE_VERSION) + '</span></div>' +
      '<h2 class="igb-cl-title" id="igb-cl-title">Novidades do IG Base</h2>' +
      '<p class="igb-cl-sub">Veja o que mudou nesta atualização:</p>' +
      '<ul class="igb-cl-list">' + itens + '</ul>' +
      '<button type="button" class="igb-cl-btn" id="igb-cl-ok">Entendi</button>' +
    '</div>';
  function fechar(){
    try{ window.localStorage.setItem(KEY, IG_BASE_RELEASE_ID); }catch(e){}
    document.removeEventListener('keydown', onKey);
    if(wrap.parentNode) wrap.parentNode.removeChild(wrap);
  }
  function onKey(e){ if(e.key === 'Escape') fechar(); }
  wrap.addEventListener('click', function(e){ if(e.target === wrap) fechar(); });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(wrap);
  var ok = document.getElementById('igb-cl-ok');
  ok.addEventListener('click', fechar);
  ok.focus();
}

  var el = document.querySelector('#app-footer .version');
  if(el) el.textContent = 'IG Base v' + IG_BASE_VERSION;
}

var cargaUsuario = null, usuarioProntoId = null, geracaoInicio = 0;
function esperarComLimite(tarefa, ms){
  return new Promise(function(resolve,reject){
    var timer = setTimeout(function(){reject(new Error('Tempo de carregamento excedido.'));},ms);
    Promise.resolve(tarefa).then(function(v){clearTimeout(timer);resolve(v);},function(e){clearTimeout(timer);reject(e);});
  });
}
function renderInicio(mensagem, erro){
  document.getElementById('app-root').style.display = 'none';
  document.getElementById('app-footer').style.display = 'none';
  document.getElementById('auth-root').innerHTML = '<div class="auth-screen startup-screen"><div class="startup-card" aria-busy="' + (!erro) + '">' +
    '<div class="startup-brand">' + sunIconSvg('90px') + '</div>' +
    (erro?'':'<div class="startup-spinner" aria-hidden="true"></div>') +
    '<h1 class="startup-title">' + (erro?'Não foi possível carregar o sistema':'Carregando o sistema') + '</h1>' +
    '<p class="startup-message" role="' + (erro?'alert':'status') + '" aria-live="polite">' + escapeHtml(mensagem) + '</p>' +
    (erro?'<div class="btn-row"><button class="btn btn-primary" data-action="retry-startup">Tentar novamente</button>' +
      (currentUser?'<button class="btn" data-action="sign-out">Sair da conta</button>':'') + '</div>':'') + '</div></div>';
}
async function carregarSdkSupabase(){
  if(window.supabase && typeof window.supabase.createClient === 'function') return true;
  var urls = ['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js',
    'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'];
  for(var i=0;i<urls.length;i++){
    try{
      await new Promise(function(resolve,reject){
        var script = document.createElement('script'), acabou = false;
        var timer = setTimeout(function(){finalizar(new Error('A biblioteca não respondeu.'));},8000);
        function finalizar(erro){
          if(acabou) return; acabou = true; clearTimeout(timer); script.onload = script.onerror = null;
          if(erro){script.remove();reject(erro);}else resolve();
        }
        script.async = true; script.src = urls[i];
        script.onload = function(){finalizar(window.supabase && typeof window.supabase.createClient === 'function' ? null : new Error('Biblioteca inválida.'));};
        script.onerror = function(){finalizar(new Error('Falha ao carregar a biblioteca.'));};
        document.head.appendChild(script);
      });
      return true;
    }catch(e){console.warn('Tentativa de carregar a biblioteca indisponível.');}
  }
  return false;
}
function aoLogar(user){
  if(cargaUsuario && currentUser && currentUser.id === user.id) return cargaUsuario;
  if(usuarioProntoId === user.id && currentUser && currentUser.id === user.id) return Promise.resolve(true);
  currentUser = user; var geracao = ++geracaoInicio;
  renderInicio('Carregando seus clientes, perfis e faturas…',false);
  companyService=null;state.profiles = []; state.clients = []; state.quotes = []; state.docConfig = docConfigPadrao(); state.username = ''; state.buscaCliente = ''; state.buscaHistorico = ''; state.tipoCliente='';state.ordemCliente='cliente-az';state.filtrosHistorico=null;
  state.selectedClientId = null; state.activeTab = 'novo'; state.editingProfileId = null; state.lastDraft = null;
  var tarefa = (async function(){
    try{
      await loadAll();
      if(geracao !== geracaoInicio || !currentUser || currentUser.id !== user.id) return false;
      document.getElementById('auth-root').innerHTML = '';
      document.getElementById('app-root').style.display = '';
      document.getElementById('app-footer').style.display = '';
      renderAll(); mostrarVersaoNoRodape(); igbMostrarChangelog(); usuarioProntoId = user.id;
      return true;
    }catch(e){
      console.error(e);
      if(geracao === geracaoInicio) renderInicio('Confira sua conexão e tente novamente. Não foi possível carregar seus dados; seus registros salvos não foram substituídos.',true);
      return false;
    }finally{if(geracao === geracaoInicio) cargaUsuario = null;}
  })();
  cargaUsuario = tarefa; return tarefa;
}
async function tentarInicioNovamente(){
  if(currentUser && supabaseClient) return aoLogar(currentUser);
  window.location.reload();
}
function aoDeslogar(){
  geracaoInicio++; cargaUsuario = null; usuarioProntoId = null;
  currentUser = null;
  companyService=null;state.profiles = []; state.clients = []; state.quotes = []; state.docConfig = docConfigPadrao(); state.username = ''; state.buscaCliente = ''; state.buscaHistorico = ''; state.tipoCliente='';state.ordemCliente='cliente-az';state.filtrosHistorico=null;
  state.selectedClientId = null; state.lastDraft = null;
  authMsg = null; authMode = 'signin';
  renderAuthScreen();
}

/* ============================================================
   RENDER GERAL
   ============================================================ */
function renderTabContent(){
  var el = document.getElementById('tab-content');
  el.style.opacity = '0';
  el.style.transform = 'translateY(6px)';
  if(state.activeTab === 'novo') renderNovoOrcamento();
  else renderHistorico();
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';
    });
  });
}
function renderAll(){ renderSidebar(); renderTopbar(); renderTabs(); renderTabContent(); }

/* ============================================================
   EVENTOS (DELEGAÇÃO)
   ============================================================ */
document.addEventListener('input', function(e){
  atualizarFiltroLista(e.target);
  if(e.target.id === 'busca-cliente'){ state.buscaCliente = e.target.value; atualizarListaClientes(); }
  if(e.target.id === 'busca-historico'){ state.buscaHistorico = e.target.value; atualizarListaHistorico(); }
  if(e.target.classList && e.target.classList.contains('v-rotulo')){
    var row = e.target.closest('.var-row');
    var chaveInput = row ? row.querySelector('.v-chave') : null;
    if(chaveInput && chaveInput.dataset.touched !== '1'){ chaveInput.value = slugify(e.target.value); }
  }
  if(e.target.classList && e.target.classList.contains('v-chave')){ e.target.dataset.touched = '1'; }
});

/* Auto-salva um rascunho local (com atraso curto) sempre que o usuário digita
   nos campos do orçamento — assim, se a página recarregar (ex.: ao abrir um
   PDF gerado e voltar), o que já foi digitado não se perde. */
var _rascunhoTimer = null;
document.addEventListener('input', function(e){
  var t = e.target;
  registrarEdicaoSaldo(t);
  var relevante = t.id === 'f-ref-mes' || t.id === 'f-ref-ano' || t.id === 'f-ajuste' || t.id === 'f-observacoes' || t.id === 'saldo-correcao-motivo' || t.id === 'confirmar-saldo-conta' || t.id === 'motivo-conciliacao-saldo' ||
    (t.classList && (t.classList.contains('in-mensal') || t.classList.contains('energia-documento-input') || t.classList.contains('item-nome') || t.classList.contains('item-uc') || t.classList.contains('item-val')));
  if(!relevante) return;
  atualizarResumoLancamento();
  marcarFaturaDesatualizada();
  if(t.classList && (t.classList.contains('in-mensal') || t.classList.contains('item-val') || t.classList.contains('energia-documento-input'))){
    var consumoEl = document.getElementById('consumo-real-automatico');
    var dicaEl = document.getElementById('consumo-real-dica');
    if(consumoEl){consumoEl.value='';consumoEl.placeholder='Recalcule para atualizar';}
    if(dicaEl) dicaEl.textContent='Os dados mudaram. Clique em Calcular orçamento para atualizar o consumo real.';
    var conferenciaEl = document.getElementById('gd1-conferencia-consumo');
    if(conferenciaEl) conferenciaEl.textContent='Os dados mudaram. Recalcule para conferir consumo compensado + não compensado.';
    var saldoEl = document.getElementById('saldo-final-automatico');
    var usoEl = document.getElementById('saldo-resumo-uso');
    if(saldoEl){saldoEl.value='';saldoEl.placeholder='Recalcule para atualizar';}
    if(usoEl) usoEl.textContent='Os dados mudaram. Calcule o orçamento para atualizar o saldo utilizado e o saldo final.';
  }
  clearTimeout(_rascunhoTimer);
  _rascunhoTimer = setTimeout(salvarRascunhoAtual, 400);
});

/* Dentro de "Pontos de consumo", no máximo um ponto pode ser "principal" por vez —
   marcar um desmarca os outros automaticamente (comportamento de rádio). */
document.addEventListener('change', function(e){
  atualizarFiltroLista(e.target);
  var t = e.target;
  if(t.id==='lancamento-modo'){modoLancamentoFormulario=t.value==='fatura'?'fatura':'manual';if(modoLancamentoFormulario==='manual' && (leituraEquatorial || leituraPreparando))cancelarLeituraConta();atualizarModoLancamento();marcarFaturaDesatualizada();salvarRascunhoAtual();return;}
  atualizarResumoLancamento();
  if((t.id==='excedente-exibir-resumo' || t.id==='excedente-exibir-interno') && importacaoFormulario){importacaoFormulario[t.id==='excedente-exibir-resumo'?'exibirExcedenteResumo':'exibirExcedenteInterno']=t.checked;renderExcedenteRecebido();marcarFaturaDesatualizada();salvarRascunhoAtual();return;}
  if(t.id==='gd2-geracao-base' && importacaoFormulario){importacaoFormulario.usarGeracaoBase=t.checked;salvarRascunhoAtual();}
  if(t.id === 'eq-arquivo' && (importacaoEquatorial || leituraEquatorial || leituraPreparando))cancelarLeituraConta();
  if(t.matches && t.matches('.in-mensal,.item-val,.energia-documento-input,#f-ref-mes,#f-ref-ano,#confirmar-saldo-conta')){marcarFaturaDesatualizada();salvarRascunhoAtual();}
  if(t.classList && t.classList.contains('item-val-checkbox') && t.dataset.chave === 'pontoPrincipal' && t.checked){
    var wrap = document.getElementById('pontos-container');
    if(!wrap) return;
    wrap.querySelectorAll('.item-val-checkbox[data-chave="pontoPrincipal"]').forEach(function(cb){
      if(cb !== t) cb.checked = false;
    });
  }
  registrarEdicaoSaldo(t);
  if(t.matches && t.matches('#f-ref-mes,#f-ref-ano,.item-uc,[data-chave="pontoPrincipal"]'))salvarRascunhoAtual();
});

document.addEventListener('click', function(e){
  var overlay = e.target.closest('[data-action="close-modal-bg"]');
  if(overlay && !e.target.closest('[data-stop-close]')){ closeModal(); return; }

  var el = e.target.closest('[data-action]');
  if(!el) return;
  var action = el.dataset.action;
  if(action === 'reset-consumo-automatico'){
    ['consumoRealKwh','consumoCompensadoKwh'].forEach(function(k){var input=document.querySelector('.energia-documento-input[data-chave="'+k+'"]');if(input)input.value='';});
    atualizarLeituraPreservada();salvarRascunhoAtual();onCalcular();return;
  }
  if(action === 'reset-saldo-automatico'){
    var saldoAntigo = document.querySelector('.energia-documento-input[data-chave="saldoUtilizadoKwh"]');
    if(saldoAntigo) saldoAntigo.value = '';
    el.hidden = true;
    salvarRascunhoAtual(); onCalcular(); return;
  }
  var id = el.dataset.id;

  switch(action){
    case 'auth-set-mode': setAuthMode(el.dataset.mode); break;
    case 'retry-startup': tentarInicioNovamente(); break;
    case 'sign-in': onSignIn(); break;
    case 'sign-up': onSignUp(); break;
    case 'sign-out': onSignOut(); break;
    case 'confirm-code': onConfirmarCodigo(); break;
    case 'resend-code': onReenviarCodigo(); break;
    case 'cancel-verify': onCancelarVerificacao(); break;

    case 'select-client': selectClient(id); break;
    case 'new-client': openClientModal(null); break;
    case 'limpar-filtros-clientes': limparFiltrosClientes(); break;
    case 'limpar-filtros-historico': limparFiltrosHistorico(); break;
    case 'limpar-busca-cliente': limparBuscaCliente(); break;
    case 'limpar-busca-historico': limparBuscaHistorico(); break;
    case 'edit-client': openClientModal(id); break;
    case 'delete-client-confirm': handleConfirmClick(el, function(){ deleteClient(id); }); break;
    case 'close-modal': closeModal(); break;
    case 'save-client': saveClientFromModal(id || null); break;
    case 'set-tab': setTab(el.dataset.tab); break;

    case 'add-ponto': addPontoRow(); marcarFaturaDesatualizada(); break;
    case 'remove-ponto': removePontoRow(id); marcarFaturaDesatualizada(); break;
    case 'recuperar-saldo-anterior': atualizarSaldoAnterior(true);marcarFaturaDesatualizada();salvarRascunhoAtual();break;
    case 'ler-conta-equatorial': lerContaEquatorial(false);break;
    case 'ler-conta-ocr': lerContaEquatorial(true);break;
    case 'cancelar-importacao': cancelarLeituraConta();break;
    case 'aplicar-conta-equatorial': aplicarContaEquatorial();break;
    case 'variacao-conta-gd2': completarVariacaoContaGd2();break;
    case 'calcular': onCalcular(); break;
    case 'salvar-historico': onSalvarHistorico(); break;
    case 'baixar-doc': baixarDoc(); break;
    case 'baixar-png': baixarPng(); break;
    case 'baixar-pdf': baixarPdf('cliente'); break;
    case 'baixar-pdf-interno': baixarPdf('interno'); break;

    case 'abrir-quote': abrirQuote(id); break;
    case 'duplicar-quote': duplicarQuote(id); break;
    case 'delete-quote-confirm': handleConfirmClick(el, function(){ deleteQuote(id); }); break;

    case 'new-profile': onNewProfile(); break;
    case 'edit-profile': onEditProfile(id); break;
    case 'duplicate-profile': onDuplicateProfile(id); break;
    case 'delete-profile-confirm': handleConfirmClick(el, function(){ onDeleteProfile(id); }); break;
    case 'cancel-edit-profile': onCancelEditProfile(); break;
    case 'save-profile': onSaveProfile(el.dataset.new === '1'); break;
    case 'testar-formulas': onTestarFormulas(); break;
    case 'add-var-row': addVarRow(); break;
    case 'remove-var-row': removeVarRow(id); break;
    case 'add-itemvar-row': addItemVarRow(); break;
    case 'remove-itemvar-row': removeItemVarRow(id); break;

    case 'atualizar-modelos-padrao': atualizarModelosPadrao(); break;
    case 'abrir-config': abrirConfigModal(); break;
    case 'abrir-perfis': abrirPerfisModal(); break;
    case 'remove-logo': removerLogo(); break;
    case 'add-dc-telefone': addDcTelefoneRow(); break;
    case 'remove-dc-telefone': removeDcTelefoneRow(el); break;
    case 'salvar-doc-config': salvarDocConfig(); break;
    case 'salvar-campos-padrao': salvarCamposComoPadrao(); break;
    case 'reset-all-confirm': handleConfirmClick(el, function(){ resetAllData(); }); break;
  }
});

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  try{
    if(!SUPABASE_CONFIGURADO){ renderAuthConfigWarning('config'); return; }
    renderInicio('Conectando ao sistema…',false);
    SUPABASE_SDK_OK = await carregarSdkSupabase();
    if(!SUPABASE_SDK_OK){renderInicio('A biblioteca de conexão não carregou. Confira sua conexão ou bloqueador de scripts e tente novamente.',true);return;}
    supabaseClient = window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    supabaseClient.auth.onAuthStateChange(function(event,session){
      /* As consultas ficam fora do callback de autenticação, evitando esperar
         por requisições que também precisam do bloqueio interno da sessão. */
      setTimeout(function(){
        if(session && session.user){ aoLogar(session.user); }
        else if(event === 'SIGNED_OUT'){aoDeslogar();}
        else if(!currentUser){renderAuthScreen();}
      },0);
    });
    var sessionResp = await esperarComLimite(supabaseClient.auth.getSession(),15000);
    if(sessionResp.error) throw sessionResp.error;
    var session = sessionResp.data && sessionResp.data.session;
    if(session && session.user){await aoLogar(session.user);}
    else if(!currentUser){renderAuthScreen();}
  }catch(e){
    console.error(e);
    if(!usuarioProntoId && !cargaUsuario) renderInicio('Não foi possível verificar sua sessão. Confira a conexão e tente novamente.',true);
  }
})();

})();
