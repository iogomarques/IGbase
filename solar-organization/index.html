<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Solar Organization | IG Base</title>
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-ig-base.png?v=1.10.07">
<!-- O SDK é carregado sem bloquear a renderização da página, no início do app. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F6F8F4;
    --surface: #FFFFFF;
    --surface-2: #EEF4EB;
    --ink: #1F2A22;
    --ink-soft: #5B665A;
    --line: #DDE5DA;
    --accent: #2F663F;
    --accent-hover: #285A37;
    --accent-ink: #FFFFFF;
    --accent-soft: #E6F0E3;
    --savings: #3F8F4A;
    --savings-soft: #E6F2E2;
    --alert: #AE3A2B;
    --alert-soft: #F7E4E0;
    --dot-single: #6A9A1F;
    --dot-multi: #2F663F;
    --radius-s: 6px;
    --serif: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace;
    --shadow-lift: 0 1px 2px rgba(22,36,29,.06), 0 8px 24px rgba(22,36,29,.08);
    --ease: cubic-bezier(.4,0,.2,1);
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{ margin:0; font-family: var(--sans); color: var(--ink); background: var(--bg); font-size: 14.5px; line-height: 1.5; }
  ::selection{ background: var(--accent-soft); }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  button{ font-family: inherit; font-size: inherit; }
  input, select, textarea{ font-family: inherit; font-size: inherit; color: var(--ink); }
  .tabular{ font-variant-numeric: tabular-nums; }
  code, .mono{ font-family: var(--mono); }

  .app{ display:flex; min-height:100vh; }
  .sidebar{ width: 250px; flex: none; background: var(--surface-2); border-right: 1px solid var(--line); display:flex; flex-direction:column; padding: 20px 14px; }
  .brand{ display:flex; align-items:center; gap:9px; margin-bottom: 22px; padding: 0 6px; }
  .brand-text{ display:flex; flex-direction:column; line-height:1.2; }
  .brand-text b{ font-family: var(--serif); font-size: 17px; font-weight:700; }
  .brand-text span{ font-size:11.5px; color: var(--ink-soft); }
  .brand-email{ font-size:12.5px; color: var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 2px; margin-bottom:18px; }
  .busca-wrap{ position:relative; display:flex; align-items:center; margin: 0 2px 16px; }
  .busca-wrap svg{ position:absolute; left:10px; pointer-events:none; color: var(--ink-soft); }
  .busca-input{ width:100%; padding:8px 32px 8px 32px; border:1px solid var(--line); border-radius: var(--radius-s); background: var(--surface); font-size:13px; }
  .busca-input:focus{ outline:none; border-color: var(--accent); }
  .busca-clear{ position:absolute; right:6px; width:22px; height:22px; border:none; background:none; color: var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:50%; }
  .busca-clear:hover{ background: var(--surface-2); color: var(--ink); }
  .busca-vazio{ font-size:12.5px; color: var(--ink-soft); padding: 10px 6px; }
  .settings-btn{ flex-shrink:0; width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background .15s,color .15s,border-color .15s; }
  .settings-btn:hover{ background: var(--panel-soft, #f3f4f2); color: var(--ink); }
  .settings-btn.active{ background: var(--accent); border-color: var(--accent); color:#fff; }
  .side-label{ font-size:11.5px; color: var(--ink-soft); padding: 0 6px 6px; }
  .client-list{ display:flex; flex-direction:column; gap:3px; overflow-y:auto; flex:1; }
  .client-row{ display:flex; align-items:center; gap:9px; padding: 9px 8px; border-radius: var(--radius-s); cursor:pointer; border: 1px solid transparent; transition: background .15s var(--ease), border-color .15s var(--ease), transform .15s var(--ease); }
  .client-row:active{ transform: scale(.985); }
  .client-row:hover{ background: var(--surface); }
  .client-row.active{ background: var(--surface); border-color: var(--line); box-shadow: var(--shadow-lift); }
  .client-dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .client-row .meta{ flex:1; min-width:0; }
  .client-row .meta .nome{ font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .client-row .meta .uc{ font-size:11.5px; color: var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .client-row .edit-btn{ opacity:0; flex:none; background:none; border:none; cursor:pointer; padding:4px; color: var(--ink-soft); border-radius: var(--radius-s); }
  .client-row:hover .edit-btn{ opacity:1; }
  .client-row .edit-btn:hover{ background: var(--surface-2); color: var(--ink); }
  .btn-new-client{ margin: 8px 0 12px; width:100%; padding: 10px 12px; border-radius: var(--radius-s); border: 1px solid var(--line); background: #fff; color: var(--ink-soft); cursor:pointer; text-align:left; }
  .btn-new-client:hover{ border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{ padding: 22px 32px 0; display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .topbar h1{ font-family: var(--serif); font-size: 22px; margin:0; font-weight:700; }
  .topbar .sub{ font-size:12.5px; color: var(--ink-soft); margin-top:2px; }

  .tabs{ display:flex; gap: 4px; padding: 16px 32px 0; border-bottom: 1px solid var(--line); flex-wrap:wrap; }
  .tab-btn{ background:none; border:none; cursor:pointer; padding: 9px 4px; margin-right: 22px; color: var(--ink-soft); border-bottom: 2px solid transparent; position:relative; top:1px; transition: color .15s var(--ease), border-color .2s var(--ease); }
  .tab-btn.active{ color: var(--ink); border-bottom-color: var(--accent); font-weight:600; }
  .tab-btn:disabled{ color:#C7CBBE; cursor:not-allowed; }

  .content{ padding: 24px 32px 60px; flex:1; }
  #tab-content{ transition: opacity .22s var(--ease), transform .22s var(--ease); }
  .empty-state{ max-width: 460px; margin: 40px auto; text-align:center; padding: 32px 24px; border: 1px dashed var(--line); border-radius: var(--radius-s); }
  .empty-state p{ color: var(--ink-soft); margin: 8px 0 18px; }

  .quote-grid{ display:flex; gap: 28px; align-items:flex-start; }
  .quote-form-col{ flex: 1 1 52%; min-width: 320px; }
  .quote-preview-col{ flex: 1 1 48%; min-width: 320px; position: sticky; top: 20px; }

  fieldset{ border:1px solid var(--line); border-radius: var(--radius-s); padding: 14px 16px 16px; margin: 0 0 16px; background: var(--surface); }
  legend{ padding: 0 6px; font-size:12.5px; color: var(--ink-soft); }
  .field{ margin-bottom: 12px; }
  .field:last-child{ margin-bottom:0; }
  .field label{ display:block; font-size:13px; margin-bottom: 4px; font-weight: 600; }
  .field .hint{ display:block; font-size:11.5px; color: var(--ink-soft); margin-top:3px; font-weight:400; }
  .field input[type=text], .field input[type=number], .field textarea, .field select{ width:100%; padding: 8px 9px; border:1px solid var(--line); border-radius: var(--radius-s); background: var(--surface); }
  .field textarea{ resize: vertical; min-height:52px; }
  .field-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .field-row .field{ flex:1; min-width:160px; }
  .checkbox-field{ display:flex; align-items:flex-start; gap:8px; font-size:13px; }
  .checkbox-field input{ margin-top:3px; }

  .ponto-row{ display:flex; gap:8px; align-items:flex-end; margin-bottom:8px; padding-bottom:8px; border-bottom: 1px dashed var(--line); flex-wrap:wrap; }
  .ponto-row:last-child{ border-bottom:none; }
  .ponto-row .field{ margin-bottom:0; flex:1; min-width:120px; }
  .ponto-row .f-nome{ flex: 1.3; min-width:140px; }
  .ponto-row .rm-btn{ flex:none; background:none; border:1px solid var(--line); border-radius: var(--radius-s); color: var(--alert); cursor:pointer; padding: 8px 9px; line-height:1; height:36px; }
  .ponto-row .rm-btn:hover{ background: var(--alert-soft); }
  .add-ponto-btn, .add-var-btn{ background:none; border:1px dashed var(--line); border-radius: var(--radius-s); padding:7px 10px; cursor:pointer; color: var(--ink-soft); font-size:13px; }
  .add-ponto-btn:hover, .add-var-btn:hover{ border-color: var(--savings); color: var(--savings); }

  .btn{ display:inline-flex; align-items:center; gap:6px; padding: 9px 16px; border-radius: var(--radius-s); cursor:pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); transition: background .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease), transform .1s var(--ease), box-shadow .15s var(--ease); }
  .btn:active{ transform: scale(.97); }
  .btn:disabled{ opacity:.55; cursor:not-allowed; transform:none; }
  .btn:hover{ border-color: #B8BCA9; }
  .btn-primary{ background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight:600; }
  .btn-primary:hover{ background: var(--accent-hover); }
  .btn-ghost{ border-color: transparent; background:transparent; color: var(--ink-soft); }
  .btn-ghost:hover{ color: var(--ink); background: var(--surface-2); }
  .btn-danger{ color: var(--alert); }
  .btn-danger:hover{ background: var(--alert-soft); border-color: var(--alert); }
  .btn[data-confirming="1"]{ background: var(--alert); border-color: var(--alert); color:#fff; }
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top: 4px; }
  .btn-sm{ padding:5px 10px; font-size:12.5px; }

  .panel{ background: var(--surface); border:1px solid var(--line); border-radius: var(--radius-s); padding: 16px 18px; margin-bottom:20px; transition: box-shadow .2s var(--ease), border-color .2s var(--ease); }
  .panel h2{ font-family: var(--serif); font-size:16px; margin: 0 0 12px; }
  .breakdown-row{ display:flex; justify-content:space-between; gap:12px; padding: 6px 0; border-bottom: 1px solid var(--surface-2); font-size: 13.5px; }
  .breakdown-row .lbl{ color: var(--ink-soft); }
  .breakdown-row .val{ font-weight:500; white-space:nowrap; }
  .breakdown-row.total{ border-top: 1px solid var(--ink); border-bottom:none; margin-top:6px; padding-top:10px; font-size:15.5px; }
  .breakdown-row.total .lbl{ color: var(--ink); font-weight:700; }
  .breakdown-row.total .val{ font-weight:700; }
  .breakdown-row.savings .val{ color: var(--savings); }
  .ponto-breakdown{ border:1px solid var(--surface-2); border-radius: var(--radius-s); padding:10px 12px; margin-bottom:8px; }
  .ponto-breakdown .nome{ font-weight:600; margin-bottom:4px; }

  .badge{ display:inline-flex; align-items:center; gap:6px; padding: 4px 10px; border-radius: 999px; font-size:12.5px; font-weight:600; }
  .badge.ok{ background: var(--savings-soft); color: var(--savings); }
  .badge.bad{ background: var(--alert-soft); color: var(--alert); }
  .pill{ display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; background:var(--surface-2); color:var(--ink-soft); }
  .pill.single{ background:var(--accent-soft); color:var(--accent-ink); }
  .pill.multi{ background:var(--savings-soft); color:var(--savings); }

  .checklist{ display:flex; flex-direction:column; gap:6px; }
  .checklist label{ display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:400; }
  .checklist input{ margin:0; }

  .history-item{ background: var(--surface); border:1px solid var(--line); border-radius: var(--radius-s); padding: 14px 16px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; transition: box-shadow .2s var(--ease), border-color .2s var(--ease); }
  .history-item:hover{ box-shadow: var(--shadow-lift); border-color: var(--accent-soft); }
  .history-item .info b{ display:block; }
  .history-item .info span{ font-size:12.5px; color: var(--ink-soft); }

  .modal-overlay{ position:fixed; inset:0; background: rgba(22,36,29,.4); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display:flex; align-items:flex-start; justify-content:center; padding: 40px 16px; overflow-y:auto; z-index:50; animation: overlayIn .18s var(--ease); }
  @keyframes overlayIn{ from{ opacity:0; } to{ opacity:1; } }
  .modal{ background: var(--surface); border-radius: var(--radius-s); width:100%; max-width:480px; padding: 22px 24px 24px; box-shadow: 0 20px 60px rgba(0,0,0,.25); animation: modalIn .2s var(--ease); }
  .modal.modal-lg{ max-width:920px; }
  @keyframes modalIn{ from{ opacity:0; transform: translateY(10px) scale(.98); } to{ opacity:1; transform: translateY(0) scale(1); } }
  .modal h2{ font-family: var(--serif); margin:0 0 16px; font-size:19px; }
  .modal-close{ float:right; background:none; border:none; cursor:pointer; color: var(--ink-soft); font-size:18px; }

  .app-footer{ display:flex; flex-direction:column; align-items:center; gap:8px; padding:22px 24px; border-top:1px solid var(--line); }
  .app-footer .footer-links a{ color:var(--ink-soft); text-decoration:none; font-size:12.5px; }
  .app-footer .footer-links a:hover{ color: var(--accent); }
  .app-footer .status{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--ink-soft); }
  .app-footer .status .dot{ width:8px; height:8px; border-radius:50%; background:#3f8f4a; box-shadow:0 0 0 3px rgba(63,143,74,0.16); margin-right:7px; }
  .app-footer .version{ font-size:11.5px; color: var(--ink-soft); opacity:.75; }
  /* Configurações — mesmo padrão visual da tela inicial do IG Base */
  .modal.modal-md{ max-width:640px; }
  .modal h2.cfg-modal-title{ font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-weight:800; font-size:22px; margin:0 0 18px; }
  .cfg-back{ display:inline-flex; align-items:center; background:none; border:none; padding:0; margin:0 0 10px; color: var(--ink-soft); font-size:13px; cursor:pointer; }
  .cfg-back:hover{ color:#2f663f; }
  .cfg-back svg{ margin-right:5px; }
  .cfg-card{ border:1px solid #dde5da; border-radius:16px; padding:20px; margin-bottom:14px; background:#fff; }
  .cfg-card.danger{ border-color:#f0d4d4; background:#fffafa; }
  .cfg-head{ display:flex; align-items:center; margin-bottom:14px; }
  .cfg-icon{ width:40px; height:40px; border-radius:12px; background:rgba(63,143,74,.12); color:#2f663f; display:flex; align-items:center; justify-content:center; flex:none; margin-right:12px; }
  .cfg-card.danger .cfg-icon{ background:rgba(180,60,60,.1); color:#a33; }
  .cfg-title{ font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-weight:700; font-size:16px; margin:0; color: var(--ink); }
  .cfg-sub{ font-size:12.5px; color: var(--ink-soft); margin:2px 0 0; line-height:1.4; }
  .cfg-text{ font-size:13px; color: var(--ink-soft); line-height:1.5; margin:0 0 14px; }
  .cfg-pill{ display:inline-block; background:#f3f6f1; border:1px solid #dde5da; border-radius:999px; padding:6px 12px; font-size:13px; color: var(--ink); margin-bottom:14px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; box-sizing:border-box; }
  .cfg-actions{ display:flex; flex-wrap:wrap; margin-top:4px; }
  .cfg-actions .btn{ margin-right:8px; margin-bottom:8px; }
  .cfg-card .btn{ border-radius:10px; }
  .cfg-card .field input[type="text"]{ border-radius:10px; }
  .cfg-dropzone{ display:block; border:1.5px dashed #b9cbb9; border-radius:14px; padding:14px; cursor:pointer; background:#fafcf9; transition:border-color .15s, background .15s; font-weight:400; }
  .cfg-dz-row{ display:flex; align-items:center; }
  .field .cfg-dropzone{ font-weight:400; }
  .cfg-dropzone:hover{ border-color:#3f8f4a; background:#f3f8f1; }
  .cfg-dropzone input{ display:none; }
  .cfg-dz-thumb{ width:64px; height:64px; border-radius:10px; background:#fff; border:1px solid #dde5da; display:flex; align-items:center; justify-content:center; overflow:hidden; flex:none; margin-right:14px; color:#7c8479; }
  .cfg-dz-thumb img{ max-width:100%; max-height:100%; }
  .cfg-dz-text{ display:block; }
  .cfg-dz-text b{ display:block; font-size:14px; font-weight:600; color: var(--ink); margin-bottom:2px; }
  .cfg-dz-text span{ font-size:12px; color: var(--ink-soft); }

  /* Aviso de novidades da versão (aparece uma única vez por versão) */
  .igb-cl-overlay{ position:fixed; inset:0; background:rgba(20,28,22,.45); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; padding:20px; z-index:200; }
  .igb-cl-card{ background:#fff; border-radius:20px; max-width:440px; width:100%; padding:26px 26px 22px; box-shadow:0 24px 60px rgba(0,0,0,.25); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:#1f2a22; max-height:90vh; overflow:auto; box-sizing:border-box; }
  .igb-cl-top{ display:flex; align-items:center; }
  .igb-cl-badge{ display:flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:12px; background:rgba(63,143,74,.12); color:#2f663f; margin-right:12px; }
  .igb-cl-ver{ font-size:12px; font-weight:700; color:#2f663f; background:rgba(63,143,74,.12); border-radius:999px; padding:4px 10px; }
  .igb-cl-title{ font-family:'Poppins',-apple-system,sans-serif; font-weight:800; font-size:20px; margin:14px 0 4px; }
  .igb-cl-sub{ font-size:13px; color:#5b665a; margin:0 0 14px; }
  .igb-cl-list{ list-style:none; margin:0 0 18px; padding:0; }
  .igb-cl-list li{ display:flex; font-size:14px; line-height:1.45; margin-bottom:10px; }
  .igb-cl-list li svg{ flex:none; margin-right:10px; margin-top:2px; color:#3f8f4a; }
  .igb-cl-btn{ width:100%; border:none; border-radius:12px; background:#2f663f; color:#fff; font-weight:600; font-size:15px; padding:12px; cursor:pointer; }
  .igb-cl-btn:hover{ background:#254f31; }

  #toast-root{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:100; }
  .toast{ background: var(--ink); color:#fff; padding:10px 18px; border-radius: var(--radius-s); font-size:13.5px; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 80vw; }

  /* ---- Tela de login / cadastro ---- */
  .auth-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; background: var(--bg); padding:20px; }
  .auth-card{ background: var(--surface); border:1px solid var(--line); border-radius: var(--radius-s); box-shadow: var(--shadow-lift); padding: 36px 32px; width:100%; max-width:380px; }
  .auth-card .brand{ margin-bottom:24px; justify-content:center; }
  .auth-card h1{ font-family: var(--serif); font-size:20px; margin:0 0 4px; text-align:center; }
  .auth-card .sub{ text-align:center; color:var(--ink-soft); font-size:13px; margin-bottom:22px; }
  .auth-tabs{ display:flex; margin-bottom:20px; border-bottom:1px solid var(--line); }
  .auth-tab-btn{ flex:1; background:none; border:none; padding:9px; cursor:pointer; color:var(--ink-soft); border-bottom:2px solid transparent; }
  .auth-tab-btn.active{ color:var(--ink); font-weight:600; border-bottom-color:var(--accent); }
  .auth-msg{ font-size:12.5px; padding:9px 10px; border-radius: var(--radius-s); margin-bottom:12px; }
  .auth-msg.error{ background: var(--alert-soft); color: var(--alert); }
  .auth-msg.info{ background: var(--savings-soft); color: var(--savings); }
  .auth-config-warning{ max-width:520px; margin:60px auto; text-align:center; padding:28px; border:1px dashed var(--alert); border-radius:var(--radius-s); color:var(--alert); }
  .auth-code-input{ width:100%; text-align:center; font-family:var(--mono); font-size:22px; letter-spacing:5px; padding:10px 8px; }
  .auth-resend{ text-align:center; font-size:12.5px; color:var(--ink-soft); margin-top:14px; }

  /* ---- Perfis ---- */
  .profile-card{ background: var(--surface); border:1px solid var(--line); border-radius: var(--radius-s); padding: 14px 16px; margin-bottom:10px; transition: box-shadow .2s var(--ease), border-color .2s var(--ease); }
  .profile-card:hover{ box-shadow: var(--shadow-lift); border-color: var(--accent-soft); }
  .eq-revisao-campo{display:grid;gap:6px;margin:14px 0;min-width:0;}
  .eq-revisao-campo input[type=text],.eq-revisao-campo input[type=date]{width:100%;min-width:0;}
  .eq-revisao-campo small{overflow-wrap:anywhere;color:var(--ink-soft);}
  #eq-arquivo{max-width:100%;}
  #eq-revisao .btn{margin-top:12px;}
  .profile-card .head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; }
  .profile-card h3{ margin:0 0 4px; font-family: var(--serif); font-size:16px; }
  .profile-card .desc{ font-size:12.5px; color: var(--ink-soft); margin:0 0 8px; max-width:520px; }

(function(){
"use strict";

/* ============================================================
   UTILITÁRIOS
   ============================================================ */
function uid(){ return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8); }

function parseNumUnico(str){
  var s = String(str).trim();
  if(s === '') return 0;
  if(s.indexOf(',') > -1){ s = s.replace(/\./g,'').replace(',', '.'); }
  var n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function parseNumBR(str){
  if(str === null || str === undefined) return 0;
  var s = String(str).trim();
  if(s === '') return 0;
  /* Permite digitar somas/subtrações direto no campo, ex.: "45,20+12,30+8" ou
     "100,50-20,30" — útil quando a fatura tem várias multas/adicionais pra somar. */
  if(/[+-]/.test(s.slice(1))){
    var partes = s.match(/[+-]?[^+-]+/g) || [s];
    var soma = 0;
    partes.forEach(function(parte){
      var sinal = 1, termo = parte.trim();
      if(termo.charAt(0) === '-'){ sinal = -1; termo = termo.slice(1); }
      else if(termo.charAt(0) === '+'){ termo = termo.slice(1); }
      soma += sinal * parseNumUnico(termo);
    });
    return soma;
  }
  return parseNumUnico(s);
}
var fmtCurrency = new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL' });
function fmtBRL(n){ return fmtCurrency.format(n || 0); }
function fmtKwh(n){ return (n||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' kWh'; }
function fmtPct(frac){ return ((frac||0)*100).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}) + '%'; }
function fmtNum(n){
  if(n === undefined || n === null) return '0';
  var s = n.toLocaleString('pt-BR', {minimumFractionDigits:0, maximumFractionDigits:6});
  return s;
}
/* Formatação para reentrada: preserva a precisão do Number, sem separador de milhar.
   fmtNum/BRL continuam sendo apenas formatos de exibição. */
function numeroParaFormulario(n){
  if(n === undefined || n === null) return '';
  return Number(n).toLocaleString('pt-BR', {useGrouping:false, maximumSignificantDigits:21});
}
function copiarDados(valor){ return JSON.parse(JSON.stringify(valor)); }
/* Assinatura de conteúdo independente da ordem das chaves: o banco (jsonb) reordena
   as chaves ao salvar, então JSON.stringify direto acusaria diferença inexistente. */
function assinaturaDados(valor){
  if(Array.isArray(valor)) return '[' + valor.map(assinaturaDados).join(',') + ']';
  if(valor && typeof valor === 'object') return '{' + Object.keys(valor).sort().filter(function(k){ return valor[k] !== undefined; }).map(function(k){ return JSON.stringify(k) + ':' + assinaturaDados(valor[k]); }).join(',') + '}';
  return JSON.stringify(valor);
}
function perfilDoDocumento(d){ return d.perfilSnapshot || getProfile(d.profileId); }
function clienteDoDocumento(d){
  return d.clienteSnapshot || state.clients.find(function(c){ return c.id === d.clientId; });
}
function configDoDocumento(d){ return d.docConfigSnapshot || state.docConfig || docConfigPadrao(); }
function formatarValor(v, formato){
  if(v === undefined || v === null || isNaN(v)) return '—';
  switch(formato){
    case 'moeda': return fmtBRL(v);
    case 'tarifa': return 'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:6})+'/kWh';
    case 'kwh': return fmtKwh(v);
    case 'percentual': return fmtPct(v);
    case 'booleano': return v ? 'Sim' : 'Não';
    default: return (v||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
  }
}
function escapeHtml(s){ return String(s===undefined||s===null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function slugify(s){
  return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-zA-Z0-9]+/g,' ').trim().split(' ').filter(Boolean)
    .map(function(w,i){ return i===0 ? w.toLowerCase() : (w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()); })
    .join('') || ('campo' + Math.floor(Math.random()*1000));
}
function parseAssignKey(line){
  var m = /^\s*([A-Za-zÀ-ÖØ-öø-ÿ_][A-Za-zÀ-ÖØ-öø-ÿ0-9_]*)\s*=/.exec(line||'');
  return m ? m[1] : null;
}
function linhasExecutaveis(arr){
  return (arr||[]).filter(function(l){
    var t = (l||'').trim();
    return t && t.charAt(0) !== '#' && t.substr(0,2) !== '//';
  });
}
var MESES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function refPadrao(){
  var d = new Date();
  return MESES_PT[d.getMonth()] + '/' + d.getFullYear();
}
function refFieldsHtml(valorAtual){
  var partes = (valorAtual || refPadrao()).split('/');
  var mesAtual = partes[0];
  var anoAtual = partes[1] || String(new Date().getFullYear());
  var idxMes = MESES_PT.indexOf(mesAtual);
  if(idxMes === -1) idxMes = new Date().getMonth();
  return '<div class="field-row" style="gap:8px">' +
    '<div class="field" style="flex:1.4"><label>Mês</label><select id="f-ref-mes">' +
      MESES_PT.map(function(m, i){ return '<option value="' + i + '"' + (i === idxMes ? ' selected' : '') + '>' + m + '</option>'; }).join('') +
    '</select></div>' +
    '<div class="field" style="flex:1"><label>Ano</label><input type="number" id="f-ref-ano" value="' + escapeHtml(anoAtual) + '" step="1" inputmode="numeric"></div>' +
  '</div>';
}
function getReferenciaAtual(){
  var mesEl = document.getElementById('f-ref-mes');

  if(!mesEl || !anoEl) return refPadrao();
  var idx = parseInt(mesEl.value, 10);
  var ano = (anoEl.value || '').trim() || String(new Date().getFullYear());
  return (MESES_PT[idx] || MESES_PT[0]) + '/' + ano;
}

/* ============================================================
   MOTOR DE FÓRMULAS (tokenizer + parser + avaliador)
   ============================================================ */
function tokenize(expr){
  var tokens = [];
  var i = 0, n = expr.length;
  function isDigit(c){ return c >= '0' && c <= '9'; }
  function isIdentStart(c){ return /[A-Za-z_À-ÖØ-öø-ÿ]/.test(c); }
  function isIdentPart(c){ return /[A-Za-z0-9_À-ÖØ-öø-ÿ]/.test(c); }
  while(i < n){
    var c = expr[i];
    if(c === ' ' || c === '\t'){ i++; continue; }
    if(isDigit(c) || (c === '.' && isDigit(expr[i+1]))){
      var j = i;
      while(j<n && (isDigit(expr[j]) || expr[j]==='.')) j++;
      tokens.push({type:'NUM', value: parseFloat(expr.slice(i,j))});
      i = j; continue;
    }
    if(isIdentStart(c)){
      var j2 = i;
      while(j2<n && isIdentPart(expr[j2])) j2++;
      tokens.push({type:'ID', value: expr.slice(i,j2)});
      i = j2; continue;
    }
    var two = expr.substr(i,2);
    if(['>=','<=','==','!=','&&','||'].indexOf(two) > -1){ tokens.push({type:'OP', value: two}); i+=2; continue; }
    if('+-*/%^(),?:><=!'.indexOf(c) > -1){ tokens.push({type:'OP', value:c}); i++; continue; }
    throw new Error("Caractere inesperado: '"+c+"'");
  }
  return tokens;
}

function parseExprTokens(tokens){
  var pos = 0;
  function peek(){ return tokens[pos]; }
  function next(){ return tokens[pos++]; }
  function expectOp(v){ var t = next(); if(!t || t.type!=='OP' || t.value!==v) throw new Error("Esperado '"+v+"'"); }
  function parseAssignment(){
    if(peek() && peek().type==='ID' && tokens[pos+1] && tokens[pos+1].type==='OP' && tokens[pos+1].value==='='){
      var name = next().value; next();
      var expr = parseTernary();
      return {type:'Assign', name:name, expr:expr};
    }
    return parseTernary();
  }
  function parseTernary(){
    var cond = parseOr();
    if(peek() && peek().type==='OP' && peek().value==='?'){
      next(); var a = parseTernary(); expectOp(':'); var b = parseTernary();
      return {type:'Ternary', cond:cond, a:a, b:b};
    }
    return cond;
  }
  function parseOr(){ var left=parseAnd(); while(peek()&&peek().type==='OP'&&peek().value==='||'){ next(); var r=parseAnd(); left={type:'Bin',op:'||',left:left,right:r}; } return left; }
  function parseAnd(){ var left=parseEquality(); while(peek()&&peek().type==='OP'&&peek().value==='&&'){ next(); var r=parseEquality(); left={type:'Bin',op:'&&',left:left,right:r}; } return left; }
  function parseEquality(){ var left=parseComparison(); while(peek()&&peek().type==='OP'&&(peek().value==='=='||peek().value==='!=')){ var op=next().value; var r=parseComparison(); left={type:'Bin',op:op,left:left,right:r}; } return left; }
  function parseComparison(){ var left=parseAdditive(); while(peek()&&peek().type==='OP'&&['>','>=','<','<='].indexOf(peek().value)>-1){ var op=next().value; var r=parseAdditive(); left={type:'Bin',op:op,left:left,right:r}; } return left; }
  function parseAdditive(){ var left=parseMultiplicative(); while(peek()&&peek().type==='OP'&&(peek().value==='+'||peek().value==='-')){ var op=next().value; var r=parseMultiplicative(); left={type:'Bin',op:op,left:left,right:r}; } return left; }
  function parseMultiplicative(){ var left=parseUnary(); while(peek()&&peek().type==='OP'&&(peek().value==='*'||peek().value==='/'||peek().value==='%')){ var op=next().value; var r=parseUnary(); left={type:'Bin',op:op,left:left,right:r}; } return left; }
  function parseUnary(){ if(peek()&&peek().type==='OP'&&(peek().value==='-'||peek().value==='!')){ var op=next().value; var arg=parseUnary(); return {type:'Unary',op:op,arg:arg}; } return parsePower(); }
  function parsePower(){ var base=parsePrimary(); if(peek()&&peek().type==='OP'&&peek().value==='^'){ next(); var e=parseUnary(); return {type:'Bin',op:'^',left:base,right:e}; } return base; }
  function parsePrimary(){
    var t = peek();
    if(!t) throw new Error("Expressão incompleta");
    if(t.type==='NUM'){ next(); return {type:'Num', value:t.value}; }
    if(t.type==='OP' && t.value==='('){ next(); var e=parseTernary(); expectOp(')'); return e; }
    if(t.type==='ID'){
      next();
      if(peek() && peek().type==='OP' && peek().value==='('){
        next();
        var args = [];
        if(!(peek() && peek().type==='OP' && peek().value===')')){
          args.push(parseTernary());
          while(peek() && peek().type==='OP' && peek().value===','){ next(); args.push(parseTernary()); }
        }
        expectOp(')');
        if(t.value === 'se'){
          if(args.length !== 3) throw new Error("se(...) precisa de 3 argumentos: condição, se-verdadeiro, se-falso");
          return {type:'Ternary', cond:args[0], a:args[1], b:args[2]};
        }
        return {type:'Call', name:t.value, args:args};
      }
      return {type:'Var', name:t.value};
    }
    throw new Error("Token inesperado");
  }
  var ast = parseAssignment();
  if(pos < tokens.length) throw new Error("Caracteres inesperados no final da expressão");
  return ast;
}

function toNumOrThrow(v){ if(Array.isArray(v)) throw new Error("Era esperado um número, mas veio uma lista"); return v; }
function flattenArgs(args){
  if(args.length===1 && Array.isArray(args[0])) return args[0].slice();
  return args.map(function(a){ if(Array.isArray(a)) throw new Error("Lista não suportada aqui"); return a; });
}
var ENGINE_FUNCTIONS = {
  min: function(){ var xs=flattenArgs(Array.prototype.slice.call(arguments)); return Math.min.apply(null, xs); },
  max: function(){ var xs=flattenArgs(Array.prototype.slice.call(arguments)); return Math.max.apply(null, xs); },
  abs: function(a){ return Math.abs(a); },
  round: function(a, casas){ var m = Math.pow(10, casas||0); return Math.round(a*m)/m; },
  sum: function(){ var xs=flattenArgs(Array.prototype.slice.call(arguments)); return xs.reduce(function(s,x){return s+x;},0); },
  media: function(){ var xs=flattenArgs(Array.prototype.slice.call(arguments)); return xs.length? xs.reduce(function(s,x){return s+x;},0)/xs.length : 0; }
};

function evalNode(node, scope){
  switch(node.type){
    case 'Num': return node.value;
    case 'Var':
      if(!(node.name in scope)) throw new Error("Variável não definida: '"+node.name+"'");
      return scope[node.name];
    case 'Unary':{
      var v = evalNode(node.arg, scope);
      if(node.op==='-') return -toNumOrThrow(v);
      if(node.op==='!') return v ? 0 : 1;
      throw new Error("Operador desconhecido: "+node.op);
    }
    case 'Bin':{
      var l = evalNode(node.left, scope);
      /* Condições podem proteger operações inválidas no segundo operando. */
      if(node.op==='&&') return l ? (evalNode(node.right,scope) ? 1 : 0) : 0;
      if(node.op==='||') return l ? 1 : (evalNode(node.right,scope) ? 1 : 0);
      var r = evalNode(node.right, scope);
      switch(node.op){
        case '+': return toNumOrThrow(l)+toNumOrThrow(r);
        case '-': return toNumOrThrow(l)-toNumOrThrow(r);
        case '*': return toNumOrThrow(l)*toNumOrThrow(r);
        case '/': if(toNumOrThrow(r)===0) throw new Error("Divisão por zero"); return l/r;
        case '%': return l % r;
        case '^': return Math.pow(l,r);
        case '>': return (l>r)?1:0;
        case '>=': return (l>=r)?1:0;
        case '<': return (l<r)?1:0;
        case '<=': return (l<=r)?1:0;
        case '==': return (l===r)?1:0;
        case '!=': return (l!==r)?1:0;
        case '&&': return (l && r)?1:0;
        case '||': return (l || r)?1:0;
      }
      throw new Error("Operador desconhecido: "+node.op);
    }
    case 'Ternary':
      return evalNode(node.cond, scope) ? evalNode(node.a, scope) : evalNode(node.b, scope);
    case 'Call':{
      var fn = ENGINE_FUNCTIONS[node.name];
      if(!fn) throw new Error("Função desconhecida: '"+node.name+"'");
      var argVals = node.args.map(function(a){ return evalNode(a, scope); });
      return fn.apply(null, argVals);
    }
    case 'Assign':{
      var val = evalNode(node.expr, scope);
      if(typeof val!=='number' || !Number.isFinite(val)) throw new Error('A fórmula precisa produzir um número finito. Confira os valores e as operações.');
      scope[node.name] = val;
      return val;
    }
  }
  throw new Error("Nó de expressão desconhecido");
}

function runLine(line, scope){
  var trimmed = (line||'').trim();
  if(!trimmed) return null;
  var tokens = tokenize(trimmed);
  var ast = parseExprTokens(tokens);
  var value = evalNode(ast, scope);
  if(typeof value!=='number' || !Number.isFinite(value)) throw new Error('A fórmula precisa produzir um número finito. Confira os valores e as operações.');
  return value;
}

/* Roda um perfil inteiro (fórmulas + itens, se houver) a partir de valores de entrada. */
function avaliarPerfil(profile, valoresEntrada, itensInput){
  var scope = Object.assign({}, valoresEntrada);
  try{
    if(!profile.possuiItensMultiplos){
      linhasExecutaveis(profile.formulas).forEach(function(line, idx){
        try{ runLine(line, scope); }
        catch(e){ throw {linha: idx+1, texto: line, mensagem: e.message, secao:'formulas'}; }
      });
      return { ok:true, scope: scope, itensResultado: null };
    } else {
      linhasExecutaveis(profile.formulasCompartilhadas).forEach(function(line, idx){
        try{ runLine(line, scope); }
        catch(e){ throw {linha: idx+1, texto: line, mensagem: e.message, secao:'compartilhadas'}; }
      });
      var itemFormulasEfetivas = (profile.itemFormulas && profile.itemFormulas.length) ? profile.itemFormulas : (profile.itemFormula ? [profile.itemFormula] : []);
      var linhasItem = linhasExecutaveis(itemFormulasEfetivas);
      var itemKey = linhasItem.length ? parseAssignKey(linhasItem[linhasItem.length-1]) : null;
      var itensResultado = (itensInput||[]).map(function(itemVals, i){
        var itemScope = Object.assign({}, scope, itemVals);
        linhasItem.forEach(function(line, idx){
          try{ runLine(line, itemScope); }
          catch(e){ throw {linha: idx+1, texto: line, mensagem: e.message, secao:'item', itemIndex:i}; }
        });
        return itemScope;
      });
      var chavesItem = (profile.itemVariaveis||[]).map(function(v){ return v.chave; });
      linhasItem.forEach(function(line){ var k = parseAssignKey(line); if(k && chavesItem.indexOf(k)===-1) chavesItem.push(k); });
      chavesItem.forEach(function(k){
        scope['itens_'+k] = itensResultado.map(function(r){ return r[k]; });
      });
      linhasExecutaveis(profile.formulasFinais).forEach(function(line, idx){
        try{ runLine(line, scope); }
        catch(e){ throw {linha: idx+1, texto: line, mensagem: e.message, secao:'finais'}; }
      });
      return { ok:true, scope: scope, itensResultado: itensResultado, chaveItemValor: itemKey };
    }
  }catch(erro){
    return { ok:false, erro: erro };
  }
}
function mensagemErroAvaliacao(erro){
  var secaoLabel = { formulas:'Fórmulas', compartilhadas:'Fórmulas compartilhadas', item:'Fórmula do item', finais:'Fórmulas finais' }[erro.secao] || 'Fórmula';
  var onde = erro.secao === 'item' ? (secaoLabel) : (secaoLabel + ', linha ' + erro.linha);
  return onde + ' — "' + erro.texto + '": ' + erro.mensagem;
}

/* Mantém a MESMA interface de antes (storageGet/storageSet operando em "chaves" com um
   JSON como valor) para que todo o resto do app continue funcionando sem alterações —
   só a implementação por trás troca de localStorage para uma tabela do Supabase,
   uma linha por usuário, protegida por Row Level Security. */
async function storageGet(key, estrito){
  var table = TABLE_FOR_KEY[key];
  if(!table || !supabaseClient || !currentUser) return null;
  try{
    var resp = await esperarComLimite(supabaseClient.from(table).select('data').eq('user_id', currentUser.id).maybeSingle(), 15000);
    if(resp.error){ throw resp.error; }
    return resp.data ? JSON.stringify(resp.data.data) : null;
  }catch(e){ console.error(e); if(estrito) throw e; return null; }
}
async function storageSet(key, value){
  var table = TABLE_FOR_KEY[key];
  if(!table || !supabaseClient || !currentUser) return false;
  try{
    var parsed = JSON.parse(value);
    if(key==='usinas:v2:docconfig'){var service=companyService||IGCompanies.service(supabaseClient,currentUser);await service.load();await service.saveLegacy(parsed);return true;}
    var resp = await esperarComLimite(supabaseClient.from(table).upsert(
      { user_id: currentUser.id, data: parsed, updated_at: new Date().toISOString() },
      { onConflict: 'user_id' }
    ), 15000);
    if(resp.error){ console.error(resp.error); return false; }
    return true;
  }catch(e){ console.error(e); return false; }
}

var salvandoColecoes = false;
async function salvarColecoesEstado(alteracoes){
  if(salvandoColecoes){toast('Aguarde a gravação em andamento.');return false;}
  salvandoColecoes=true;
  var gravadas=[],anteriores={};
  try{
    for(var i=0;i<alteracoes.length;i++){
      var item=alteracoes[i];anteriores[item.campo]=copiarDados(state[item.campo]);
      if(!await storageSet(item.chave,JSON.stringify(item.valor))){
        var restaurado=true;
        /* Uma resposta perdida pode esconder uma gravação concluída no servidor.
           Restaurar também a coleção cuja resposta falhou, além das anteriores. */
        var restaurar=gravadas.concat([item]);
        for(var j=restaurar.length-1;j>=0;j--){
          var anterior=restaurar[j];
          if(!await storageSet(anterior.chave,JSON.stringify(anteriores[anterior.campo])))restaurado=false;
        }
        if(!restaurado)renderInicio('A operação não foi concluída e a restauração não pôde ser confirmada. Recarregue o sistema para conferir os dados antes de continuar.',true);
        toast(restaurado?'Não foi possível concluir a gravação. Os dados anteriores foram mantidos. Confira a conexão e tente novamente.':'Falha de conexão. Confira os dados ao recarregar o sistema.');
        return false;
      }
      gravadas.push(item);
    }
    alteracoes.forEach(function(item){state[item.campo]=item.valor;});return true;
  }finally{salvandoColecoes=false;}
}

async function loadAll(){
  var userId = currentUser.id;
  var raw = await Promise.all([
    storageGet('usinas:v2:profiles',true), storageGet('usinas:v2:clients',true),
    storageGet('usinas:v2:quotes',true), storageGet('usinas:v2:docconfig',true)
  ]);
  if(!currentUser || currentUser.id !== userId) throw new Error('Sessão alterada durante o carregamento.');
  var perfis = raw[0] ? JSON.parse(raw[0]) : [];
  var clientes = raw[1] ? JSON.parse(raw[1]) : [];
  var faturas = raw[2] ? JSON.parse(raw[2]) : [];
  var config = raw[3] ? JSON.parse(raw[3]) : {};
  if(!Array.isArray(perfis) || !Array.isArray(clientes) || !Array.isArray(faturas) || !config || typeof config !== 'object' || Array.isArray(config))
    throw new Error('Os dados salvos não possuem o formato esperado.');
  state.profiles = perfis; state.clients = clientes; state.quotes = faturas;
  state.docConfig = Object.assign(docConfigPadrao(), config);
  try{companyService=IGCompanies.service(supabaseClient,currentUser);await companyService.load();var emissora=companyService.selected('solar-organization');state.docConfig=Object.assign(docConfigPadrao(),emissora||companyService.legacy);}catch(e){companyService=null;console.error('Cadastro central de empresas indisponível',e);}
  try{
    var uResp = await esperarComLimite(supabaseClient.from('perfis_usuario').select('username').eq('user_id', userId).maybeSingle(), 8000);
    state.username = (uResp && !uResp.error && uResp.data) ? (uResp.data.username || '') : '';
  }catch(e){ console.error(e); state.username = ''; }
  if(state.profiles.length === 0){
    state.profiles = presetsPadrao();
    if(!await saveProfiles())throw new Error('Não foi possível salvar os modelos iniciais. Tente novamente.');
  } else {
    /* Corrige automaticamente os modelos padrão (GD1/GD2) desatualizados a cada login,
       sem depender do usuário clicar em "Atualizar modelos padrão". Só mostra aviso se
       algo realmente mudou, pra não incomodar em todo login sem necessidade. */
    await sincronizarModelosPadrao('login');
  }
  if(state.clients.length === 0){
    state.clients = seedClients(state.profiles);
    if(!await saveClients())throw new Error('Não foi possível salvar os clientes iniciais. Tente novamente.');
  }
  if(state.clients.length){ state.selectedClientId = state.clients[0].id; }
}

function camposDisponiveisPerfil(profile){
  /* retorna lista de {chave, rotulo, formato, editavel} disponíveis para o checklist de "visível ao cliente",
     excluindo a chave do total final (mostrada sempre, à parte). Campos vindos de "variaveis" já têm rótulo
     próprio (editavel:false); campos calculados pelas fórmulas usam rotulosCampos/formatosCampos do perfil
     como personalização, caindo para a própria chave / 'moeda' como padrão (editavel:true). */
  var lista = [];
  (profile.variaveis||[]).forEach(function(v){ lista.push({chave:v.chave, rotulo:v.rotulo, formato:v.formato, editavel:false}); });
  var linhasFormula = profile.possuiItensMultiplos
    ? linhasExecutaveis(profile.formulasCompartilhadas).concat(linhasExecutaveis(profile.formulasFinais))
    : linhasExecutaveis(profile.formulas);
  var rotulosCampos = profile.rotulosCampos || {};
  var formatosCampos = profile.formatosCampos || {};
  linhasFormula.forEach(function(line){
    var k = parseAssignKey(line);
    if(k) lista.push({chave:k, rotulo: rotulosCampos[k] || k, formato: formatosCampos[k] || 'moeda', editavel:true});
  });
  return lista.filter(function(c){ return c.chave !== profile.chaveTotalFinal; });
}

function formatoCampo(profile, chave){ return (profile.formatosCampos && profile.formatosCampos[chave]) || 'moeda'; }

/* Funções integradas ao HTML existente; não carregar como outro script. */
function limparTextoExibicao(valor){
  return String(valor === undefined || valor === null ? '' : valor).normalize('NFC')
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F\u200B\uFEFF]/g,' ')
    .replace(/\s+/g,' ').trim();
}
function textoExibicao(valor){ return escapeHtml(limparTextoExibicao(valor)); }
function textoBusca(valor){
  return limparTextoExibicao(valor).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}
function correspondeBusca(termo, campos){
  var tokens = textoBusca(termo).split(/\s+/).filter(Boolean);
  var texto = campos.map(textoBusca).join(' ');
  return tokens.every(function(token){
    return texto.indexOf(token) !== -1 || (/^[\d.\/-]+$/.test(token) && /\d/.test(token) &&
      campos.some(function(c){return String(c || '').replace(/\D/g,'').indexOf(token.replace(/\D/g,'')) !== -1;}));
  });
}
function tipoGDDoPerfil(p){
  if(!p) return '';
  var tipo = textoBusca(p.tipoUsina || p.tipoGD || p.regime || p.nome).replace(/\s/g,'');
  if(/gd2/.test(tipo)) return 'GD2';
  if(/gd1/.test(tipo)) return 'GD1';
  if(p.chaveItemFioB || (p.variaveis || []).some(function(v){return /fioB/i.test(v.chave);})) return 'GD2';
  return perfilConsumoGD1(p) ? 'GD1' : '';
}
function dadosBuscaCliente(c){
  if(!c) return [];
  var campos = [c.nome,c.uc,c.documento,c.cpf,c.cnpj,c.local,c.endereco,c.cidade];
  (c.pontosPadrao || []).forEach(function(p){if(typeof p === 'string') campos.push(p);else campos.push(p.nome,p.uc);});
  return campos;
}
function localCliente(c){ return limparTextoExibicao(c && (c.local || c.endereco || c.cidade) || ''); }
function ordenarPorIdentificacao(lista, ordem, clienteFn){
  var local = /^local-/.test(ordem), inverso = /-za$/.test(ordem);
  var colador = new Intl.Collator('pt-BR',{sensitivity:'base',numeric:true});
  return lista.slice().sort(function(a,b){
    var ca=clienteFn(a) || {}, cb=clienteFn(b) || {};
    var ta=local ? localCliente(ca) : limparTextoExibicao(ca.nome);
    var tb=local ? localCliente(cb) : limparTextoExibicao(cb.nome);
    if(!ta && tb) return 1; if(ta && !tb) return -1;
    var resultado=colador.compare(ta,tb) || colador.compare(ca.nome || '',cb.nome || '');
    if(resultado) return inverso ? -resultado : resultado;
    return String(a.id || '').localeCompare(String(b.id || ''));
  });
}
function opcoesFiltro(opcoes, valor){
  return opcoes.map(function(o){return '<option value="' + escapeHtml(o[0]) + '"' + (o[0] === valor ? ' selected' : '') + '>' + escapeHtml(o[1]) + '</option>';}).join('');
}

/* Tarifas por competência: extensão de configuração, fórmulas financeiras 1.06 preservadas. */
function validarVigenciasTarifarias(rows, profile){
  if(!Array.isArray(rows))return 'A programação de tarifas é inválida.';
  var datas={},fixos=(profile.variaveis || []).filter(function(v){return v.categoria==='fixo';});
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    if(!r || typeof r!=='object')return 'Há uma tarifa programada inválida.';
    if(r.perfilId!==profile.id)continue;
    if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(r.inicio || '') || !referenciaPeriodo(r.inicio))return 'Informe o mês de início de cada tarifa programada.';
    if(datas[r.inicio])return 'Use somente uma programação por mês para o mesmo perfil.';
    datas[r.inicio]=true;
    if(typeof r.confirmada!=='boolean')return 'Confira a confirmação da tarifa programada.';
    if(!r.valores || typeof r.valores!=='object' || Array.isArray(r.valores))return 'Confira os valores da tarifa programada.';
    var keys=Object.keys(r.valores);
    if(!keys.length)return 'Informe pelo menos um valor na tarifa programada.';
    for(var j=0;j<keys.length;j++){
      var k=keys[j],n=r.valores[k];
      if(!fixos.some(function(v){return v.chave===k;}) || typeof n!=='number' || !Number.isFinite(n))return 'Há um valor inválido ou incompatível com o perfil na programação.';
      if((k==='precoBase' || k==='taxaBandeira') && n<0)return 'Tarifas de energia e bandeira não podem ser negativas.';
      if(k==='desconto' && (n<0 || n>1))return 'Use desconto entre 0 e 1 (ex.: 0,20 para 20%).';
    }
  }
  return '';
}
function resolverTarifasPeriodo(client, profile, referencia){
  var valores={};
  (profile.variaveis || []).filter(function(v){return v.categoria==='fixo';}).forEach(function(v){
    var override=client.overridesFixos ? client.overridesFixos[v.chave] : undefined;
    valores[v.chave]=(override!==undefined && override!==null)?override:v.valorPadrao;
  });
  var rows=client.vigenciasTarifarias===undefined?[]:client.vigenciasTarifarias;
  var erro=validarVigenciasTarifarias(rows,profile),ref=referenciaPeriodo(referencia),aplicadas=[];
  if(erro)return {valores:valores,erro:erro,aplicadas:aplicadas};
  if(!ref && rows.some(function(r){return r.perfilId===profile.id;}))return {valores:valores,erro:'Confira o mês e ano antes de aplicar as tarifas programadas.',aplicadas:aplicadas};
  var periodo=ref ? ref.inicio.slice(0,7) : '';
  rows.filter(function(r){return r.perfilId===profile.id && r.confirmada && r.inicio<=periodo;}).slice().sort(function(a,b){return a.inicio.localeCompare(b.inicio);}).forEach(function(r){
    Object.keys(r.valores).forEach(function(k){valores[k]=r.valores[k];});
    aplicadas.push(copiarDados(r));
  });
  return {valores:valores,erro:'',aplicadas:aplicadas,referencia:referencia};
}

function conferirTributosConta(texto){
  var linhas=String(texto || '').split(/\r?\n/),seen={},out=[];
  linhas.forEach(function(l){
    if(!/\b(?:CBS|IBS|ICMS|PIS|COFINS)\b/i.test(l))return;
    var s=l.trim();if(s && !seen[s] && out.length<20){seen[s]=true;out.push(s.slice(0,1000));}
  });
  return out;
}

}

  var varsSaldo = mensalVars.filter(function(v){ return /saldo/i.test(v.chave); });
  var gd2= !perfilConsumoGD1(profile);
  var varsDados = mensalVars.filter(function(v){ return !/saldo/i.test(v.chave) && !(gd2 && v.chave==='injecaoTotal'); });
  var geracaoVar=gd2 && mensalVars.find(function(v){return v.chave==='injecaoTotal';});
  var geracaoHtml=geracaoVar?'<fieldset id="gd2-geracao-dados"><legend>Geração da usina GD2</legend><p class="hint" id="gd2-periodo">Consulte a geração total no APsystems para as datas de leitura da fatura.</p><div class="field"><label for="gd2-geracao">Geração total no período (kWh) — informar do APsystems</label><input type="text" inputmode="decimal" class="in-mensal" data-chave="injecaoTotal" id="gd2-geracao" placeholder="Informe a geração, sem somar créditos antigos"><span class="hint">Este valor vem do monitor da usina. A energia compensada e a injeção na rede da fatura são dados diferentes.</span></div><a href="https://apsystemsema.com/ema/index.action" target="_blank" rel="noopener noreferrer">Consultar APsystems</a>'+(profile.possuiItensMultiplos?'<label class="checkbox-field"><input type="checkbox" id="gd2-geracao-base" checked> Usar essa geração também no campo Consumo total do modelo de rateio existente</label>':'')+'<button type="button" class="btn" data-action="variacao-conta-gd2">Aplicar geração ao modelo GD2</button><p class="hint" id="gd2-apuracao" role="status"></p></fieldset>':'';
  var saldoHtml = saldoDocumentoCamposHtml(profile, varsSaldo.map(mensalFieldHtml).join(''));

  var formHtml;
  if(!profile.possuiItensMultiplos){
    var camposMensaisHtml = varsDados.map(mensalFieldHtml).join('');
    formHtml = camposComuns +

  container.innerHTML =
    '<header class="launch-heading"><div><h2>Lançamento do mês</h2><p>Preencha os dados, confira a cobrança e emita a fatura.</p></div><ol class="launch-steps" aria-label="Etapas do lançamento"><li><span>1</span> Dados</li><li><span>2</span> Conferência</li><li><span>3</span> Emissão</li></ol></header>' +
    '<div class="quote-grid">' +
      '<div class="quote-form-col">' + modoLancamentoHtml() + importacaoContaHtml() + geracaoHtml + formHtml +
        '<div class="btn-row"><button class="btn btn-primary" data-action="calcular">Calcular orçamento</button></div>' +
      '</div>' +
      '<div class="quote-preview-col" id="preview-col">' +
        '<div class="panel preview-empty"><span class="preview-symbol" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3h9l3 3v15H6z"/><path d="M9 10h6M9 14h6M9 18h4"/></svg></span><h2>Sua fatura aparece aqui</h2><p>Preencha os dados e clique em <b>Calcular orçamento</b>. Depois, confira a prévia, salve no histórico e baixe o PDF.</p></div>' +
      '</div>' +
    '</div>';

  saldoContextoFormulario=null;importacaoFormulario=null;modoLancamentoFormulario='manual';
  restaurarRascunhoSeExistir(c, profile);
  if(!saldoContextoFormulario)atualizarSaldoAnterior(true);
  renderOrigemSaldo();renderPeriodoConta();organizarLancamento();
}

function readMensaisFromForm(){
  var out = {};
  document.querySelectorAll('.in-mensal').forEach(function(inp){
    out[inp.dataset.chave] = (inp.type === 'checkbox') ? (inp.checked ? 1 : 0) : parseNumBR(inp.value);
  });
  return out;
}
function readItemRows(){
  var rows = document.querySelectorAll('#pontos-container .ponto-row');
  var itens = [];
  rows.forEach(function(row){
    var nome = row.querySelector('.item-nome').value.trim() || 'Ponto';
    var ucEl = row.querySelector('.item-uc');
    var uc = ucEl ? ucEl.value.trim() : '';
    var valores = {};
    row.querySelectorAll('.item-val').forEach(function(inp){
      valores[inp.dataset.chave] = (inp.type === 'checkbox') ? (inp.checked ? 1 : 0) : parseNumBR(inp.value);
    });
    itens.push(Object.assign({nome: nome, uc: uc}, valores));
  });
  return itens;
}

   RASCUNHO AUTOMÁTICO (recuperação se a página recarregar antes de salvar)
   ============================================================
   Guardado no localStorage do navegador (não no Supabase — é só uma rede de
   segurança local, temporária, até o usuário clicar em "Salvar no histórico"). */
function chaveRascunho(clientId){ return 'usinas:rascunho:' + clientId; }

function lerFormularioBruto(){
  var ajusteEl = document.getElementById('f-ajuste');
  var out = {
    referencia: getReferenciaAtual(),
    modoLancamento:modoLancamentoFormulario,
    ajusteRaw: ajusteEl ? ajusteEl.value : '',
    observacoes: txt('f-observacoes'),
    energiaDocumento: lerEnergiaDocumento(),
    saldoTransferencia: saldoContextoFormulario ? copiarDados(saldoContextoFormulario) : null,
    importacaoEquatorial:importacaoFormulario ? copiarDados(importacaoFormulario) : null,
    confirmarSaldoConta:!!(document.getElementById('confirmar-saldo-conta') && document.getElementById('confirmar-saldo-conta').checked),
    motivoConciliacaoSaldo:txt('motivo-conciliacao-saldo'),
    mensais: {}, itens: null
  };
  document.querySelectorAll('.in-mensal').forEach(function(inp){
    out.mensais[inp.dataset.chave] = (inp.type === 'checkbox') ? (inp.checked ? '1' : '0') : inp.value;
  });
  var pontosContainer = document.getElementById('pontos-container');
  if(pontosContainer){
    out.itens = [];
    pontosContainer.querySelectorAll('.ponto-row').forEach(function(row){
      var ucEl = row.querySelector('.item-uc');
      var item = { nome: row.querySelector('.item-nome').value, uc: ucEl ? ucEl.value : '' };
      row.querySelectorAll('.item-val').forEach(function(inp){
        item[inp.dataset.chave] = (inp.type === 'checkbox') ? (inp.checked ? '1' : '0') : inp.value;
      });
      out.itens.push(item);
    });
  }
  return out;
}
function salvarRascunhoAtual(){
  if(state.activeTab !== 'novo') return;
  var c = selectedClient();
  if(!c) return;
  try{ window.localStorage.setItem(chaveRascunho(c.id), JSON.stringify(lerFormularioBruto())); }
  catch(e){}
}
function lerRascunho(clientId){
  try{
    var raw = window.localStorage.getItem(chaveRascunho(clientId));
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function limparRascunho(clientId){
  try{ window.localStorage.removeItem(chaveRascunho(clientId)); }catch(e){}
}
function restaurarRascunhoSeExistir(client, profile){
  var rascunho = lerRascunho(client.id);
  if(!rascunho) return;
  setReferenciaAtual(rascunho.referencia || refPadrao());
  var ajusteEl = document.getElementById('f-ajuste');
  if(ajusteEl) ajusteEl.value = rascunho.ajusteRaw || '';
  setIf('f-observacoes', rascunho.observacoes || '');
  restaurarEnergiaDocumento(rascunho.energiaDocumento);
  Object.keys(rascunho.mensais || {}).forEach(function(chave){
    var el = document.querySelector('.in-mensal[data-chave="' + chave + '"]');
    if(!el) return;
    if(el.type === 'checkbox') el.checked = !!parseNumBR(rascunho.mensais[chave]);
    else el.value = rascunho.mensais[chave];
  });
  if(profile.possuiItensMultiplos && rascunho.itens && rascunho.itens.length){
    var wrap = document.getElementById('pontos-container');
    if(wrap){
      wrap.innerHTML = rascunho.itens.map(function(it){
        var valores = {};
        Object.keys(it).forEach(function(k){ if(k !== 'nome' && k !== 'uc') valores[k] = parseNumBR(it[k]); });
        return itemInputRowHtml(profile, it.nome, it.uc, valores);
      }).join('');
    }
  }
  saldoContextoFormulario=rascunho.saldoTransferencia ? copiarDados(rascunho.saldoTransferencia) : {modo:'manual',identidade:identidadeSaldoFormulario(),referencia:getReferenciaAtual(),motivo:'Rascunho anterior recuperado',aviso:'Saldo do rascunho preservado. Confira a origem antes de emitir.'};
  setIf('saldo-correcao-motivo',saldoContextoFormulario.motivo || '');
  importacaoFormulario=rascunho.importacaoEquatorial ? copiarDados(rascunho.importacaoEquatorial) : null;
  modoLancamentoFormulario=rascunho.modoLancamento || (importacaoFormulario?'fatura':'manual');
  document.getElementById('confirmar-saldo-conta').checked=!!rascunho.confirmarSaldoConta;
  setIf('motivo-conciliacao-saldo',rascunho.motivoConciliacaoSaldo || '');
  renderPeriodoConta();renderOrigemSaldo();
  toast('Recuperamos os dados do seu último lançamento não salvo para este cliente.');
  onCalcular();
}

/* Para perfis com "distribuicaoAutomaticaPontos" ligado: NENHUM ponto tem consumo ou
   Fio B digitado diretamente — os dois são sempre calculados a partir dos campos da
   conta (iguais aos que já vinham da planilha). Só existe UM ponto "principal" por vez
   (marcado com o checkbox pontoPrincipal); os demais são sempre os "que sobram":
     consumo do principal   = energiaAtiva + (consumoTotal - injecaoNaConta)
     fio B do principal     = fioB (o valor da conta, sem cálculo — é o mesmo ponto da fatura)
     taxa de fio B por kWh  = fioB / energiaAtiva
     consumo de cada outro  = (injecaoTotal - consumo do principal) / nº de pontos não-principais
     fio B de cada outro    = seu consumo * taxa de fio B por kWh
   Isso assume 100% da energia sendo repartida só entre os pontos cadastrados. */
function aplicarDistribuicaoAutomatica(profile, itens, valoresEntrada){
  var vazio = { itens: itens, excedenteKwh: 0 };
  if(!profile.distribuicaoAutomaticaPontos || !itens || itens.length < 1) return vazio;
  var chaveConsumo = 'consumoKwh';
  var chaveFioB = profile.chaveItemFioB;
  if(!chaveFioB) return vazio;

  var indicesPrincipais = [];
  itens.forEach(function(it, i){ if(it.pontoPrincipal) indicesPrincipais.push(i); });
  if(indicesPrincipais.length === 0){
    indicesPrincipais = [0];
    toast('Nenhum ponto marcado como "principal" — usando "' + (itens[0].nome||'Ponto 1') + '" como referência para o cálculo automático.');
  } else if(indicesPrincipais.length > 1){
    indicesPrincipais = [indicesPrincipais[0]];
    toast('Só pode haver um ponto principal — usando "' + (itens[indicesPrincipais[0]].nome||'Ponto 1') + '" e ignorando as outras marcações.');
  }
  var iPrincipal = indicesPrincipais[0];

  var energiaAtiva = valoresEntrada.energiaAtiva || 0;
  var consumoTotal = valoresEntrada.consumoTotal || 0;
  var injecaoNaConta = valoresEntrada.injecaoNaConta || 0;
  var fioBConta = valoresEntrada.fioB || 0;
  var injecaoSolar = valoresEntrada.injecaoTotal || 0;

  var autoConsumo = consumoTotal - injecaoNaConta;
  var consumoPrincipal = energiaAtiva + autoConsumo;
  if(consumoPrincipal < 0 || energiaAtiva < 0 || consumoTotal < 0 || injecaoNaConta < 0 || injecaoSolar < 0){
    return {itens:itens,excedenteKwh:0,erro:'Os dados do mês resultam em consumo negativo no GD2. Confira a leitura de consumo, a energia ativa e a injeção que aparece na conta antes de calcular.'};
  }

  /* Um ponto de consumo NUNCA pode ter injeção negativa — não existe fisicamente
     "mandar energia negativa" pra um ponto. Quando o consumo do principal (naquele
     ciclo de fatura) é maior que a injeção total do mês, a diferença vem do SALDO
     acumulado da conta (crédito bancado em meses anteriores). Por padrão, isso é
     tratado como energia nova sendo vendida agora — cobra-se o valor cheio do
     principal, sem desconto nenhum (é a prática normal: "mandei 1.100, ele consumiu
     mais 100 do saldo, cobro 1.200"). SÓ quando esse saldo específico já foi cobrado
     do cliente em meses anteriores (checkbox marcado — ex.: caso do Aurélio) é que
     NÃO se cobra de novo: aí a diferença vira um AJUSTE PRÓPRIO que reduz o total,
     nunca disfarçado de "valor negativo" de um ponto — os pontos secundários ficam
     sempre zerados, nunca negativos, independente da opção marcada. */
  var restante = injecaoSolar - consumoPrincipal;
  var saldoJaCobrado = !!valoresEntrada.saldoCobreNegativo;
  var excedenteKwh = 0;
  if(restante < 0){
    excedenteKwh = saldoJaCobrado ? (-restante) : 0;
    if(saldoJaCobrado){
      toast('O consumo do principal ficou maior que a injeção do mês — como esse saldo já foi cobrado do cliente antes, o valor equivalente (' + fmtNum(-restante) + ' kWh) entrou como ajuste, reduzindo o total. Os pontos secundários ficaram zerados.');
    } else {
      toast('O consumo do ponto principal (' + fmtNum(consumoPrincipal) + ' kWh) ficou maior que a injeção solar do mês (' + fmtNum(injecaoSolar) + ' kWh) — a diferença veio do saldo da conta. Por padrão isso está sendo cobrado do cliente como consumo normal (sem desconto). Se esse saldo já tiver sido cobrado dele em meses anteriores, marque a opção pra não cobrar de novo. Se não for esperado, confira "Energia ativa" e "Injeção que aparece na conta".');
    }
    restante = 0;
  }
  var indicesSecundarios = itens.map(function(it,i){ return i; }).filter(function(i){ return i !== iPrincipal; });
  var fatia = indicesSecundarios.length ? (restante / indicesSecundarios.length) : 0;

  var itensProcessados = itens.map(function(it, i){
    if(i === iPrincipal){
      it.pontoPrincipal = 1;
      it[chaveConsumo] = consumoPrincipal;
      it[chaveFioB] = fioBConta;
    } else {
      /* Fio B nunca é cobrado dos pontos secundários — só o principal paga o Fio B
         (é a conta dele que realmente tem essa cobrança da concessionária). */
      it.pontoPrincipal = 0;
      it[chaveConsumo] = fatia;
      it[chaveFioB] = 0;
    }
    return it;
  });

  return { itens: itensProcessados, excedenteKwh: excedenteKwh };
}

/* Depois de calcular, escreve de volta nos campos da tela o consumo/Fio B que o sistema
   calculou para os pontos não-principais, para o usuário ver exatamente o que foi usado
   (os campos continuam editáveis, mas serão recalculados no próximo "Calcular orçamento"). */
function refletirValoresCalculadosNoFormulario(profile, itens){
  if(!profile.distribuicaoAutomaticaPontos) return;
  var chaveConsumo = 'consumoKwh';
  var chaveFioB = profile.chaveItemFioB;
  var rows = document.querySelectorAll('#pontos-container .ponto-row');
  rows.forEach(function(row, i){
    var item = itens[i]; if(!item) return;
    var consumoInp = row.querySelector('.item-val[data-chave="'+chaveConsumo+'"]');
    if(consumoInp) consumoInp.value = fmtNum(item[chaveConsumo]);
    if(chaveFioB){
      var fioBInp = row.querySelector('.item-val[data-chave="'+chaveFioB+'"]');
      if(fioBInp) fioBInp.value = fmtNum(item[chaveFioB]);
    }
  });
}

function onCalcular(){
  if(modoLancamentoFormulario==='fatura' && !importacaoFormulario){toast('Leia a fatura e aplique os dados conferidos antes de calcular, ou escolha Lançamento manual.');return;}
  if(completarVariacaoContaGd2(true)===false)return;
  var c = selectedClient(); if(!c) return;
  var profile = getProfile(c.profileId); if(!profile) return;

  if(!validarTransferenciaSaldo() || !validarConciliacaoSaldo())return;
  var referencia = getReferenciaAtual();
  var ajuste = num('f-ajuste');
  var observacoes = txt('f-observacoes');
  var tarifasPeriodo = resolverTarifasPeriodo(c,profile,referencia);
  if(tarifasPeriodo.erro){toast(tarifasPeriodo.erro);return;}
  var fixos = tarifasPeriodo.valores;
  var mensais = readMensaisFromForm();
  if(perfilConsumoGD1(profile) && (mensais.energiaAtiva < 0 || mensais.injecaoTotal < 0)){
    toast('No GD1, o consumo não compensado e a injeção precisam ser iguais ou maiores que zero. A variação de saldo pode ser negativa.'); return;
  }
  var energiaDocumentoInputs = lerEnergiaDocumento();
  if(Object.keys(energiaDocumentoInputs).some(function(k){
    var n = energiaDocumentoInputs[k]; return n !== null && (!isFinite(n) || n < 0);
  })){ toast('Consumo, injeção e saldo do documento precisam ser números iguais ou maiores que zero.'); return; }
  var valoresEntrada = Object.assign({}, fixos, mensais, { ajuste: ajuste });

  var itensInputRaw = profile.possuiItensMultiplos ? readItemRows() : null;
  var excedenteKwh = 0;
  if(profile.possuiItensMultiplos && profile.distribuicaoAutomaticaPontos){
    var distrib = aplicarDistribuicaoAutomatica(profile, itensInputRaw, valoresEntrada);
    if(distrib.erro){ toast(distrib.erro); return; }
    itensInputRaw = distrib.itens;
    excedenteKwh = distrib.excedenteKwh;
    refletirValoresCalculadosNoFormulario(profile, itensInputRaw);
  }

  var resultado = avaliarPerfil(profile, valoresEntrada, itensInputRaw);
  if(!resultado.ok){
    toast('Erro na fórmula do perfil — ' + mensagemErroAvaliacao(resultado.erro));
    return;
  }
  if(!Number.isFinite(resultado.scope[profile.chaveTotalFinal])){
    toast('O perfil não produziu um valor final válido. Confira a variável do total nas fórmulas do perfil.');
    return;
  }

  /* Quando o consumo do ponto principal excede a injeção do mês e esse saldo JÁ foi
     cobrado anteriormente, a diferença vira seu próprio ajuste explícito no total —
     nunca um valor negativo disfarçado de "ponto de consumo" (não existe fisicamente
     enviar energia negativa pra um ponto). */
  var ajusteExcedenteRS = 0;
  if(excedenteKwh > 0.004 && resultado.scope.precoComDesconto !== undefined){
    ajusteExcedenteRS = excedenteKwh * resultado.scope.precoComDesconto;
    resultado.scope.ajusteConsumoExcedente = ajusteExcedenteRS;
    resultado.scope[profile.chaveTotalFinal] = (resultado.scope[profile.chaveTotalFinal] || 0) - ajusteExcedenteRS;
  }

  /* "Quem paga a fatura" é uma configuração do CLIENTE, não do perfil. O Fio B só existe
     em perfis GD2 e a fórmula do perfil sempre o desconta do valor da locação por padrão
     — isso está certo quando o CLIENTE paga a fatura direto pra concessionária (ele já
     paga o Fio B por lá). Quando é a locadora que paga a fatura, é o oposto: é ela quem
     arca com o Fio B, então ninguém desconta o Fio B do valor da locação (senão o
     cliente pagaria o Fio B duas vezes — uma pelo desconto que não teve, outra pelo
     repasse). Por isso, nesse caso, desfazemos o desconto de Fio B e o repasse da fatura
     exclui a parte do Fio B (só repassamos "as partes de fora": iluminação, adicionais
     etc. — o Fio B "fica" com a locadora, que é quem vai pagar a concessionária com ele). */
  var repasseFatura = 0;
  var ocultarFioBPorPonto = false;
  var chaveFatura = (resultado.scope.valorFaturaInfo !== undefined) ? 'valorFaturaInfo'
                   : (resultado.scope.valorFaturaImpresso !== undefined) ? 'valorFaturaImpresso' : null;
  if(c.locadorPagaFatura && chaveFatura){
    var valorFatura = resultado.scope[chaveFatura] || 0;
    var fioBTotal = profile.possuiItensMultiplos ? (resultado.scope.fioBAlocadoTotal || 0) : (resultado.scope.fioB || 0);
    if(fioBTotal > 0.004){
      if(profile.possuiItensMultiplos && resultado.itensResultado && profile.chaveItemFioB){
        resultado.itensResultado.forEach(function(item){
          item[resultado.chaveItemValor] = (item[resultado.chaveItemValor]||0) + (item[profile.chaveItemFioB]||0);
        });

var salvandoHistorico = false;
async function onSalvarHistorico(){
  if(!state.lastDraft){ toast('Calcule um orçamento antes de salvar.'); return; }
  if(state.faturaDesatualizada){toast('Os dados mudaram. Calcule novamente antes de salvar no histórico.');return;}
  if(salvandoHistorico) return;
  salvandoHistorico = true;
  try{
    /* Snapshot profundo: nunca compartilhar arrays/objetos com o preview editável.
       O histórico armazena o resultado final; não roda o motor novamente. */
    var q = copiarDados(state.lastDraft);
    q.id = uid(); q.createdAt = new Date().toISOString();
    if(q.saldoTransferencia && q.saldoTransferencia.modo === 'automatico' && verificarOrigemSaldo(q,[q].concat(state.quotes),{})){toast('A origem do saldo mudou. Calcule novamente com o saldo conferido antes de salvar.');return;}
    var quotes = [q].concat(state.quotes);
    if(!await saveQuotes(quotes)){
      toast('Não foi possível salvar no histórico. Confira sua conexão e tente novamente.');
      return;
    }
    state.quotes = quotes;
    limparRascunho(q.clientId);
    toast('Orçamento salvo no histórico.');
    if(state.activeTab === 'historico'){ renderTabContent(); }
  } finally { salvandoHistorico = false; }
}

/* Datas de referência representam meses; um intervalo inclui os meses que o cruzam. */
function isoDia(ano,mes,dia){ return String(ano).padStart(4,'0') + '-' + String(mes).padStart(2,'0') + '-' + String(dia).padStart(2,'0'); }
function referenciaPeriodo(referencia){
  var ref=textoBusca(referencia), m=/^(\d{1,2})\/(\d{4})$/.exec(ref), mes,ano;
  if(m){mes=Number(m[1]);ano=Number(m[2]);}
  else{
    m=/^([a-z]+)[\/\s-]+(\d{4})$/.exec(ref);
    if(m){ano=Number(m[2]);mes=MESES_PT.findIndex(function(n){return textoBusca(n) === m[1] || textoBusca(n).slice(0,3) === m[1];})+1;}
    else {m=/^(\d{4})-(\d{2})$/.exec(ref);if(m){ano=Number(m[1]);mes=Number(m[2]);}}
  }
  if(!ano || !mes || mes > 12 || ano < 1000) return null;
  return {ano:ano,mes:mes,inicio:isoDia(ano,mes,1),fim:isoDia(ano,mes,new Date(Date.UTC(ano,mes,0)).getUTCDate())};
}
function dataSalvamentoPeriodo(q){
  var d=new Date(q.createdAt);if(!isFinite(d.getTime())) return null;
  var iso=isoDia(d.getFullYear(),d.getMonth()+1,d.getDate());
  return {ano:d.getFullYear(),inicio:iso,fim:iso};
}
function dataFiltroValida(valor){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(valor)) return false;
  var p=valor.split('-').map(Number), d=new Date(Date.UTC(p[0],p[1]-1,p[2]));
  return d.getUTCFullYear() === p[0] && d.getUTCMonth()+1 === p[1] && d.getUTCDate() === p[2];
}
function filtrosHistoricoPadrao(){return {escopo:'atual',cliente:'',tipo:'',ano:'',baseData:'referencia',de:'',ate:'',ordem:'recentes'};}
function filtrosHistorico(){ if(!state.filtrosHistorico) state.filtrosHistorico=filtrosHistoricoPadrao();return state.filtrosHistorico; }
function erroFiltrosHistorico(){
  var f=filtrosHistorico();
  if(f.ano && !/^\d{4}$/.test(f.ano)) return 'Informe um ano com quatro dígitos.';
  if((f.de && !dataFiltroValida(f.de)) || (f.ate && !dataFiltroValida(f.ate))) return 'Informe datas válidas para o período.';
  if(f.de && f.ate && f.de > f.ate) return 'A data inicial deve ser anterior ou igual à data final.';
  return '';
}
function clienteBuscaQuote(q){return q.clienteSnapshot || state.clients.find(function(c){return c.id === q.clientId;}) || {nome:'Cliente não encontrado'};}
function historicoItemsFiltrados(c){
  var f=filtrosHistorico(); if(erroFiltrosHistorico()) return [];
  var items=state.quotes.filter(function(q){
    if(f.escopo !== 'todos' && (!c || q.clientId !== c.id)) return false;
    var cliente=clienteBuscaQuote(q), atual=state.clients.find(function(x){return x.id === q.clientId;});
    var campos=dadosBuscaCliente(cliente).concat(dadosBuscaCliente(atual));
    (q.itensResultado || q.itens || []).forEach(function(p){campos.push(p.nome,p.uc);});
    if(!correspondeBusca(f.cliente,campos)) return false;
    if(f.tipo && tipoGDDoPerfil(perfilDoDocumento(q)) !== f.tipo) return false;
    var referencia=referenciaPeriodo(q.referencia), periodo=f.baseData === 'salvamento' ? dataSalvamentoPeriodo(q) : referencia;
    if((f.ano || f.de || f.ate) && !periodo) return false;
    if(f.ano && String(periodo.ano) !== f.ano) return false;
    if(f.de && periodo.fim < f.de) return false;
    if(f.ate && periodo.inicio > f.ate) return false;
    var salvo=dataSalvamentoPeriodo(q);
    return correspondeBusca(state.buscaHistorico,[q.referencia,salvo ? salvo.inicio.split('-').reverse().join('/') : '',
      referencia ? String(referencia.mes).padStart(2,'0')+'/'+referencia.ano : '']);
  });
  if(f.ordem !== 'recentes') return ordenarPorIdentificacao(items,f.ordem,clienteBuscaQuote);
  return items.slice().sort(function(a,b){return (Date.parse(b.createdAt) || 0)-(Date.parse(a.createdAt) || 0);});
}
