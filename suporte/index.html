<script>
(function(){
"use strict";
var SUPABASE_URL = 'https://zhkolwskpqhlovvdrbmv.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_3bqhMMM6CndF6MKl5N1FoA_GaS_mq7E';
var supabaseClient = (window.supabase && typeof window.supabase.createClient === 'function')
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

async function initSupport(){
  var email = '';
  if(supabaseClient){
    try{
      var r = await supabaseClient.auth.getSession();
      var session = r.data && r.data.session;
      if(session && session.user){ email = session.user.email || ''; }
    }catch(e){}
  }
  var noteEl = document.getElementById('email-note');
  var subject = encodeURIComponent('Suporte IG Base');
  var body;
  if(email){
    noteEl.innerHTML = 'Sua mensagem vai incluir automaticamente o e-mail da sua conta: <b>' + escapeHtml(email) + '</b>.';
    body = encodeURIComponent('Conta: ' + email + '\n\nDescreva sua dúvida ou problema abaixo:\n\n');
  } else {
    noteEl.textContent = 'Você não está logado — se quiser, faça login primeiro para que o e-mail da sua conta seja incluído automaticamente.';
    body = encodeURIComponent('Descreva sua dúvida ou problema abaixo:\n\n');
  }
  document.getElementById('mailto-btn').href = 'mailto:suporteigbase@igbase.com.br?subject=' + subject + '&body=' + body;
}
initSupport();
})();
</script>
