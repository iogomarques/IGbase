<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Suporte — IG Base</title>
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-ig-base.png?v=1.09.10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-a:#eaf1e6; --bg-b:#f6f8f4;
    --panel:#ffffff; --panel-border:#dde5da;
    --green-deep:#2f663f; --green-bright:#3f8f4a;
    --gray:#7c8479; --ink:#1f2a22; --ink-soft:#5b665a;
    --radius:18px; --nav-h:64px;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; min-height:100vh; padding-top:var(--nav-h);
    background: radial-gradient(ellipse 1200px 640px at 50% -8%, var(--bg-a) 0%, var(--bg-b) 55%, #eef1ec 100%);
    color:var(--ink); position:relative;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  a{ color:inherit; }
  .topbar{
    position:fixed; top:0; left:0; right:0; height:var(--nav-h); z-index:30;
    display:flex; align-items:center; justify-content:space-between; padding:0 22px;
    background:rgba(255,255,255,0.78); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--panel-border);
  }
  .back-link{ display:flex; align-items:center; gap:6px; font-size:13.5px; font-weight:600; color:var(--ink-soft); text-decoration:none; }
  .back-link:hover{ color:var(--green-deep); }
  .topbar span.brand{ font-family:'Poppins',sans-serif; font-weight:700; font-size:15.5px; color:var(--ink-soft); }

  main{ max-width:520px; margin:0 auto; padding:64px 24px 40px; text-align:center; }
  main h1{ font-family:'Poppins',sans-serif; font-weight:800; font-size:clamp(24px,4vw,32px); margin:0 0 14px; }
  main > p{ color:var(--ink-soft); font-size:15px; line-height:1.6; margin:0 0 30px; }

  .support-card{ background:var(--panel); border:1px solid var(--panel-border); border-radius:var(--radius);
    padding:30px 26px; box-shadow:0 1px 2px rgba(31,42,34,0.05); }
  .mailto-btn{ display:inline-flex; align-items:center; background:var(--green-deep); color:#fff !important;
    text-decoration:none; font-weight:600; font-size:15px; padding:13px 24px; border-radius:12px; transition:background .15s; }
  .mailto-btn svg{ margin-right:9px; }
  .mailto-btn:hover{ background:#254f31; }
  .support-hint{ margin-top:16px; font-size:12.5px; color:var(--gray); }
</style>
<script src="/shared/account.js?v=1.09.10"></script><link rel="stylesheet" href="/shared/presentation.css?v=1.09.10"></head>
<body>
  <nav class="topbar">
    <a class="back-link" href="/">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      Voltar
    </a>
    <div data-ig-account><a href="/">IG Base</a></div>
  </nav>

  <main>
    <h1>Suporte</h1>
    <p>Precisa de ajuda com algum dos módulos do IG Base? Manda um e-mail pra gente que respondemos assim que possível.</p>

    <div class="support-card">
      <a id="mailto-btn" class="mailto-btn" href="mailto:suporteigbase@igbase.com.br">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        Enviar e-mail para o suporte
      </a>
      <div class="support-hint">Isso abre o seu aplicativo de e-mail padrão (Gmail, Outlook...), já com o destinatário preenchido.</div>
    </div>
  </main>
</body>
</html>
