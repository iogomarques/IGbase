<style>
  :root{
    --bg: #F3F7F4;
    --surface: #FFFFFF;
    --surface-2: #EAF1EC;
    --ink: #16241D;
    --ink-soft: #5C6F63;
    --line: #DAE6DE;
    --accent: #1B4D3E;
    --accent-hover: #163E32;
    --accent-ink: #FFFFFF;
    --accent-soft: #E3EEE8;
    --savings: #2F9E6F;
    --savings-soft: #E1F3E9;
    --alert: #AE3A2B;
    --alert-soft: #F7E4E0;
    --dot-single: #6FA98A;
    --dot-multi: #1B4D3E;
    --radius-s: 6px;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace;
    --shadow-lift: 0 1px 2px rgba(22,36,29,.06), 0 8px 24px rgba(22,36,29,.08);
    --ease: cubic-bezier(.4,0,.2,1);
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{ margin:0; font-family: var(--sans); color: var(--ink); background: var(--bg); font-size: 14.5px; line-height: 1.5; }
  ::selection{ background: var(--accent-soft); }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  button{ font-family: inherit; font-size: inherit; }
  input, select, textarea{ font-family: inherit; font-size: inherit; color: var(--ink); }
  .tabular{ font-variant-numeric: tabular-nums; }
  code, .mono{ font-family: var(--mono); }

  .app{ display:flex; min-height:100vh; }
  .sidebar{ width: 250px; flex: none; background: var(--surface-2); border-right: 1px solid var(--line); display:flex; flex-direction:column; padding: 20px 14px; }
  .brand{ display:flex; align-items:center; gap:9px; margin-bottom: 22px; padding: 0 6px; }
  .brand-text{ display:flex; flex-direction:column; line-height:1.2; }
  .brand-text b{ font-family: var(--serif); font-size: 17px; font-weight:700; }
  .brand-text span{ font-size:11.5px; color: var(--ink-soft); }
  .brand-email{ font-size:12.5px; color: var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 2px; margin-bottom:18px; }
  .settings-btn{ flex-shrink:0; width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background .15s,color .15s,border-color .15s; }
  .settings-btn:hover{ background: var(--panel-soft, #f3f4f2); color: var(--ink); }
  .settings-btn.active{ background: var(--accent); border-color: var(--accent); color:#fff; }
  .side-label{ font-size:11.5px; color: var(--ink-soft); padding: 0 6px 6px; }
  .client-list{ display:flex; flex-direction:column; gap:3px; overflow-y:auto; flex:1; }
  .client-row{ display:flex; align-items:center; gap:9px; padding: 9px 8px; border-radius: var(--radius-s); cursor:pointer; border: 1px solid transparent; transition: background .15s var(--ease), border-color .15s var(--ease), transform .15s var(--ease); }
  .client-row:active{ transform: scale(.985); }
  .client-row:hover{ background: var(--surface); }
  .client-row.active{ background: var(--surface); border-color: var(--line); box-shadow: var(--shadow-lift); }
  .client-dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .client-row .meta{ flex:1; min-width:0; }
  .client-row .meta .nome{ font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .client-row .meta .uc{ font-size:11.5px; color: var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .client-row .edit-btn{ opacity:0; flex:none; background:none; border:none; cursor:pointer; padding:4px; color: var(--ink-soft); border-radius: var(--radius-s); }
  .client-row:hover .edit-btn{ opacity:1; }
  .client-row .edit-btn:hover{ background: var(--surface-2); color: var(--ink); }
  .btn-new-client{ margin-top: 12px; width:100%; padding: 9px 10px; border-radius: var(--radius-s); border: 1px dashed var(--line); background: transparent; color: var(--ink-soft); cursor:pointer; text-align:left; }
  .btn-new-client:hover{ border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{ padding: 22px 32px 0; display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .topbar h1{ font-family: var(--serif); font-size: 22px; margin:0; font-weight:700; }
  .topbar .sub{ font-size:12.5px; color: var(--ink-soft); margin-top:2px; }

  .tabs{ display:flex; gap: 4px; padding: 16px 32px 0; border-bottom: 1px solid var(--line); flex-wrap:wrap; }
  .tab-btn{ background:none; border:none; cursor:pointer; padding: 9px 4px; margin-right: 22px; color: var(--ink-soft); border-bottom: 2px solid transparent; position:relative; top:1px; transition: color .15s var(--ease), border-color .2s var(--ease); }
  .tab-btn.active{ color: var(--ink); border-bottom-color: var(--accent); font-weight:600; }
  .tab-btn:disabled{ color:#C7CBBE; cursor:not-allowed; }

  .content{ padding: 24px 32px 60px; flex:1; }
  #tab-content{ transition: opacity .22s var(--ease), transform .22s var(--ease); }
  .empty-state{ max-width: 460px; margin: 40px auto; text-align:center; padding: 32px 24px; border: 1px dashed var(--line); border-radius: var(--radius-s); }
  .empty-state p{ color: var(--ink-soft); margin: 8px 0 18px; }

  .quote-grid{ display:flex; gap: 28px; align-items:flex-start; }
  .quote-form-col{ flex: 1 1 52%; min-width: 320px; }
  .quote-preview-col{ flex: 1 1 48%; min-width: 320px; position: sticky; top: 20px; }

  fieldset{ border:1px solid var(--line); border-radius: var(--radius-s); padding: 14px 16px 16px; margin: 0 0 16px; background: var(--surface); }
  legend{ padding: 0 6px; font-size:12.5px; color: var(--ink-soft); }
  .field{ margin-bottom: 12px; }

<script>
(function(){
"use strict";

/* ============================================================

   ============================================================ */
function uid(){ return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8); }

function parseNumUnico(str){
  var s = String(str).trim();
  if(s === '') return 0;
  if(s.indexOf(',') > -1){ s = s.replace(/\./g,'').replace(',', '.'); }
  var n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function parseNumBR(str){
  if(str === null || str === undefined) return 0;
  var s = String(str).trim();
  if(s === '') return 0;
  /* Permite digitar somas/subtrações direto no campo, ex.: "45,20+12,30+8" ou
     "100,50-20,30" — útil quando a fatura tem várias multas/adicionais pra somar. */
  if(/[+-]/.test(s.slice(1))){
    var partes = s.match(/[+-]?[^+-]+/g) || [s];
    var soma = 0;
    partes.forEach(function(parte){
      var sinal = 1, termo = parte.trim();
      if(termo.charAt(0) === '-'){ sinal = -1; termo = termo.slice(1); }
      else if(termo.charAt(0) === '+'){ termo = termo.slice(1); }
      soma += sinal * parseNumUnico(termo);
    });
    return soma;
  }
  return parseNumUnico(s);
}
var fmtCurrency = new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL' });
function fmtBRL(n){ return fmtCurrency.format(n || 0); }
function fmtKwh(n){ return (n||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' kWh'; }
function fmtPct(frac){ return ((frac||0)*100).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}) + '%'; }
function fmtNum(n){
  if(n === undefined || n === null) return '0';
  var s = n.toLocaleString('pt-BR', {minimumFractionDigits:0, maximumFractionDigits:6});
  return s;
}
function formatarValor(v, formato){
  if(v === undefined || v === null || isNaN(v)) return '—';
  switch(formato){
    case 'moeda': return fmtBRL(v);
    case 'kwh': return fmtKwh(v);
    case 'percentual': return fmtPct(v);
    case 'booleano': return v ? 'Sim' : 'Não';
    default: return (v||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});

}

  return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-zA-Z0-9]+/g,' ').trim().split(' ').filter(Boolean)
    .map(function(w,i){ return i===0 ? w.toLowerCase() : (w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()); })
    .join('') || ('campo' + Math.floor(Math.random()*1000));
}
function parseAssignKey(line){
  var m = /^\s*([A-Za-zÀ-ÖØ-öø-ÿ_][A-Za-zÀ-ÖØ-öø-ÿ0-9_]*)\s*=/.exec(line||'');
  return m ? m[1] : null;
}
function linhasExecutaveis(arr){
  return (arr||[]).filter(function(l){
    var t = (l||'').trim();
    return t && t.charAt(0) !== '#' && t.substr(0,2) !== '//';
  });
}
var MESES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function refPadrao(){
  var d = new Date();
  return MESES_PT[d.getMonth()] + '/' + d.getFullYear();
}
function refFieldsHtml(valorAtual){
  var partes = (valorAtual || refPadrao()).split('/');
  var mesAtual = partes[0];
  var anoAtual = partes[1] || String(new Date().getFullYear());
  var idxMes = MESES_PT.indexOf(mesAtual);
  if(idxMes === -1) idxMes = new Date().getMonth();
  return '<div class="field-row" style="gap:8px">' +
    '<div class="field" style="flex:1.4"><label>Mês</label><select id="f-ref-mes">' +
      MESES_PT.map(function(m, i){ return '<option value="' + i + '"' + (i === idxMes ? ' selected' : '') + '>' + m + '</option>'; }).join('') +
    '</select></div>' +
    '<div class="field" style="flex:1"><label>Ano</label><input type="number" id="f-ref-ano" value="' + escapeHtml(anoAtual) + '" step="1" inputmode="numeric"></div>' +
  '</div>';
}
function getReferenciaAtual(){
  var mesEl = document.getElementById('f-ref-mes');
  var anoEl = document.getElementById('f-ref-ano');
  if(!mesEl || !anoEl) return refPadrao();
  var idx = parseInt(mesEl.value, 10);
  var ano = (anoEl.value || '').trim() || String(new Date().getFullYear());
  return (MESES_PT[idx] || MESES_PT[0]) + '/' + ano;
}
function setReferenciaAtual(valor){
  if(!valor) return;
  var partes = valor.split('/');
  var idx = MESES_PT.indexOf(partes[0]);
  var mesEl = document.getElementById('f-ref-mes');
  var anoEl = document.getElementById('f-ref-ano');
  if(mesEl && idx > -1) mesEl.value = String(idx);
  if(anoEl && partes[1]) anoEl.value = partes[1];

function toast(msg){

function num(id){ var el = document.getElementById(id); return el ? parseNumBR(el.value) : 0; }
function txt(id){ var el = document.getElementById(id); return el ? el.value.trim() : ''; }
function chk(id){ var el = document.getElementById(id); return el ? el.checked : false; }

/* ============================================================
   MOTOR DE FÓRMULAS (tokenizer + parser + avaliador)
   ============================================================ */
function tokenize(expr){

  function isDigit(c){ return c >= '0' && c <= '9'; }
  function isIdentStart(c){ return /[A-Za-z_À-ÖØ-öø-ÿ]/.test(c); }
  function isIdentPart(c){ return /[A-Za-z0-9_À-ÖØ-öø-ÿ]/.test(c); }
  while(i < n){
    var c = expr[i];
    if(c === ' ' || c === '\t'){ i++; continue; }
    if(isDigit(c) || (c === '.' && isDigit(expr[i+1]))){
      var j = i;
      while(j<n && (isDigit(expr[j]) || expr[j]==='.')) j++;
      tokens.push({type:'NUM', value: parseFloat(expr.slice(i,j))});
      i = j; continue;
    }
    if(isIdentStart(c)){
      var j2 = i;
      while(j2<n && isIdentPart(expr[j2])) j2++;
      tokens.push({type:'ID', value: expr.slice(i,j2)});
      i = j2; continue;
    }
    var two = expr.substr(i,2);
    if(['>=','<=','==','!=','&&','||'].indexOf(two) > -1){ tokens.push({type:'OP', value: two}); i+=2; continue; }
    if('+-*/%^(),?:><=!'.indexOf(c) > -1){ tokens.push({type:'OP', value:c}); i++; continue; }
    throw new Error("Caractere inesperado: '"+c+"'");
  }
  return tokens;
}

function parseExprTokens(tokens){
  var pos = 0;
  function peek(){ return tokens[pos]; }
  function next(){ return tokens[pos++]; }
  function expectOp(v){ var t = next(); if(!t || t.type!=='OP' || t.value!==v) throw new Error("Esperado '"+v+"'"); }
  function parseAssignment(){
    if(peek() && peek().type==='ID' && tokens[pos+1] && tokens[pos+1].type==='OP' && tokens[pos+1].value==='='){
      var name = next().value; next();
      var expr = parseTernary();
      return {type:'Assign', name:name, expr:expr};
    }
    return parseTernary();
  }
  function parseTernary(){
    var cond = parseOr();
    if(peek() && peek().type==='OP' && peek().value==='?'){
      next(); var a = parseTernary(); expectOp(':'); var b = parseTernary();
      return {type:'Ternary', cond:cond, a:a, b:b};
    }
    return cond;
  }
  function parseOr(){ var left=parseAnd(); while(peek()&&peek().type==='OP'&&peek().value==='||'){ next(); var r=parseAnd(); left={type:'Bin',op:'||',left:left,right:r}; } return left; }
  function parseAnd(){ var left=parseEquality(); while(peek()&&peek().type==='OP'&&peek().value==='&&'){ next(); var r=parseEquality(); left={type:'Bin',op:'&&',left:left,right:r}; } return left; }
  function parseEquality(){ var left=parseComparison(); while(peek()&&peek().type==='OP'&&(peek().value==='=='||peek().value==='!=')){ var op=next().value; var r=parseComparison(); left={type:'Bin',op:op,left:left,right:r}; } return left; }

    if(t.type==='ID'){
      next();
      if(peek() && peek().type==='OP' && peek().value==='('){
        next();
        var args = [];
        if(!(peek() && peek().type==='OP' && peek().value===')')){
          args.push(parseTernary());
          while(peek() && peek().type==='OP' && peek().value===','){ next(); args.push(parseTernary()); }
        }
        expectOp(')');
        if(t.value === 'se'){
          if(args.length !== 3) throw new Error("se(...) precisa de 3 argumentos: condição, se-verdadeiro, se-falso");
          return {type:'Ternary', cond:args[0], a:args[1], b:args[2]};
        }
        return {type:'Call', name:t.value, args:args};
      }
      return {type:'Var', name:t.value};
    }
    throw new Error("Token inesperado");
  }
  var ast = parseAssignment();
  if(pos < tokens.length) throw new Error("Caracteres inesperados no final da expressão");
  return ast;
}

function toNumOrThrow(v){ if(Array.isArray(v)) throw new Error("Era esperado um número, mas veio uma lista"); return v; }
function flattenArgs(args){
  if(args.length===1 && Array.isArray(args[0])) return args[0].slice();
  return args.map(function(a){ if(Array.isArray(a)) throw new Error("Lista não suportada aqui"); return a; });
}
var ENGINE_FUNCTIONS = {
  min: function(){ var xs=flattenArgs(Array.prototype.slice.call(arguments)); return Math.min.apply(null, xs); },
  max: function(){ var xs=flattenArgs(Array.prototype.slice.call(arguments)); return Math.max.apply(null, xs); },
  abs: function(a){ return Math.abs(a); },
  round: function(a, casas){ var m = Math.pow(10, casas||0); return Math.round(a*m)/m; },
  sum: function(){ var xs=flattenArgs(Array.prototype.slice.call(arguments)); return xs.reduce(function(s,x){return s+x;},0); },
  media: function(){ var xs=flattenArgs(Array.prototype.slice.call(arguments)); return xs.length? xs.reduce(function(s,x){return s+x;},0)/xs.length : 0; }
};

function evalNode(node, scope){
  switch(node.type){
    case 'Num': return node.value;
    case 'Var':
      if(!(node.name in scope)) throw new Error("Variável não definida: '"+node.name+"'");
      return scope[node.name];
    case 'Unary':{
      var v = evalNode(node.arg, scope);
      if(node.op==='-') return -toNumOrThrow(v);
      if(node.op==='!') return v ? 0 : 1;
      throw new Error("Operador desconhecido: "+node.op);
    }
    case 'Bin':{
      var l = evalNode(node.left, scope), r = evalNode(node.right, scope);
      switch(node.op){
        case '+': return toNumOrThrow(l)+toNumOrThrow(r);
        case '-': return toNumOrThrow(l)-toNumOrThrow(r);
        case '*': return toNumOrThrow(l)*toNumOrThrow(r);
        case '/': if(toNumOrThrow(r)===0) throw new Error("Divisão por zero"); return l/r;
        case '%': return l % r;
        case '^': return Math.pow(l,r);
        case '>': return (l>r)?1:0;
        case '>=': return (l>=r)?1:0;
        case '<': return (l<r)?1:0;
        case '<=': return (l<=r)?1:0;
        case '==': return (l===r)?1:0;
        case '!=': return (l!==r)?1:0;
        case '&&': return (l && r)?1:0;
        case '||': return (l || r)?1:0;
      }
      throw new Error("Operador desconhecido: "+node.op);
    }
    case 'Ternary':
      return evalNode(node.cond, scope) ? evalNode(node.a, scope) : evalNode(node.b, scope);
    case 'Call':{
      var fn = ENGINE_FUNCTIONS[node.name];
      if(!fn) throw new Error("Função desconhecida: '"+node.name+"'");
      var argVals = node.args.map(function(a){ return evalNode(a, scope); });
      return fn.apply(null, argVals);
    }
    case 'Assign':{
      var val = evalNode(node.expr, scope);
      scope[node.name] = val;
      return val;
    }
  }
  throw new Error("Nó de expressão desconhecido");
}

function runLine(line, scope){
  var trimmed = (line||'').trim();
  if(!trimmed) return null;
  var tokens = tokenize(trimmed);
  var ast = parseExprTokens(tokens);
  return evalNode(ast, scope);
}

/* Roda um perfil inteiro (fórmulas + itens, se houver) a partir de valores de entrada. */
function avaliarPerfil(profile, valoresEntrada, itensInput){
  var scope = Object.assign({}, valoresEntrada);
  try{
    if(!profile.possuiItensMultiplos){
      linhasExecutaveis(profile.formulas).forEach(function(line, idx){
        try{ runLine(line, scope); }
        catch(e){ throw {linha: idx+1, texto: line, mensagem: e.message, secao:'formulas'}; }
      });
      return { ok:true, scope: scope, itensResultado: null };
    } else {
      linhasExecutaveis(profile.formulasCompartilhadas).forEach(function(line, idx){
        try{ runLine(line, scope); }
        catch(e){ throw {linha: idx+1, texto: line, mensagem: e.message, secao:'compartilhadas'}; }
      });
      var itemFormulasEfetivas = (profile.itemFormulas && profile.itemFormulas.length) ? profile.itemFormulas : (profile.itemFormula ? [profile.itemFormula] : []);
      var linhasItem = linhasExecutaveis(itemFormulasEfetivas);
      var itemKey = linhasItem.length ? parseAssignKey(linhasItem[linhasItem.length-1]) : null;
      var itensResultado = (itensInput||[]).map(function(itemVals, i){
        var itemScope = Object.assign({}, scope, itemVals);
        linhasItem.forEach(function(line, idx){
          try{ runLine(line, itemScope); }
          catch(e){ throw {linha: idx+1, texto: line, mensagem: e.message, secao:'item', itemIndex:i}; }
        });
        return itemScope;
      });
      var chavesItem = (profile.itemVariaveis||[]).map(function(v){ return v.chave; });
      linhasItem.forEach(function(line){ var k = parseAssignKey(line); if(k && chavesItem.indexOf(k)===-1) chavesItem.push(k); });
      chavesItem.forEach(function(k){
        scope['itens_'+k] = itensResultado.map(function(r){ return r[k]; });
      });
      linhasExecutaveis(profile.formulasFinais).forEach(function(line, idx){
        try{ runLine(line, scope); }
        catch(e){ throw {linha: idx+1, texto: line, mensagem: e.message, secao:'finais'}; }
      });
      return { ok:true, scope: scope, itensResultado: itensResultado, chaveItemValor: itemKey };
    }
  }catch(erro){
    return { ok:false, erro: erro };
  }
}
function mensagemErroAvaliacao(erro){
  var secaoLabel = { formulas:'Fórmulas', compartilhadas:'Fórmulas compartilhadas', item:'Fórmula do item', finais:'Fórmulas finais' }[erro.secao] || 'Fórmula';
  var onde = erro.secao === 'item' ? (secaoLabel) : (secaoLabel + ', linha ' + erro.linha);
  return onde + ' — "' + erro.texto + '": ' + erro.mensagem;
}

/* Mantém a MESMA interface de antes (storageGet/storageSet operando em "chaves" com um
   JSON como valor) para que todo o resto do app continue funcionando sem alterações —
   só a implementação por trás troca de localStorage para uma tabela do Supabase,
   uma linha por usuário, protegida por Row Level Security. */
async function storageGet(key){
  var table = TABLE_FOR_KEY[key];
  if(!table || !supabaseClient || !currentUser) return null;
  try{
    var resp = await supabaseClient.from(table).select('data').eq('user_id', currentUser.id).maybeSingle();
    if(resp.error){ console.error(resp.error); return null; }
    return resp.data ? JSON.stringify(resp.data.data) : null;
  }catch(e){ console.error(e); return null; }
}
async function storageSet(key, value){
  var table = TABLE_FOR_KEY[key];
  if(!table || !supabaseClient || !currentUser) return false;
  try{
    var parsed = JSON.parse(value);
    var resp = await supabaseClient.from(table).upsert(
      { user_id: currentUser.id, data: parsed, updated_at: new Date().toISOString() },
      { onConflict: 'user_id' }
    );
    if(resp.error){ console.error(resp.error); return false; }
    return true;
  }catch(e){ console.error(e); return false; }
}

    state.profiles = presetsPadrao();
    await saveProfiles();
  } else {
    /* Corrige automaticamente os modelos padrão (GD1/GD2) desatualizados a cada login,
       sem depender do usuário clicar em "Atualizar modelos padrão". Só mostra aviso se
       algo realmente mudou, pra não incomodar em todo login sem necessidade. */
    await sincronizarModelosPadrao(true);
  }
  if(state.clients.length === 0){
    state.clients = seedClients(state.profiles);
    await saveClients();
  }
  if(state.clients.length){ state.selectedClientId = state.clients[0].id; }
}

/* ============================================================
   HELPERS DE DOMÍNIO
   ============================================================ */
function getProfile(id){ return state.profiles.find(function(p){ return p.id === id; }) || null; }
function selectedClient(){ return state.clients.find(function(c){ return c.id === state.selectedClientId; }) || null; }

function camposDisponiveisPerfil(profile){
  /* retorna lista de {chave, rotulo, formato, editavel} disponíveis para o checklist de "visível ao cliente",
     excluindo a chave do total final (mostrada sempre, à parte). Campos vindos de "variaveis" já têm rótulo
     próprio (editavel:false); campos calculados pelas fórmulas usam rotulosCampos/formatosCampos do perfil
     como personalização, caindo para a própria chave / 'moeda' como padrão (editavel:true). */
  var lista = [];
  (profile.variaveis||[]).forEach(function(v){ lista.push({chave:v.chave, rotulo:v.rotulo, formato:v.formato, editavel:false}); });
  var linhasFormula = profile.possuiItensMultiplos
    ? linhasExecutaveis(profile.formulasCompartilhadas).concat(linhasExecutaveis(profile.formulasFinais))
    : linhasExecutaveis(profile.formulas);
  var rotulosCampos = profile.rotulosCampos || {};
  var formatosCampos = profile.formatosCampos || {};
  linhasFormula.forEach(function(line){
    var k = parseAssignKey(line);
    if(k) lista.push({chave:k, rotulo: rotulosCampos[k] || k, formato: formatosCampos[k] || 'moeda', editavel:true});
  });
  return lista.filter(function(c){ return c.chave !== profile.chaveTotalFinal; });
}
function rotuloCampo(profile, chave){ return (profile.rotulosCampos && profile.rotulosCampos[chave]) || chave; }
function formatoCampo(profile, chave){ return (profile.formatosCampos && profile.formatosCampos[chave]) || 'moeda'; }

function sunIconSvg(size){
  /* Aceita um número (px fixo, comportamento antigo) ou uma string CSS pronta
     (ex.: 'clamp(48px,9vw,68px)') para permitir tamanhos responsivos que
     crescem em telas largas sem nunca ficar menores que o mínimo definido. */
  var altura = (typeof size === 'number') ? (size + 'px') : size;
  return '<img src="' + LOGO_SITE_BASE64 + '" alt="IG Base" style="height:' + altura + ';width:auto;max-width:100%;display:block">';
}
/* Ícone (imagem, pixel-idêntica à logo original) + nome "IG Base" como texto de
   verdade ao lado/abaixo — assim o texto fica nítido em qualquer tamanho, sem
   depender de raster embutido na imagem. iconHeight aceita número ou clamp(). */
function logoBlockHtml(iconHeight, textSize, align){
  align = align || 'center';
  return '<div style="display:flex;flex-direction:column;align-items:' + align + ';gap:4px">' +
    sunIconSvg(iconHeight) +
    '<span style="font-weight:800;color:#424242;font-family:Arial,Helvetica,sans-serif;font-size:' + textSize + ';letter-spacing:0.5px;white-space:nowrap">IG BASE</span>' +
  '</div>';
}

function renderSidebar(){
  var el = document.getElementById('sidebar');
  var rows = state.clients.map(function(c){
    var active = c.id === state.selectedClientId ? ' active' : '';
    var profile = getProfile(c.profileId);
    var dotColor = (profile && profile.possuiItensMultiplos) ? 'var(--dot-multi)' : 'var(--dot-single)';
    return '<div class="client-row' + active + '" data-action="select-client" data-id="' + c.id + '">' +
      '<span class="client-dot" style="background:' + dotColor + '"></span>' +
      '<span class="meta"><span class="nome">' + escapeHtml(c.nome) + '</span>' +
      '<span class="uc">' + (c.uc ? 'UC ' + escapeHtml(c.uc) : 'sem UC') + '</span></span>' +
      '<button class="edit-btn" data-action="edit-client" data-id="' + c.id + '" title="Editar cliente" aria-label="Editar cliente">' +
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>' +

      logoBlockHtml('clamp(40px,7vw,56px)', 'clamp(11px,2.2vw,14px)', 'flex-start') +

function renderTopbar(){
  var el = document.getElementById('topbar');
  var c = selectedClient();
  if(!c){
    el.innerHTML = '<div><h1>Nenhum cliente selecionado</h1><div class="sub">Cadastre um cliente para começar a gerar orçamentos.</div></div>';
    return;
  }
  var profile = getProfile(c.profileId);
  var profileNome = profile ? profile.nome : '(perfil não encontrado — edite o cliente)';
  el.innerHTML = '<div><h1>' + escapeHtml(c.nome) + '</h1>' +
    '<div class="sub">' + (c.uc ? 'UC ' + escapeHtml(c.uc) + ' · ' : '') + 'Perfil: ' + escapeHtml(profileNome) + '</div></div>' +
    '<button class="btn btn-ghost" data-action="edit-client" data-id="' + c.id + '">Editar dados do cliente</button>';
}

function renderTabs(){
  var el = document.getElementById('tabs');
  var hasClient = !!selectedClient();
  var tabs = [ ['novo','Novo orçamento', !hasClient], ['historico','Histórico', !hasClient], ['perfis','Perfis de Faturamento', false] ];
  el.innerHTML = tabs.map(function(t){
    var disabled = t[2] ? ' disabled' : '';
    var active = state.activeTab === t[0] ? ' active' : '';
    return '<button class="tab-btn' + active + '" data-action="set-tab" data-tab="' + t[0] + '"' + disabled + '>' + t[1] + '</button>';
  }).join('');
}
function setTab(tab){ state.activeTab = tab; renderTabs(); renderTabContent(); }
function selectClient(id){ state.selectedClientId = id; state.activeTab = 'novo'; state.lastDraft = null; renderAll(); }

function itemInputRowHtml(profile, nome, uc, valores){
  var rid = uid();
  var fieldsHtml = (profile.itemVariaveis||[]).map(function(v){
    if(v.tipo === 'checkbox'){
      var checked = (valores && valores[v.chave]!==undefined) ? !!valores[v.chave] : !!v.valorPadrao;
      return '<div class="field field-checkbox"><label class="checkbox-field"><input type="checkbox" class="item-val item-val-checkbox" data-chave="'+v.chave+'"'+(checked?' checked':'')+'> '+escapeHtml(v.rotulo)+'</label></div>';
    }
    var val = (valores && valores[v.chave]!==undefined) ? fmtNum(valores[v.chave]) : '';
    if(v.calculado){
      return '<div class="field field-calculado"><label>'+escapeHtml(v.rotulo)+' <span class="hint">(calculado)</span></label><input type="text" inputmode="decimal" class="item-val" data-chave="'+v.chave+'" value="'+val+'" placeholder="calculado ao clicar em Calcular" readonly title="Calculado automaticamente pelo sistema"></div>';
    }
    return '<div class="field"><label>'+escapeHtml(v.rotulo)+'</label><input type="text" inputmode="decimal" class="item-val" data-chave="'+v.chave+'" value="'+val+'" placeholder="0,00"></div>';
  }).join('');
  return '<div class="ponto-row" data-ponto-id="'+rid+'">' +
    '<div class="field f-nome"><label>Ponto</label><input type="text" class="item-nome" value="'+escapeHtml(nome||'')+'" placeholder="Ex.: Casa"></div>' +
    '<div class="field f-nome"><label>UC (unidade consumidora)</label><input type="text" class="item-uc" value="'+escapeHtml(uc||'')+'" placeholder="Ex.: 12345678"></div>' +
    fieldsHtml +
    '<button type="button" class="rm-btn" data-action="remove-ponto" data-id="'+rid+'" title="Remover ponto">✕</button>' +
  '</div>';
}
function addPontoRow(){
  var wrap = document.getElementById('pontos-container');
  var c = selectedClient(); var profile = getProfile(c.profileId);
  if(!wrap || !profile) return;
  wrap.insertAdjacentHTML('beforeend', itemInputRowHtml(profile, '', '', null));
}
function removePontoRow(id){
  var wrap = document.getElementById('pontos-container');
  if(!wrap) return;
  var rows = wrap.querySelectorAll('.ponto-row');
  if(rows.length <= 1){ toast('É preciso manter ao menos um ponto de consumo.'); return; }
  var row = wrap.querySelector('.ponto-row[data-ponto-id="' + id + '"]');
  if(row) row.remove();
}

function pontosPadraoDoCliente(client){
  if(client.pontosPadrao && client.pontosPadrao.length) return client.pontosPadrao;
  if(client.itensNomes && client.itensNomes.length){
    return client.itensNomes.map(function(n){ return { nome: n, uc: '' }; });
  }
  return [{ nome: 'Ponto 1', uc: '' }];
}
function fixosEfetivos(client, profile){
  var out = {};
  (profile.variaveis||[]).filter(function(v){ return v.categoria === 'fixo'; }).forEach(function(v){
    var override = client.overridesFixos ? client.overridesFixos[v.chave] : undefined;
    out[v.chave] = (override !== undefined && override !== null) ? override : v.valorPadrao;
  });
  return out;
}

function renderNovoOrcamento(){
  var container = document.getElementById('tab-content');
  var c = selectedClient();
  if(!c){
    container.innerHTML = '<div class="empty-state"><p>Você ainda não tem nenhum cliente cadastrado.</p><button class="btn btn-primary" data-action="new-client">Cadastrar primeiro cliente</button></div>';
    return;
  }
  var profile = getProfile(c.profileId);
  if(!profile){
    container.innerHTML = '<div class="empty-state"><p>O perfil de faturamento vinculado a este cliente não existe mais.</p><button class="btn btn-primary" data-action="edit-client" data-id="'+c.id+'">Escolher outro perfil</button></div>';
    return;
  }

  var fixos = fixosEfetivos(c, profile);
  var fixosHtml = Object.keys(fixos).map(function(chave){
    var def = profile.variaveis.find(function(v){ return v.chave === chave; });
    return '<div class="breakdown-row"><span class="lbl">' + escapeHtml(def.rotulo) + '</span><span class="val tabular">' + formatarValor(fixos[chave], def.formato) + '</span></div>';
  }).join('');

  var mensalVars = (profile.variaveis||[]).filter(function(v){ return v.categoria === 'mensal'; });
  var camposComuns =
    '<fieldset><legend>Referência</legend>' +
      '<div class="field-row">' +
        refFieldsHtml(refPadrao()) +
        '<div class="field"><label>Ajuste do mês (R$)</label><input type="text" inputmode="decimal" id="f-ajuste" value="" placeholder="0,00"><span class="hint">Reduz o valor final. Use negativo para acrescentar.</span></div>' +
      '</div>' +
    '</fieldset>' +
    '<details class="panel" style="cursor:pointer"><summary style="font-weight:600;cursor:pointer">Valores fixos aplicados a este cliente (definidos no perfil, editáveis em "Editar cliente")</summary>' +
      '<div style="margin-top:10px">' + (fixosHtml || '<span style="color:var(--ink-soft);font-size:13px">Este perfil não possui variáveis fixas.</span>') + '</div>' +
    '</details>';

  var camposAdendo =
    '<fieldset><legend>Observações / Adendo (entra no documento do cliente)</legend>' +
      '<div class="field"><textarea id="f-observacoes" placeholder="Ex.: aviso de manutenção, ajuste pontual, condição do mês..."></textarea></div>' +
    '</fieldset>';

  var mensalFieldHtml = function(v){
    if(v.tipo === 'checkbox'){
      return '<div class="field field-checkbox"><label class="checkbox-field"><input type="checkbox" class="in-mensal in-mensal-checkbox" data-chave="' + v.chave + '"' + (v.valorPadrao?' checked':'') + '> ' + escapeHtml(v.rotulo) + '</label></div>';
    }
    return '<div class="field"><label>' + escapeHtml(v.rotulo) + '</label><input type="text" inputmode="decimal" class="in-mensal" data-chave="' + v.chave + '" value="" placeholder="0,00"></div>';
  };

  var formHtml;
  if(!profile.possuiItensMultiplos){
    var camposMensaisHtml = mensalVars.map(mensalFieldHtml).join('');
    formHtml = camposComuns +
      '<fieldset><legend>Dados do mês</legend>' +
        '<p class="hint" style="margin:-4px 0 12px">Dica: em qualquer campo, pode digitar uma soma direto, ex.: <code class="mono">45,20+12,30+8</code></p>' +
        camposMensaisHtml + '</fieldset>' +
      camposAdendo;
  } else {
    var pontosSeed = pontosPadraoDoCliente(c);
    var pontosHtml = pontosSeed.map(function(p){ return itemInputRowHtml(profile, p.nome, p.uc, null); }).join('');
    var camposCompartilhadosHtml = mensalVars.map(mensalFieldHtml).join('');
    formHtml = camposComuns +
      (camposCompartilhadosHtml ? '<fieldset><legend>Dados compartilhados do mês</legend>' +
        '<p class="hint" style="margin:-4px 0 12px">Dica: em qualquer campo, pode digitar uma soma direto, ex.: <code class="mono">45,20+12,30+8</code></p>' +
        camposCompartilhadosHtml + '</fieldset>' : '') +
      '<fieldset><legend>Pontos de consumo</legend>' +
        '<div id="pontos-container">' + pontosHtml + '</div>' +
        '<button type="button" class="add-ponto-btn" data-action="add-ponto">+ Adicionar ponto</button>' +
      '</fieldset>' +
      camposAdendo;
  }

  container.innerHTML =
    '<div class="quote-grid">' +
      '<div class="quote-form-col">' + formHtml +
        '<div class="btn-row"><button class="btn btn-primary" data-action="calcular">Calcular orçamento</button></div>' +
      '</div>' +
      '<div class="quote-preview-col" id="preview-col">' +
        '<div class="panel" style="text-align:center;color:var(--ink-soft)">Preencha os dados e clique em <b>Calcular orçamento</b> para ver o resumo e o texto para o cliente.</div>' +
      '</div>' +
    '</div>';

  restaurarRascunhoSeExistir(c, profile);
}

function readMensaisFromForm(){
  var out = {};
  document.querySelectorAll('.in-mensal').forEach(function(inp){
    out[inp.dataset.chave] = (inp.type === 'checkbox') ? (inp.checked ? 1 : 0) : parseNumBR(inp.value);
  });
  return out;
}
function readItemRows(){
  var rows = document.querySelectorAll('#pontos-container .ponto-row');
  var itens = [];
  rows.forEach(function(row){
    var nome = row.querySelector('.item-nome').value.trim() || 'Ponto';
    var ucEl = row.querySelector('.item-uc');
    var uc = ucEl ? ucEl.value.trim() : '';
    var valores = {};
    row.querySelectorAll('.item-val').forEach(function(inp){
      valores[inp.dataset.chave] = (inp.type === 'checkbox') ? (inp.checked ? 1 : 0) : parseNumBR(inp.value);
    });
    itens.push(Object.assign({nome: nome, uc: uc}, valores));
  });
  return itens;
}

/* ============================================================
   RASCUNHO AUTOMÁTICO (recuperação se a página recarregar antes de salvar)
   ============================================================
   Guardado no localStorage do navegador (não no Supabase — é só uma rede de
   segurança local, temporária, até o usuário clicar em "Salvar no histórico"). */
function chaveRascunho(clientId){ return 'usinas:rascunho:' + clientId; }

function lerFormularioBruto(){
  var ajusteEl = document.getElementById('f-ajuste');
  var out = {
    referencia: getReferenciaAtual(),
    ajusteRaw: ajusteEl ? ajusteEl.value : '',
    observacoes: txt('f-observacoes'),
    mensais: {}, itens: null
  };
  document.querySelectorAll('.in-mensal').forEach(function(inp){
    out.mensais[inp.dataset.chave] = (inp.type === 'checkbox') ? (inp.checked ? '1' : '0') : inp.value;
  });
  var pontosContainer = document.getElementById('pontos-container');
  if(pontosContainer){
    out.itens = [];
    pontosContainer.querySelectorAll('.ponto-row').forEach(function(row){
      var ucEl = row.querySelector('.item-uc');
      var item = { nome: row.querySelector('.item-nome').value, uc: ucEl ? ucEl.value : '' };
      row.querySelectorAll('.item-val').forEach(function(inp){
        item[inp.dataset.chave] = (inp.type === 'checkbox') ? (inp.checked ? '1' : '0') : inp.value;
      });
      out.itens.push(item);
    });
  }
  return out;
}
function salvarRascunhoAtual(){
  if(state.activeTab !== 'novo') return;
  var c = selectedClient();
  if(!c) return;
  try{ window.localStorage.setItem(chaveRascunho(c.id), JSON.stringify(lerFormularioBruto())); }
  catch(e){}
}
function lerRascunho(clientId){
  try{
    var raw = window.localStorage.getItem(chaveRascunho(clientId));
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function limparRascunho(clientId){
  try{ window.localStorage.removeItem(chaveRascunho(clientId)); }catch(e){}
}
function restaurarRascunhoSeExistir(client, profile){
  var rascunho = lerRascunho(client.id);
  if(!rascunho) return;
  setReferenciaAtual(rascunho.referencia || refPadrao());
  var ajusteEl = document.getElementById('f-ajuste');
  if(ajusteEl) ajusteEl.value = rascunho.ajusteRaw || '';
  setIf('f-observacoes', rascunho.observacoes || '');
  Object.keys(rascunho.mensais || {}).forEach(function(chave){
    var el = document.querySelector('.in-mensal[data-chave="' + chave + '"]');
    if(!el) return;
    if(el.type === 'checkbox') el.checked = !!parseNumBR(rascunho.mensais[chave]);
    else el.value = rascunho.mensais[chave];
  });
  if(profile.possuiItensMultiplos && rascunho.itens && rascunho.itens.length){
    var wrap = document.getElementById('pontos-container');
    if(wrap){
      wrap.innerHTML = rascunho.itens.map(function(it){
        var valores = {};
        Object.keys(it).forEach(function(k){ if(k !== 'nome' && k !== 'uc') valores[k] = parseNumBR(it[k]); });
        return itemInputRowHtml(profile, it.nome, it.uc, valores);
      }).join('');
    }
  }
  toast('Recuperamos os dados do seu último lançamento não salvo para este cliente.');
  onCalcular();
}

/* Para perfis com "distribuicaoAutomaticaPontos" ligado: NENHUM ponto tem consumo ou
   Fio B digitado diretamente — os dois são sempre calculados a partir dos campos da
   conta (iguais aos que já vinham da planilha). Só existe UM ponto "principal" por vez
   (marcado com o checkbox pontoPrincipal); os demais são sempre os "que sobram":
     consumo do principal   = energiaAtiva + (consumoTotal - injecaoNaConta)
     fio B do principal     = fioB (o valor da conta, sem cálculo — é o mesmo ponto da fatura)
     taxa de fio B por kWh  = fioB / energiaAtiva
     consumo de cada outro  = (injecaoTotal - consumo do principal) / nº de pontos não-principais
     fio B de cada outro    = seu consumo * taxa de fio B por kWh
   Isso assume 100% da energia sendo repartida só entre os pontos cadastrados. */
function aplicarDistribuicaoAutomatica(profile, itens, valoresEntrada){
  var vazio = { itens: itens, excedenteKwh: 0 };
  if(!profile.distribuicaoAutomaticaPontos || !itens || itens.length < 1) return vazio;
  var chaveConsumo = 'consumoKwh';
  var chaveFioB = profile.chaveItemFioB;
  if(!chaveFioB) return vazio;

  var indicesPrincipais = [];
  itens.forEach(function(it, i){ if(it.pontoPrincipal) indicesPrincipais.push(i); });
  if(indicesPrincipais.length === 0){
    indicesPrincipais = [0];
    toast('Nenhum ponto marcado como "principal" — usando "' + (itens[0].nome||'Ponto 1') + '" como referência para o cálculo automático.');
  } else if(indicesPrincipais.length > 1){
    indicesPrincipais = [indicesPrincipais[0]];
    toast('Só pode haver um ponto principal — usando "' + (itens[indicesPrincipais[0]].nome||'Ponto 1') + '" e ignorando as outras marcações.');
  }
  var iPrincipal = indicesPrincipais[0];

  var energiaAtiva = valoresEntrada.energiaAtiva || 0;
  var consumoTotal = valoresEntrada.consumoTotal || 0;
  var injecaoNaConta = valoresEntrada.injecaoNaConta || 0;
  var fioBConta = valoresEntrada.fioB || 0;
  var injecaoSolar = valoresEntrada.injecaoTotal || 0;

  var autoConsumo = consumoTotal - injecaoNaConta;
  var consumoPrincipal = energiaAtiva + autoConsumo;

  /* Um ponto de consumo NUNCA pode ter injeção negativa — não existe fisicamente
     "mandar energia negativa" pra um ponto. Quando o consumo do principal (naquele
     ciclo de fatura) é maior que a injeção total do mês, a diferença vem do SALDO
     acumulado da conta (crédito bancado em meses anteriores). Por padrão, isso é
     tratado como energia nova sendo vendida agora — cobra-se o valor cheio do
     principal, sem desconto nenhum (é a prática normal: "mandei 1.100, ele consumiu
     mais 100 do saldo, cobro 1.200"). SÓ quando esse saldo específico já foi cobrado
     do cliente em meses anteriores (checkbox marcado — ex.: caso do Aurélio) é que
     NÃO se cobra de novo: aí a diferença vira um AJUSTE PRÓPRIO que reduz o total,
     nunca disfarçado de "valor negativo" de um ponto — os pontos secundários ficam
     sempre zerados, nunca negativos, independente da opção marcada. */
  var restante = injecaoSolar - consumoPrincipal;
  var saldoJaCobrado = !!valoresEntrada.saldoCobreNegativo;
  var excedenteKwh = 0;
  if(restante < 0){
    excedenteKwh = saldoJaCobrado ? (-restante) : 0;
    if(saldoJaCobrado){
      toast('O consumo do principal ficou maior que a injeção do mês — como esse saldo já foi cobrado do cliente antes, o valor equivalente (' + fmtNum(-restante) + ' kWh) entrou como ajuste, reduzindo o total. Os pontos secundários ficaram zerados.');
    } else {
      toast('O consumo do ponto principal (' + fmtNum(consumoPrincipal) + ' kWh) ficou maior que a injeção solar do mês (' + fmtNum(injecaoSolar) + ' kWh) — a diferença veio do saldo da conta. Por padrão isso está sendo cobrado do cliente como consumo normal (sem desconto). Se esse saldo já tiver sido cobrado dele em meses anteriores, marque a opção pra não cobrar de novo. Se não for esperado, confira "Energia ativa" e "Injeção que aparece na conta".');
    }
    restante = 0;
  }
  var indicesSecundarios = itens.map(function(it,i){ return i; }).filter(function(i){ return i !== iPrincipal; });
  var fatia = indicesSecundarios.length ? (restante / indicesSecundarios.length) : 0;

  var itensProcessados = itens.map(function(it, i){
    if(i === iPrincipal){
      it.pontoPrincipal = 1;
      it[chaveConsumo] = consumoPrincipal;
      it[chaveFioB] = fioBConta;
    } else {
      /* Fio B nunca é cobrado dos pontos secundários — só o principal paga o Fio B
         (é a conta dele que realmente tem essa cobrança da concessionária). */
      it.pontoPrincipal = 0;
      it[chaveConsumo] = fatia;
      it[chaveFioB] = 0;
    }
    return it;
  });

  return { itens: itensProcessados, excedenteKwh: excedenteKwh };
}

/* Depois de calcular, escreve de volta nos campos da tela o consumo/Fio B que o sistema
   calculou para os pontos não-principais, para o usuário ver exatamente o que foi usado
   (os campos continuam editáveis, mas serão recalculados no próximo "Calcular orçamento"). */
function refletirValoresCalculadosNoFormulario(profile, itens){
  if(!profile.distribuicaoAutomaticaPontos) return;
  var chaveConsumo = 'consumoKwh';
  var chaveFioB = profile.chaveItemFioB;
  var rows = document.querySelectorAll('#pontos-container .ponto-row');
  rows.forEach(function(row, i){
    var item = itens[i]; if(!item) return;
    var consumoInp = row.querySelector('.item-val[data-chave="'+chaveConsumo+'"]');
    if(consumoInp) consumoInp.value = fmtNum(item[chaveConsumo]);
    if(chaveFioB){
      var fioBInp = row.querySelector('.item-val[data-chave="'+chaveFioB+'"]');
      if(fioBInp) fioBInp.value = fmtNum(item[chaveFioB]);
    }
  });
}

function onCalcular(){
  var c = selectedClient(); if(!c) return;
  var profile = getProfile(c.profileId); if(!profile) return;

  var referencia = getReferenciaAtual();
  var ajuste = num('f-ajuste');
  var observacoes = txt('f-observacoes');
  var fixos = fixosEfetivos(c, profile);
  var mensais = readMensaisFromForm();
  var valoresEntrada = Object.assign({}, fixos, mensais, { ajuste: ajuste });

  var itensInputRaw = profile.possuiItensMultiplos ? readItemRows() : null;
  var excedenteKwh = 0;
  if(profile.possuiItensMultiplos && profile.distribuicaoAutomaticaPontos){
    var distrib = aplicarDistribuicaoAutomatica(profile, itensInputRaw, valoresEntrada);
    itensInputRaw = distrib.itens;
    excedenteKwh = distrib.excedenteKwh;
    refletirValoresCalculadosNoFormulario(profile, itensInputRaw);
  }

  var resultado = avaliarPerfil(profile, valoresEntrada, itensInputRaw);
  if(!resultado.ok){
    toast('Erro na fórmula do perfil — ' + mensagemErroAvaliacao(resultado.erro));
    return;
  }

  /* Quando o consumo do ponto principal excede a injeção do mês e isso NÃO foi
     coberto pelo saldo, a diferença vira seu próprio ajuste explícito no total —
     nunca um valor negativo disfarçado de "ponto de consumo" (não existe fisicamente
     enviar energia negativa pra um ponto). */
  var ajusteExcedenteRS = 0;
  if(excedenteKwh > 0.004 && resultado.scope.precoComDesconto !== undefined){
    ajusteExcedenteRS = excedenteKwh * resultado.scope.precoComDesconto;
    resultado.scope.ajusteConsumoExcedente = ajusteExcedenteRS;
    resultado.scope[profile.chaveTotalFinal] = (resultado.scope[profile.chaveTotalFinal] || 0) - ajusteExcedenteRS;
  }

  /* "Quem paga a fatura" é uma configuração do CLIENTE, não do perfil. O Fio B só existe
     em perfis GD2 e a fórmula do perfil sempre o desconta do valor da locação por padrão
     — isso está certo quando o CLIENTE paga a fatura direto pra concessionária (ele já
     paga o Fio B por lá). Quando é a locadora que paga a fatura, é o oposto: é ela quem
     arca com o Fio B, então ninguém desconta o Fio B do valor da locação (senão o
     cliente pagaria o Fio B duas vezes — uma pelo desconto que não teve, outra pelo
     repasse). Por isso, nesse caso, desfazemos o desconto de Fio B e o repasse da fatura
     exclui a parte do Fio B (só repassamos "as partes de fora": iluminação, adicionais
     etc. — o Fio B "fica" com a locadora, que é quem vai pagar a concessionária com ele). */
  var repasseFatura = 0;
  var ocultarFioBPorPonto = false;
  var chaveFatura = (resultado.scope.valorFaturaInfo !== undefined) ? 'valorFaturaInfo'
                   : (resultado.scope.valorFaturaImpresso !== undefined) ? 'valorFaturaImpresso' : null;
  if(c.locadorPagaFatura && chaveFatura){
    var valorFatura = resultado.scope[chaveFatura] || 0;
    var fioBTotal = profile.possuiItensMultiplos ? (resultado.scope.fioBAlocadoTotal || 0) : (resultado.scope.fioB || 0);
    if(fioBTotal > 0.004){
      if(profile.possuiItensMultiplos && resultado.itensResultado && profile.chaveItemFioB){
        resultado.itensResultado.forEach(function(item){
          item[resultado.chaveItemValor] = (item[resultado.chaveItemValor]||0) + (item[profile.chaveItemFioB]||0);
        });
        resultado.scope.liquidoTotal = resultado.itensResultado.reduce(function(s,it){ return s + (it[resultado.chaveItemValor]||0); }, 0);
        resultado.scope.valorComSolar = resultado.scope.liquidoTotal;
        ocultarFioBPorPonto = true;
      } else if(resultado.scope.injecaoComDescontoRS !== undefined){
        resultado.scope.injecaoComDescontoRS += fioBTotal;
        resultado.scope.valorComSolar = resultado.scope.injecaoComDescontoRS;
      }
      resultado.scope[profile.chaveTotalFinal] = resultado.scope.valorComSolar - ajuste;
      repasseFatura = Math.max(0, valorFatura - fioBTotal);
    } else {
      repasseFatura = valorFatura;
    }
    resultado.scope[profile.chaveTotalFinal] = (resultado.scope[profile.chaveTotalFinal] || 0) + repasseFatura;
  }

  var camposVisiveis = (c.camposVisiveisPadrao && c.camposVisiveisPadrao.length) ? c.camposVisiveisPadrao.slice()
                      : (profile.camposVisiveisCliente ? profile.camposVisiveisCliente.slice() : []);

  state.lastDraft = {
    clientId: c.id, profileId: profile.id, referencia: referencia,
    valoresEntrada: Object.assign({}, mensais), ajuste: ajuste, observacoes: observacoes,
    itens: itensInputRaw,
    camposVisiveisEscolhidos: camposVisiveis,
    ocultarFioBPorPonto: ocultarFioBPorPonto,
    scope: resultado.scope, itensResultado: resultado.itensResultado, chaveItemValor: resultado.chaveItemValor,
    repasseFatura: repasseFatura,
    ajusteExcedenteRS: ajusteExcedenteRS
  };
  renderPreview();
}

/* ============================================================
   HTML DO DOCUMENTO DO CLIENTE — usado para gerar Word e PNG
   (o PDF do cliente é desenhado à parte, direto em jsPDF, mais abaixo)
   ============================================================ */
function construirHtmlFatura(client, profile, draft, dc, qrDataUrl){
  var scope = draft.scope;
  var rgbArr = hexToRgb(dc.corPrimaria);
  var cor = 'rgb(' + rgbArr[0] + ',' + rgbArr[1] + ',' + rgbArr[2] + ')';
  var linhaTd1 = 'padding:7px 0;color:#5c6f63;font-size:13px;';
  var linhaTd2 = 'padding:7px 0;text-align:right;font-weight:bold;color:#16241d;font-size:13px;';
  var linhaSep = '<tr><td colspan="2" style="border-bottom:1px solid #e0e4e0;font-size:1px;line-height:1px;">&nbsp;</td></tr>';

  var linhasHtml = '';
  camposDisponiveisPerfil(profile).forEach(function(campo){
    if(draft.camposVisiveisEscolhidos.indexOf(campo.chave) === -1) return;
    linhasHtml += '<tr><td style="'+linhaTd1+'">' + escapeHtml(campo.rotulo) + '</td><td style="'+linhaTd2+'">' + escapeHtml(formatarValor(scope[campo.chave], campo.formato)) + '</td></tr>' + linhaSep;
  });

  if(profile.possuiItensMultiplos && draft.itensResultado){
    var prefixo = profile.rotuloItemPrefixo || 'Injeção em ';
    var prefixoFioB = profile.rotuloItemFioBPrefixo || 'Fio B em ';
    draft.itensResultado.forEach(function(item){
      var nomeComUc = item.nome + (item.uc ? ' (UC ' + item.uc + ')' : '');
      linhasHtml += '<tr><td style="'+linhaTd1+'">' + escapeHtml(prefixo + nomeComUc) + '</td><td style="'+linhaTd2+'">' + escapeHtml(fmtBRL(item[draft.chaveItemValor])) + '</td></tr>' + linhaSep;
      if(!draft.ocultarFioBPorPonto && profile.chaveItemFioB && item[profile.chaveItemFioB] !== undefined){

/* ============================================================
   PIX — payload BR Code (padrão EMV/Banco Central) + QR Code visual
   ============================================================ */
function bytesUtf8Pix(str){
  return new TextEncoder().encode(str).length;
}
function tlvPix(id, value){
  var len = String(bytesUtf8Pix(value));
  while(len.length < 2) len = '0' + len;
  return id + len + value;
}
function crc16Pix(str){
  var crc = 0xFFFF;
  for(var i=0;i<str.length;i++){
    crc ^= (str.charCodeAt(i) << 8);
    for(var j=0;j<8;j++){
      crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF;
    }
  }
  var hex = crc.toString(16).toUpperCase();
  while(hex.length < 4) hex = '0' + hex;
  return hex;
}
/* Remove acentos e troca por espaço qualquer caractere que não seja letra,
   número ou espaço (mantendo as palavras separadas) — exigido pelo padrão EMV
   pros campos de texto (nome do beneficiário, cidade). */
function sanitizarTextoEmv(s, maxLen){
  var limpo = String(s||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toUpperCase()
    .replace(/[^A-Z0-9 ]/g, ' ')
    .replace(/\s+/g,' ').trim();
  return limpo.slice(0, maxLen);
}
/* Validação de CPF pelos dígitos verificadores — usada só pra desambiguar CPF
   de celular quando os dois têm 11 dígitos (ex.: CPF "12345678909" e celular
   "62999674430" têm a mesma quantidade de dígitos, mas só um passa no
   checksum oficial de CPF). */
function ehCpfValidoPix(cpf){
  if(!/^\d{11}$/.test(cpf)) return false;
  if(/^(\d)\1{10}$/.test(cpf)) return false;
  var soma = 0, resto, i;
  for(i=1;i<=9;i++) soma += parseInt(cpf.charAt(i-1),10) * (11-i);
  resto = (soma*10) % 11; if(resto===10||resto===11) resto=0;
  if(resto !== parseInt(cpf.charAt(9),10)) return false;
  soma = 0;
  for(i=1;i<=10;i++) soma += parseInt(cpf.charAt(i-1),10) * (12-i);
  resto = (soma*10) % 11; if(resto===10||resto===11) resto=0;
  if(resto !== parseInt(cpf.charAt(10),10)) return false;
  return true;
}
/* Identifica o tipo da chave Pix (telefone / CPF / CNPJ / e-mail / aleatória)
   a partir de QUALQUER formato digitado (com parênteses, traços, espaços,
   pontos, barras, com ou sem +55) e devolve ela já limpa, exatamente no
   formato que o Banco Central exige dentro do payload — sem isso, o
   Mercado Pago (validação rígida) recusa o QR mesmo que outros bancos leiam. */
function higienizarChavePix(chaveRaw){
  var bruta = String(chaveRaw||'').trim();
  if(!bruta) return '';

  if(bruta.indexOf('@') > -1) return bruta.toLowerCase().replace(/\s+/g,'');

  var evp = bruta.toLowerCase();
  if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(evp)) return evp;

  var comMais = bruta.indexOf('+') === 0;
  var digitos = bruta.replace(/\D/g,'');

  if(digitos.length === 14) return digitos;                     // CNPJ
  if(digitos.length === 11){
    if(ehCpfValidoPix(digitos)) return digitos;                 // CPF
    return '+55' + digitos;                                     // celular sem +55
  }
  if(digitos.length === 10) return '+55' + digitos;              // fixo sem +55
  if(comMais && (digitos.length === 12 || digitos.length === 13)) return '+' + digitos;
  if(!comMais && (digitos.length === 12 || digitos.length === 13) && digitos.indexOf('55') === 0) return '+' + digitos;

  return bruta; // não bateu em nenhum padrão reconhecido — devolve só com espaços das pontas já removidos
}
/* Gera o "copia e cola" do Pix (BR Code) com o valor exato do mês — o cliente
   escaneia e o valor já vem preenchido certinho, sem digitar nada. */
function gerarPayloadPix(chave, nomeBeneficiario, cidade, valor){
  var chaveLimpa = higienizarChavePix(chave);
  var nome = sanitizarTextoEmv(nomeBeneficiario || 'SOLAR ORGANIZATION', 25) || 'SOLAR ORGANIZATION';
  var cid = sanitizarTextoEmv(cidade || 'BRASIL', 15) || 'BRASIL';

  var merchantInfo = tlvPix('00','br.gov.bcb.pix') + tlvPix('01', chaveLimpa);
  var payload =
    tlvPix('00','01') +
    tlvPix('01','11') +
    tlvPix('26', merchantInfo) +
    tlvPix('52','0000') +
    tlvPix('53','986') +
    (valor > 0 ? tlvPix('54', valor.toFixed(2)) : '') +
    tlvPix('58','BR') +
    tlvPix('59', nome) +
    tlvPix('60', cid) +
    tlvPix('62', tlvPix('05','***')) +
    '6304';
  return payload + crc16Pix(payload);
}
var _qrLibLoading = null;
function carregarQrCodeLib(){
  if(window.qrcode) return Promise.resolve(true);
  if(_qrLibLoading) return _qrLibLoading;
  _qrLibLoading = new Promise(function(resolve){
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
    s.onload = function(){ resolve(!!window.qrcode); };
    s.onerror = function(){ resolve(false); };
    document.head.appendChild(s);
    setTimeout(function(){ resolve(!!window.qrcode); }, 4000);
  });
  return _qrLibLoading;
}
/* Devolve uma data URL (PNG) do QR Code do Pix pra este cliente/mês, ou null se
   o cliente não tiver ligado a opção ou faltar dado essencial (chave/beneficiário). */
async function gerarQrPixDataUrl(client, valorTotal){
  if(!client || !client.gerarQrCodePix || !client.chavePix) return null;
  var ok = await carregarQrCodeLib();
  if(!ok || !window.qrcode) return null;
  try{
    var payload = gerarPayloadPix(client.chavePix, client.beneficiario, client.cidadePix, valorTotal);
    var qr = window.qrcode(0, 'M');
    qr.addData(payload);
    qr.make();
    return qr.createDataURL(10, 10);
  }catch(e){
    console.error(e);
    return null;
  }
}

async function baixarPng(){
  var d = state.lastDraft;
  if(!d){ toast('Calcule um orçamento antes de baixar a imagem.'); return; }
  var abaPreAberta = window.open('', '_blank');
  if(abaPreAberta){
    try{ abaPreAberta.document.write('<title>Gerando imagem…</title><body style="font-family:sans-serif;padding:40px;color:#667">Gerando a imagem, aguarde…</body>'); }catch(e){}
  }
  var ok = await carregarHtml2Canvas();
  if(!ok || !window.html2canvas){
    if(abaPreAberta) abaPreAberta.close();
    toast('Não deu para carregar o gerador de imagem agora. Tente de novo em instantes.');
    return;
  }
  var client = state.clients.find(function(c){ return c.id === d.clientId; });
  var profile = getProfile(d.profileId);
  if(!client || !profile){ if(abaPreAberta) abaPreAberta.close(); return; }
  var dc = state.docConfig || docConfigPadrao();
  var qrDataUrl = await gerarQrPixDataUrl(client, d.scope[profile.chaveTotalFinal]);

  var container = document.createElement('div');
  container.style.position = 'fixed'; container.style.left = '-99999px'; container.style.top = '0';
  container.style.width = '640px'; container.style.background = '#ffffff'; container.style.padding = '32px';
  container.innerHTML = construirHtmlFatura(client, profile, d, dc, qrDataUrl);
  document.body.appendChild(container);
  try{
    var canvas = await window.html2canvas(container, { backgroundColor:'#ffffff', scale:2 });
    var blob = await new Promise(function(resolve){ canvas.toBlob(resolve, 'image/png'); });
    if(!blob){ if(abaPreAberta) abaPreAberta.close(); toast('Não deu para gerar a imagem.'); return; }
    var nomeArquivo = nomeArquivoDocumento(client, d.referencia, 'FATURA') + '.png';
    await compartilharOuBaixarBlob(blob, nomeArquivo, 'image/png', abaPreAberta);
  }catch(e){
    console.error(e);
    if(abaPreAberta) abaPreAberta.close();
    toast('Erro ao gerar a imagem.');
  }finally{
    document.body.removeChild(container);
  }
}

/* Baixa um arquivo (Blob) de forma direta. Em vez de sempre criar um link
   clicável (que em alguns navegadores móveis abre o arquivo numa aba/preview
   em vez de baixar), tenta primeiro a Web Share API com arquivos — no
   celular isso abre a folha nativa de compartilhar/salvar, sem link nenhum
   aparecendo. Se não for suportado, cai no download tradicional. */
async function compartilharOuBaixarBlob(blob, filename, mimeType, abaPreAberta){
  var podeAbrirNoNavegador = mimeType === 'application/pdf' || mimeType.indexOf('image/') === 0;
  var url = URL.createObjectURL(blob);

  if(podeAbrirNoNavegador){
    /* Em vez de abrir o blob direto (o visualizador embutido do navegador não sabe
       o nome certo do arquivo e sai com um código aleatório), monta uma página
       simples nossa: mostra o arquivo (PDF ou imagem) E tem um botão de baixar
       com o nome certo garantido, sem depender de "adivinhação" do navegador. */
    var aba = abaPreAberta || window.open('', '_blank');
    if(aba && !aba.closed){
      var visualizacao = mimeType === 'application/pdf'
        ? '<iframe src="' + url + '"></iframe>'
        : '<div class="wrap-img"><img src="' + url + '"></div>';
      var paginaHtml =
        '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + escapeHtml(filename) + '</title>' +
        '<style>' +
          'html,body{margin:0;height:100%;font-family:-apple-system,Helvetica,Arial,sans-serif;background:#f2f3f0;}' +
          '.barra{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid #e2e5e0;box-sizing:border-box;}' +
          '.barra .nome{font-size:13.5px;color:#333;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}' +
          '.btn-baixar{background:#1B4D3E;color:#fff;text-decoration:none;padding:9px 18px;border-radius:6px;font-size:13.5px;font-weight:600;white-space:nowrap;flex-shrink:0;}' +
          'iframe{width:100%;height:calc(100% - 49px);border:none;display:block;}' +
          '.wrap-img{height:calc(100% - 49px);overflow:auto;display:flex;justify-content:center;padding:20px;box-sizing:border-box;}' +
          '.wrap-img img{max-width:100%;height:auto;box-shadow:0 2px 12px rgba(0,0,0,.12);}' +
        '</style></head><body>' +
        '<div class="barra"><span class="nome">' + escapeHtml(filename) + '</span><a class="btn-baixar" href="' + url + '" download="' + escapeHtml(filename) + '">Baixar arquivo</a></div>' +
        visualizacao +
        '</body></html>';
      try{
        aba.document.open(); aba.document.write(paginaHtml); aba.document.close();
      }catch(e){
        aba.location.href = url; /* navegador bloqueou escrever na aba — abre o arquivo puro como reserva */
      }
      setTimeout(function(){ URL.revokeObjectURL(url); }, 10 * 60 * 1000);
      return;
    }
    var a1 = document.createElement('a');
    a1.href = url; a1.download = filename;
    document.body.appendChild(a1); a1.click(); document.body.removeChild(a1);
    toast('Seu navegador bloqueou a aba nova, então baixei o arquivo direto. Pode liberar pop-ups pra esse site se quiser abrir na aba da próxima vez.');
    setTimeout(function(){ URL.revokeObjectURL(url); }, 5 * 60 * 1000);
    return;
  }

  /* Word (.doc) e outros formatos que o navegador não sabe exibir sozinho: baixa
     direto, com o nome certo (uma aba nova não ajudaria em nada aqui). */
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function nomeArquivoDocumento(client, referencia, sufixo){
  var partes = (referencia || '').split('/');
  var nomeMes = partes[0] || '', ano = partes[1] || '';
  var idxMes = MESES_PT.indexOf(nomeMes);
  var mesNum = idxMes > -1 ? String(idxMes + 1).padStart(2, '0') : '00';
  var nomeCliente = (client.nome || '').toUpperCase();
  return (ano + ' ' + mesNum + ' ' + nomeCliente + ' ' + sufixo).trim();
}
function hexToRgb(hex){
  hex = (hex || '#1B4D3E').replace('#','');
  if(hex.length === 3) hex = hex.split('').map(function(c){ return c+c; }).join('');
  var num = parseInt(hex, 16);
  if(isNaN(num)) num = 0x1B4D3E;
  return [ (num>>16)&255, (num>>8)&255, num&255 ];
}
function carregarDimensoesImagem(base64){
  return new Promise(function(resolve){
    try{
      var img = new Image();
      img.onload = function(){ resolve({ w: img.naturalWidth || 1, h: img.naturalHeight || 1 }); };
      img.onerror = function(){ resolve(null); };
      img.src = base64;
    }catch(e){ resolve(null); }
  });
}
function formatoImagemBase64(base64){
  if(base64.indexOf('image/png') > -1) return 'PNG';
  if(base64.indexOf('image/webp') > -1) return 'WEBP';
  return 'JPEG';
}

      }
    }

    var nomeArquivo = nomeArquivoDocumento(client, d.referencia, interno ? 'RESUMO' : 'FATURA') + '.pdf';
    doc.setProperties({ title: nomeArquivo });
    var blobPdf = doc.output('blob');
    await compartilharOuBaixarBlob(blobPdf, nomeArquivo, 'application/pdf', abaPreAberta);
  }catch(e){
    console.error(e);
    if(abaPreAberta) abaPreAberta.close();
    toast('Erro ao gerar o PDF. Tente novamente em instantes.');
  }
}

function handleConfirmClick(el, cb){
  if(el.dataset.confirming === '1'){ clearTimeout(el._confirmTimeout); cb(); }
  else{
    var original = el.textContent;
    el.dataset.confirming = '1'; el.dataset.original = original; el.textContent = 'Confirmar exclusão';
    el._confirmTimeout = setTimeout(function(){ el.dataset.confirming=''; el.textContent = el.dataset.original; }, 3000);
  }
}

function varRowHtml(v, withCategoria){
  v = v || {};
  var rid = uid();
  var categoriaHtml = withCategoria ? (
    '<select class="v-categoria">' +
      '<option value="mensal"'+(v.categoria==='mensal'?' selected':'')+'>Mensal</option>' +
      '<option value="fixo"'+(v.categoria==='fixo'?' selected':'')+'>Fixo do perfil</option>' +
    '</select>') : '';
  /* "Tipo" e "Calc." só existem para variáveis de item (por ponto): a maioria é numérica
     e digitada; às vezes um ponto precisa de uma marcação Sim/Não (ex.: "é o ponto
     principal?"), e às vezes o valor não é digitado — é sempre calculado pelo sistema
     (ex.: consumo/Fio B quando "distribuição automática" está ligada no perfil). */
  var tipoHtml = !withCategoria ? (
    '<select class="v-tipo">' +
      '<option value="numero"'+(v.tipo!=='checkbox'?' selected':'')+'>Número</option>' +
      '<option value="checkbox"'+(v.tipo==='checkbox'?' selected':'')+'>Sim / Não</option>' +
    '</select>') : '';
  var calcHtml = !withCategoria ? (
    '<label class="v-calc-label" title="Somente leitura — preenchido pelo sistema, não digitado"><input type="checkbox" class="v-calc"'+(v.calculado?' checked':'')+'> calc.</label>') : '';
  return '<div class="var-row' + (withCategoria?'':' item-row') + '" data-var-id="' + rid + '">' +
    '<input type="text" class="v-rotulo" placeholder="Rótulo (ex: Consumo do mês)" value="' + escapeHtml(v.rotulo||'') + '">' +
    '<input type="text" class="v-chave" placeholder="chave" value="' + escapeHtml(v.chave||'') + '" data-touched="' + (v.chave?'1':'0') + '">' +
    categoriaHtml + tipoHtml +
    '<input type="text" inputmode="decimal" class="v-padrao" placeholder="valor padrão" value="' + (v.valorPadrao!==undefined?fmtNum(v.valorPadrao):'0') + '">' +
    '<select class="v-formato">' +
      '<option value="moeda"'+(v.formato==='moeda'?' selected':'')+'>R$</option>' +
      '<option value="kwh"'+(v.formato==='kwh'?' selected':'')+'>kWh</option>' +
      '<option value="percentual"'+(v.formato==='percentual'?' selected':'')+'>%</option>' +
      '<option value="numero"'+(v.formato==='numero'?' selected':'')+'>número</option>' +
      '<option value="booleano"'+(v.formato==='booleano'?' selected':'')+'>Sim/Não</option>' +
    '</select>' +
    calcHtml +
    '<button type="button" class="rm-btn" data-action="'+(withCategoria?'remove-var-row':'remove-itemvar-row')+'" data-id="' + rid + '">✕</button>' +
  '</div>';
}
function readVarRows(containerId, withCategoria){
  var rows = document.querySelectorAll('#'+containerId+' .var-row');
  var list = [];
  rows.forEach(function(row){
    var rotulo = row.querySelector('.v-rotulo').value.trim();
    if(!rotulo) return;
    var chave = row.querySelector('.v-chave').value.trim() || slugify(rotulo);
    var categoriaEl = row.querySelector('.v-categoria');
    var categoria = withCategoria && categoriaEl ? categoriaEl.value : 'mensal';
    var tipoEl = row.querySelector('.v-tipo');
    var tipo = (!withCategoria && tipoEl) ? tipoEl.value : 'numero';
    var valorPadrao = tipo === 'checkbox'
      ? (row.querySelector('.v-padrao') ? (parseNumBR(row.querySelector('.v-padrao').value) ? 1 : 0) : 0)
      : parseNumBR(row.querySelector('.v-padrao').value);
    var formato = row.querySelector('.v-formato').value;
    var item = {chave:chave, rotulo:rotulo, categoria:categoria, valorPadrao:valorPadrao, formato:formato};
    if(!withCategoria){
      item.tipo = tipo;
      var calcEl = row.querySelector('.v-calc');
      item.calculado = calcEl ? calcEl.checked : false;
    }
    list.push(item);
  });
  return list;
}

/* Alternar "ponto único" <-> "múltiplos pontos" troca a seção de fórmulas por um preset
   correspondente (as fórmulas de um modo não fazem sentido no outro), mas preserva
   nome/descrição já digitados e, principalmente, preserva qual perfil está sendo editado
   (via state.editingProfileId, nunca via p.id) para que "Salvar" continue atualizando o
   perfil certo em vez de criar um duplicado. */
function toggleMultiploFields(isMulti, profileOriginal){
  var nome = txt('pe-nome');
  var descricao = txt('pe-descricao');
  var novoDraft = isMulti ? presetGD2ComFioBMultiplos() : presetGD1();
  novoDraft.nome = nome;
  novoDraft.descricao = descricao;
  novoDraft.isPreset = false;
  renderProfileEditor(profileOriginal, novoDraft);
}

function lerProfileDoFormulario(){
  var isMulti = document.getElementById('pe-multiplos') ? document.getElementById('pe-multiplos').checked : false;
  var p = {
    nome: txt('pe-nome'), descricao: txt('pe-descricao'), possuiItensMultiplos: isMulti,
    variaveis: readVarRows('pe-vars', true),
    rotuloTotalCliente: txt('pe-rotulo-total') || 'VALOR FINAL A SER PAGO',
    textoIntroducao: txt('pe-intro')
  };
  if(isMulti){
    var fc = document.getElementById('pe-formulas-compartilhadas');
    p.formulasCompartilhadas = fc ? fc.value.split('\n') : [];
    p.itemVariaveis = document.getElementById('pe-item-vars') ? readVarRows('pe-item-vars', false) : [];
    var ifEl = document.getElementById('pe-item-formulas');
    p.itemFormulas = ifEl ? ifEl.value.split('\n') : [];
    var ff = document.getElementById('pe-formulas-finais');
    p.formulasFinais = ff ? ff.value.split('\n') : [];
    var riEl = document.getElementById('pe-rotulo-item');
    p.rotuloItemPrefixo = riEl ? riEl.value : 'Injeção em ';
    var fioBSel = document.getElementById('pe-item-fiob-chave');
    p.chaveItemFioB = fioBSel && fioBSel.value ? fioBSel.value : null;
    var riFioBEl = document.getElementById('pe-rotulo-item-fiob');
    p.rotuloItemFioBPrefixo = riFioBEl ? riFioBEl.value : 'Fio B em ';
    var distAutoEl = document.getElementById('pe-distribuicao-auto');
    p.distribuicaoAutomaticaPontos = distAutoEl ? distAutoEl.checked : false;
    p.formulas = [];
  } else {
    var fe = document.getElementById('pe-formulas');
    p.formulas = fe ? fe.value.split('\n') : [];
    p.formulasCompartilhadas = []; p.itemVariaveis = []; p.itemFormulas = []; p.formulasFinais = [];
    p.chaveItemFioB = null; p.rotuloItemFioBPrefixo = ''; p.distribuicaoAutomaticaPontos = false;
  }
  var totalSel = document.getElementById('pe-total-final');
  p.chaveTotalFinal = totalSel ? totalSel.value : '';
  p.camposVisiveisCliente = Array.prototype.slice.call(document.querySelectorAll('.campo-visivel-editor:checked')).map(function(cb){ return cb.dataset.chave; });
  var rotulosCampos = {}, formatosCampos = {};
  document.querySelectorAll('.campo-rotulo-editor').forEach(function(inp){ rotulosCampos[inp.dataset.chave] = inp.value.trim() || inp.dataset.chave; });
  document.querySelectorAll('.campo-formato-editor').forEach(function(sel){ formatosCampos[sel.dataset.chave] = sel.value; });
  p.rotulosCampos = rotulosCampos;
  p.formatosCampos = formatosCampos;
  return p;
}

function popularSelectTotalFinal(p){
  var sel = document.getElementById('pe-total-final');
  if(!sel) return;
  var chaves = [];
  (p.variaveis||[]).forEach(function(v){ chaves.push(v.chave); });
  var linhas = p.possuiItensMultiplos
    ? linhasExecutaveis(p.formulasCompartilhadas).concat(linhasExecutaveis(p.formulasFinais))
    : linhasExecutaveis(p.formulas);
  linhas.forEach(function(line){ var k = parseAssignKey(line); if(k && chaves.indexOf(k)===-1) chaves.push(k); });
  sel.innerHTML = chaves.map(function(k){ return '<option value="'+k+'"'+(k===p.chaveTotalFinal?' selected':'')+'>'+k+'</option>'; }).join('');
  if(!p.chaveTotalFinal && chaves.length){ sel.value = chaves[chaves.length-1]; }
}
function popularSelectItemFioB(p){
  var sel = document.getElementById('pe-item-fiob-chave');
  if(!sel) return;
  if(!p.possuiItensMultiplos){ sel.innerHTML = ''; return; }
  var chaves = (p.itemVariaveis||[]).map(function(v){ return v.chave; });
  linhasExecutaveis(p.itemFormulas).forEach(function(line){ var k = parseAssignKey(line); if(k && chaves.indexOf(k)===-1) chaves.push(k); });
  var opcoes = '<option value="">(nenhuma)</option>' + chaves.map(function(k){
    return '<option value="'+k+'"'+(k===p.chaveItemFioB?' selected':'')+'>'+k+'</option>';
  }).join('');
  sel.innerHTML = opcoes;
}
function popularChecklistCampos(p, selecionados){
  var el = document.getElementById('pe-campos-visiveis');
  if(!el) return;
  var campos = camposDisponiveisPerfil(p);
  if(campos.length === 0){ el.innerHTML = '<span class="hint">Nenhum campo disponível ainda — escreva as fórmulas e clique em "Testar fórmulas".</span>'; return; }
  el.innerHTML = campos.map(function(c){
    var checked = selecionados.indexOf(c.chave) > -1;
    if(!c.editavel){
      return '<label><input type="checkbox" class="campo-visivel-editor" data-chave="'+c.chave+'"'+(checked?' checked':'')+'> ' + escapeHtml(c.rotulo) + ' <span class="mono" style="color:var(--ink-soft);font-size:11px">(' + c.chave + ')</span></label>';
    }
    /* campo calculado por fórmula: rótulo e formato de exibição são editáveis */
    return '<div style="display:flex;align-items:center;gap:6px;">' +
      '<input type="checkbox" class="campo-visivel-editor" data-chave="'+c.chave+'"'+(checked?' checked':'')+'>' +
      '<input type="text" class="campo-rotulo-editor" data-chave="'+c.chave+'" value="'+escapeHtml(c.rotulo)+'" placeholder="Rótulo para o cliente" style="flex:1;padding:5px 7px;border:1px solid var(--line);border-radius:3px;font-size:12.5px">' +
      '<select class="campo-formato-editor" data-chave="'+c.chave+'" style="padding:5px 6px;border:1px solid var(--line);border-radius:3px;font-size:12px">' +
        '<option value="moeda"'+(c.formato==='moeda'?' selected':'')+'>R$</option>' +
        '<option value="kwh"'+(c.formato==='kwh'?' selected':'')+'>kWh</option>' +
        '<option value="percentual"'+(c.formato==='percentual'?' selected':'')+'>%</option>' +
        '<option value="numero"'+(c.formato==='numero'?' selected':'')+'>número</option>' +
      '</select>' +
      '<span class="mono" style="color:var(--ink-soft);font-size:11px;white-space:nowrap">(' + c.chave + ')</span>' +
    '</div>';
  }).join('');
}

function onTestarFormulas(){
  var p = lerProfileDoFormulario();
  var resultEl = document.getElementById('pe-test-result');
  var valoresEntrada = {};
  (p.variaveis||[]).forEach(function(v){ valoresEntrada[v.chave] = v.valorPadrao; });
  valoresEntrada.ajuste = 0;
  var itensInput = null;
  if(p.possuiItensMultiplos){
    var itemVals = {}; (p.itemVariaveis||[]).forEach(function(v){ itemVals[v.chave] = v.valorPadrao; });
    itensInput = [ Object.assign({nome:'Item de teste 1'}, itemVals), Object.assign({nome:'Item de teste 2'}, itemVals) ];
  }
  var resultado = avaliarPerfil(p, valoresEntrada, itensInput);
  var selectedBefore = document.getElementById('pe-total-final') ? document.getElementById('pe-total-final').value : p.chaveTotalFinal;
  p.chaveTotalFinal = selectedBefore;
  popularSelectTotalFinal(p);
  popularSelectItemFioB(p);
  var selecionadosAntes = Array.prototype.slice.call(document.querySelectorAll('.campo-visivel-editor:checked')).map(function(cb){ return cb.dataset.chave; });
  popularChecklistCampos(p, selecionadosAntes);

  if(!resultado.ok){
    resultEl.innerHTML = '<div class="test-result error">' + escapeHtml(mensagemErroAvaliacao(resultado.erro)) + '</div>';
    return;
  }
  var linhasResultado = Object.keys(resultado.scope).filter(function(k){ return k.indexOf('itens_')!==0; })
    .map(function(k){ return '<div class="kv"><span>'+k+'</span><span>'+ (typeof resultado.scope[k]==='number' ? resultado.scope[k].toFixed(4) : resultado.scope[k]) +'</span></div>'; }).join('');
  resultEl.innerHTML = '<div class="test-result success">Fórmulas OK com os valores padrão.</div>' + linhasResultado;
}

/* Compara e aplica as correções dos modelos padrão (GD1/GD2) automaticamente.
   Só mexe em perfis com isPreset:true — no momento em que o usuário edita ou
   duplica um preset, o próprio código já marca isPreset:false (ver salvarPerfil
   e duplicarPerfil), então perfis personalizados NUNCA são tocados aqui.
   mostrarToast=true: sempre avisa (usado pelo botão manual).
   mostrarToast=false: só avisa se algo realmente mudou (usado no login automático),
   para não incomodar o usuário toda vez que abrir o app sem necessidade. */
async function sincronizarModelosPadrao(mostrarToast){
  var novos = presetsPadrao();
  var nomesAtuais = novos.map(function(np){ return np.nome; });
  var atualizados = 0, adicionados = 0, removidos = 0, presosEmUso = [];
  novos.forEach(function(np){
    var existente = state.profiles.find(function(p){ return p.isPreset && p.nome === np.nome; });
    if(existente){
      var comparavel = Object.assign({}, np, { id: existente.id });
      var mudou = JSON.stringify(existente) !== JSON.stringify(comparavel);
      if(mudou){
        np.id = existente.id; /* preserva o id: clientes já vinculados continuam apontando certo */
        var idx = state.profiles.indexOf(existente);
        state.profiles[idx] = np;
        atualizados++;
      }
    } else {
      state.profiles.push(np);
      adicionados++;
    }
  });
  /* Presets antigos que saíram da lista (ex.: um modelo descontinuado) são removidos
     sozinhos, desde que nenhum cliente ainda esteja vinculado a eles — só apagamos o
     que dá pra apagar com segurança, sem quebrar vínculo de cliente nenhum. */
  state.profiles = state.profiles.filter(function(p){
    if(!p.isPreset || nomesAtuais.indexOf(p.nome) > -1) return true;
    var emUso = state.clients.some(function(c){ return c.profileId === p.id; });
    if(emUso){ presosEmUso.push(p.nome); return true; }
    removidos++;
    return false;
  });
  if(atualizados > 0 || adicionados > 0 || removidos > 0){
    await saveProfiles();
    if(mostrarToast){
      var partes = [];
      if(atualizados) partes.push(atualizados + ' corrigido(s)');
      if(adicionados) partes.push(adicionados + ' novo(s)');
      if(removidos) partes.push(removidos + ' descontinuado(s) removido(s)');
      toast('Modelos padrão atualizados (' + partes.join(', ') + '). Clientes e orçamentos não foram alterados.');
    }
  } else if(mostrarToast){
    toast('Os modelos padrão já estavam atualizados.');
  }
  if(presosEmUso.length){
    toast('Modelo(s) descontinuado(s) ainda em uso por algum cliente, então não foram removidos: ' + presosEmUso.join(', ') + '. Troque o perfil desse(s) cliente(s) em "Editar cliente" se quiser limpar.');
  }
  return { atualizados: atualizados, adicionados: adicionados, removidos: removidos };
}

  if(fixos.length === 0) return '<span class="hint">Este perfil não possui variáveis fixas para ajustar por cliente.</span>';
  return fixos.map(function(v){
    var val = (overridesAtuais && overridesAtuais[v.chave] !== undefined) ? overridesAtuais[v.chave] : v.valorPadrao;

}
