/* Alternar "ponto único" <-> "múltiplos pontos" troca a seção de fórmulas por um preset
   correspondente (as fórmulas de um modo não fazem sentido no outro), mas preserva
   nome/descrição já digitados e, principalmente, preserva qual perfil está sendo editado
   (via state.editingProfileId, nunca via p.id) para que "Salvar" continue atualizando o
   perfil certo em vez de criar um duplicado. */
function toggleMultiploFields(isMulti, profileOriginal){
  var nome = txt('pe-nome');
  var descricao = txt('pe-descricao');
  var novoDraft = isMulti ? presetGD2ComFioBMultiplos() : presetGD1();
  novoDraft.nome = nome;
  novoDraft.descricao = descricao;
  novoDraft.isPreset = false;
  renderProfileEditor(profileOriginal, novoDraft);
}

function lerProfileDoFormulario(){
  var isMulti = document.getElementById('pe-multiplos') ? document.getElementById('pe-multiplos').checked : false;
  var p = {
    nome: txt('pe-nome'), descricao: txt('pe-descricao'), possuiItensMultiplos: isMulti,
    variaveis: readVarRows('pe-vars', true),
    rotuloTotalCliente: txt('pe-rotulo-total') || 'VALOR FINAL A SER PAGO',
    textoIntroducao: txt('pe-intro')
  };
  if(isMulti){
    var fc = document.getElementById('pe-formulas-compartilhadas');
    p.formulasCompartilhadas = fc ? fc.value.split('\n') : [];
    p.itemVariaveis = document.getElementById('pe-item-vars') ? readVarRows('pe-item-vars', false) : [];
    var ifEl = document.getElementById('pe-item-formulas');
    p.itemFormulas = ifEl ? ifEl.value.split('\n') : [];
    var ff = document.getElementById('pe-formulas-finais');
    p.formulasFinais = ff ? ff.value.split('\n') : [];
    var riEl = document.getElementById('pe-rotulo-item');
    p.rotuloItemPrefixo = riEl ? riEl.value : 'Injeção em ';
    var fioBSel = document.getElementById('pe-item-fiob-chave');
    p.chaveItemFioB = fioBSel && fioBSel.value ? fioBSel.value : null;
    var riFioBEl = document.getElementById('pe-rotulo-item-fiob');
    p.rotuloItemFioBPrefixo = riFioBEl ? riFioBEl.value : 'Fio B em ';
    var distAutoEl = document.getElementById('pe-distribuicao-auto');
    p.distribuicaoAutomaticaPontos = distAutoEl ? distAutoEl.checked : false;
    p.formulas = [];
  } else {
    var fe = document.getElementById('pe-formulas');
    p.formulas = fe ? fe.value.split('\n') : [];
    p.formulasCompartilhadas = []; p.itemVariaveis = []; p.itemFormulas = []; p.formulasFinais = [];
    p.chaveItemFioB = null; p.rotuloItemFioBPrefixo = ''; p.distribuicaoAutomaticaPontos = false;
  }
  var totalSel = document.getElementById('pe-total-final');
  p.chaveTotalFinal = totalSel ? totalSel.value : '';
  p.camposVisiveisCliente = Array.prototype.slice.call(document.querySelectorAll('.campo-visivel-editor:checked')).map(function(cb){ return cb.dataset.chave; });
  var rotulosCampos = {}, formatosCampos = {};
  document.querySelectorAll('.campo-rotulo-editor').forEach(function(inp){ rotulosCampos[inp.dataset.chave] = inp.value.trim() || inp.dataset.chave; });
  document.querySelectorAll('.campo-formato-editor').forEach(function(sel){ formatosCampos[sel.dataset.chave] = sel.value; });
  p.rotulosCampos = rotulosCampos;
  p.formatosCampos = formatosCampos;
  return p;
}

function popularSelectTotalFinal(p){
  var sel = document.getElementById('pe-total-final');
  if(!sel) return;
  var chaves = [];
  (p.variaveis||[]).forEach(function(v){ chaves.push(v.chave); });
  var linhas = p.possuiItensMultiplos
    ? linhasExecutaveis(p.formulasCompartilhadas).concat(linhasExecutaveis(p.formulasFinais))
    : linhasExecutaveis(p.formulas);
  linhas.forEach(function(line){ var k = parseAssignKey(line); if(k && chaves.indexOf(k)===-1) chaves.push(k); });
  sel.innerHTML = chaves.map(function(k){ return '<option value="'+k+'"'+(k===p.chaveTotalFinal?' selected':'')+'>'+k+'</option>'; }).join('');
  if(!p.chaveTotalFinal && chaves.length){ sel.value = chaves[chaves.length-1]; }
}
function popularSelectItemFioB(p){
  var sel = document.getElementById('pe-item-fiob-chave');
  if(!sel) return;
  if(!p.possuiItensMultiplos){ sel.innerHTML = ''; return; }
  var chaves = (p.itemVariaveis||[]).map(function(v){ return v.chave; });
  linhasExecutaveis(p.itemFormulas).forEach(function(line){ var k = parseAssignKey(line); if(k && chaves.indexOf(k)===-1) chaves.push(k); });
  var opcoes = '<option value="">(nenhuma)</option>' + chaves.map(function(k){
    return '<option value="'+k+'"'+(k===p.chaveItemFioB?' selected':'')+'>'+k+'</option>';
  }).join('');
  sel.innerHTML = opcoes;
}
function popularChecklistCampos(p, selecionados){
  var el = document.getElementById('pe-campos-visiveis');
  if(!el) return;
  var campos = camposDisponiveisPerfil(p);
  if(campos.length === 0){ el.innerHTML = '<span class="hint">Nenhum campo disponível ainda — escreva as fórmulas e clique em "Testar fórmulas".</span>'; return; }
  el.innerHTML = campos.map(function(c){
    var checked = selecionados.indexOf(c.chave) > -1;
    if(!c.editavel){
      return '<label><input type="checkbox" class="campo-visivel-editor" data-chave="'+c.chave+'"'+(checked?' checked':'')+'> ' + escapeHtml(c.rotulo) + ' <span class="mono" style="color:var(--ink-soft);font-size:11px">(' + c.chave + ')</span></label>';
    }
    /* campo calculado por fórmula: rótulo e formato de exibição são editáveis */
    return '<div style="display:flex;align-items:center;gap:6px;">' +
      '<input type="checkbox" class="campo-visivel-editor" data-chave="'+c.chave+'"'+(checked?' checked':'')+'>' +
      '<input type="text" class="campo-rotulo-editor" data-chave="'+c.chave+'" value="'+escapeHtml(c.rotulo)+'" placeholder="Rótulo para o cliente" style="flex:1;padding:5px 7px;border:1px solid var(--line);border-radius:3px;font-size:12.5px">' +
      '<select class="campo-formato-editor" data-chave="'+c.chave+'" style="padding:5px 6px;border:1px solid var(--line);border-radius:3px;font-size:12px">' +
        '<option value="moeda"'+(c.formato==='moeda'?' selected':'')+'>R$</option>' +
        '<option value="kwh"'+(c.formato==='kwh'?' selected':'')+'>kWh</option>' +
        '<option value="percentual"'+(c.formato==='percentual'?' selected':'')+'>%</option>' +
        '<option value="numero"'+(c.formato==='numero'?' selected':'')+'>número</option>' +
      '</select>' +
      '<span class="mono" style="color:var(--ink-soft);font-size:11px;white-space:nowrap">(' + c.chave + ')</span>' +
    '</div>';
  }).join('');
}

function onTestarFormulas(){
  var p = lerProfileDoFormulario();
  var resultEl = document.getElementById('pe-test-result');
  var valoresEntrada = {};
  (p.variaveis||[]).forEach(function(v){ valoresEntrada[v.chave] = v.valorPadrao; });
  valoresEntrada.ajuste = 0;
  var itensInput = null;
  if(p.possuiItensMultiplos){
    var itemVals = {}; (p.itemVariaveis||[]).forEach(function(v){ itemVals[v.chave] = v.valorPadrao; });
    itensInput = [ Object.assign({nome:'Item de teste 1'}, itemVals), Object.assign({nome:'Item de teste 2'}, itemVals) ];
  }
  var resultado = avaliarPerfil(p, valoresEntrada, itensInput);
  var selectedBefore = document.getElementById('pe-total-final') ? document.getElementById('pe-total-final').value : p.chaveTotalFinal;
  p.chaveTotalFinal = selectedBefore;
  popularSelectTotalFinal(p);
  popularSelectItemFioB(p);
  var selecionadosAntes = Array.prototype.slice.call(document.querySelectorAll('.campo-visivel-editor:checked')).map(function(cb){ return cb.dataset.chave; });
  popularChecklistCampos(p, selecionadosAntes);

  if(!resultado.ok){
    resultEl.innerHTML = '<div class="test-result error">' + escapeHtml(mensagemErroAvaliacao(resultado.erro)) + '</div>';
    return;
  }
  var linhasResultado = Object.keys(resultado.scope).filter(function(k){ return k.indexOf('itens_')!==0; })
    .map(function(k){ return '<div class="kv"><span>'+k+'</span><span>'+ (typeof resultado.scope[k]==='number' ? resultado.scope[k].toFixed(4) : resultado.scope[k]) +'</span></div>'; }).join('');
  resultEl.innerHTML = '<div class="test-result success">Fórmulas OK com os valores padrão.</div>' + linhasResultado;
}

function removeItemVarRow(id){ var el = document.querySelector('#pe-item-vars .var-row[data-var-id="'+id+'"]'); if(el) el.remove(); }

async function onSaveProfile(isNew){
  var p = lerProfileDoFormulario();
  if(!p.nome){ toast('Dê um nome ao modelo.'); return; }
  if(!p.chaveTotalFinal){ toast('Escolha qual variável representa o valor final a pagar.'); return; }
  p.isPreset = false;
  if(isNew){ p.id = uid(); state.profiles.push(p); }
  else {
    var idx = state.profiles.findIndex(function(x){ return x.id === state.editingProfileId; });
    p.id = state.editingProfileId;
    if(idx > -1) state.profiles[idx] = p;
  }
  await saveProfiles();
  state.editingProfileId = null;
  renderTabContent();
  toast('Modelo salvo.');
}
function onCancelEditProfile(){ state.editingProfileId = null; renderTabContent(); }
function onNewProfile(){ state.editingProfileId = 'new'; renderTabContent(); }
function onEditProfile(id){ state.editingProfileId = id; renderTabContent(); }
async function onDuplicateProfile(id){
  var orig = getProfile(id); if(!orig) return;
  var copia = JSON.parse(JSON.stringify(orig));
  copia.id = uid(); copia.isPreset = false; copia.nome = orig.nome + ' (cópia)';
  state.profiles.push(copia);
  await saveProfiles();
  state.editingProfileId = copia.id;
  renderTabContent();
  toast('Modelo duplicado — edite e salve como seu.');
}
async function onDeleteProfile(id){
  state.profiles = state.profiles.filter(function(p){ return p.id !== id; });
  await saveProfiles();
  renderTabContent();
  toast('Modelo excluído.');
}

/* Compara e aplica as correções dos modelos padrão (GD1/GD2) automaticamente.
   Só mexe em perfis com isPreset:true — no momento em que o usuário edita ou
   duplica um preset, o próprio código já marca isPreset:false (ver salvarPerfil
   e duplicarPerfil), então perfis personalizados NUNCA são tocados aqui.
   mostrarToast=true: sempre avisa (usado pelo botão manual).
   mostrarToast=false: só avisa se algo realmente mudou (usado no login automático),
   para não incomodar o usuário toda vez que abrir o app sem necessidade. */
async function sincronizarModelosPadrao(mostrarToast){
  var novos = presetsPadrao();
  var nomesAtuais = novos.map(function(np){ return np.nome; });
  var atualizados = 0, adicionados = 0, removidos = 0, presosEmUso = [];
  novos.forEach(function(np){
    var existente = state.profiles.find(function(p){ return p.isPreset && p.nome === np.nome; });
    if(existente){
      var comparavel = Object.assign({}, np, { id: existente.id });
      var mudou = JSON.stringify(existente) !== JSON.stringify(comparavel);
      if(mudou){
        np.id = existente.id; /* preserva o id: clientes já vinculados continuam apontando certo */
        var idx = state.profiles.indexOf(existente);
        state.profiles[idx] = np;
        atualizados++;
      }
    } else {
      state.profiles.push(np);
      adicionados++;
    }
  });
  /* Presets antigos que saíram da lista (ex.: um modelo descontinuado) são removidos
     sozinhos, desde que nenhum cliente ainda esteja vinculado a eles — só apagamos o
     que dá pra apagar com segurança, sem quebrar vínculo de cliente nenhum. */
  state.profiles = state.profiles.filter(function(p){
    if(!p.isPreset || nomesAtuais.indexOf(p.nome) > -1) return true;
    var emUso = state.clients.some(function(c){ return c.profileId === p.id; });
    if(emUso){ presosEmUso.push(p.nome); return true; }
    removidos++;
    return false;
  });
  if(atualizados > 0 || adicionados > 0 || removidos > 0){
    await saveProfiles();
    if(mostrarToast){
      var partes = [];
      if(atualizados) partes.push(atualizados + ' corrigido(s)');
      if(adicionados) partes.push(adicionados + ' novo(s)');
      if(removidos) partes.push(removidos + ' descontinuado(s) removido(s)');
      toast('Modelos padrão atualizados (' + partes.join(', ') + '). Clientes e orçamentos não foram alterados.');
    }
  } else if(mostrarToast){
    toast('Os modelos padrão já estavam atualizados.');
  }
  if(presosEmUso.length){
    toast('Modelo(s) descontinuado(s) ainda em uso por algum cliente, então não foram removidos: ' + presosEmUso.join(', ') + '. Troque o perfil desse(s) cliente(s) em "Editar cliente" se quiser limpar.');
  }
  return { atualizados: atualizados, adicionados: adicionados, removidos: removidos };
}
async function resetAllData(){
  state.profiles = presetsPadrao();
  await saveProfiles();
  state.clients = seedClients(state.profiles);
  await saveClients();
  state.quotes = [];
  await saveQuotes();
  state.docConfig = docConfigPadrao();
  await saveDocConfig();
  state.selectedClientId = state.clients[0].id;
  state.activeTab = 'novo'; state.editingProfileId = null;
  renderAll();
  toast('Todos os dados foram apagados e os modelos padrão restaurados.');
}

function renderClientOverridesFixos(profile, overridesAtuais){
  if(!profile) return '<span class="hint">Selecione um perfil.</span>';
  var fixos = (profile.variaveis||[]).filter(function(v){ return v.categoria === 'fixo'; });
  if(fixos.length === 0) return '<span class="hint">Este perfil não possui variáveis fixas para ajustar por cliente.</span>';
  return fixos.map(function(v){
    var val = (overridesAtuais && overridesAtuais[v.chave] !== undefined) ? overridesAtuais[v.chave] : v.valorPadrao;
    return '<div class="field"><label>' + escapeHtml(v.rotulo) + '</label><input type="text" inputmode="decimal" class="m-fixo" data-chave="' + v.chave + '" value="' + fmtNum(val) + '"></div>';
  }).join('');
}

function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }

async function saveClientFromModal(existingId){
  var nome = txt('m-nome');
  if(!nome){ toast('Informe o nome do cliente.'); return; }
  var profileId = document.getElementById('m-profile').value;
  var overridesFixos = {};
  document.querySelectorAll('.m-fixo').forEach(function(inp){ overridesFixos[inp.dataset.chave] = parseNumBR(inp.value); });
  var pontosTexto = txt('m-pontos');
  var pontosPadrao = pontosTexto ? pontosTexto.split('\n').map(function(linha){
    var partes = linha.split(' - ');
    if(partes.length >= 2){ return { nome: partes[0].trim(), uc: partes.slice(1).join(' - ').trim() }; }
    return { nome: linha.trim(), uc: '' };
  }).filter(function(p){ return p.nome; }) : [];

  var existente = existingId ? state.clients.find(function(c){ return c.id === existingId; }) : null;
  var data = {
    id: existingId || uid(), nome: nome, uc: txt('m-uc'), profileId: profileId,
    overridesFixos: overridesFixos, pontosPadrao: pontosPadrao,
    chavePix: txt('m-pix'), banco: txt('m-banco'), beneficiario: txt('m-beneficiario'), condicaoPagamento: txt('m-condicao'),
    locadorPagaFatura: !!(document.getElementById('m-paga-fatura') && document.getElementById('m-paga-fatura').checked),
    cidadePix: txt('m-cidade-pix'),
    gerarQrCodePix: !!(document.getElementById('m-gerar-qr-pix') && document.getElementById('m-gerar-qr-pix').checked),
    camposVisiveisPadrao: existente ? existente.camposVisiveisPadrao : undefined
  };
  if(existingId){
    var idx = state.clients.findIndex(function(c){ return c.id === existingId; });
    if(idx > -1) state.clients[idx] = data;
  } else { state.clients.push(data); }
  await saveClients();
  state.selectedClientId = data.id;
  closeModal(); renderAll();
  toast('Cliente salvo.');
}
async function deleteClient(id){
  state.clients = state.clients.filter(function(c){ return c.id !== id; });
  state.quotes = state.quotes.filter(function(q){ return q.clientId !== id; });
  await saveClients(); await saveQuotes();
  if(state.selectedClientId === id){ state.selectedClientId = state.clients.length ? state.clients[0].id : null; }
  closeModal(); renderAll();
  toast('Cliente excluído.');
}

/* ============================================================
   AUTENTICAÇÃO (Supabase Auth)
   ============================================================ */
var authMode = 'signin'; /* 'signin' | 'signup' */
var authMsg = null; /* {tipo:'error'|'info', texto} */

function renderAuthConfigWarning(motivo){
  var texto = motivo === 'sdk'
    ? '<p>A biblioteca do Supabase não carregou (conexão instável, bloqueador de scripts, ou o CDN está fora do ar). Verifique sua internet e recarregue a página.</p>'
    : '<p>Este arquivo precisa da URL e da anon key do seu projeto Supabase para funcionar. Abra o arquivo, procure por <code>SUPABASE_URL</code> e <code>SUPABASE_ANON_KEY</code> perto do início do &lt;script&gt;, e cole os valores do seu projeto (Painel do Supabase → Settings → API). Depois, rode o script <code>setup-supabase.sql</code> uma vez no SQL Editor do Supabase.</p>';
  document.getElementById('auth-root').innerHTML =
    '<div class="auth-config-warning">' +
      '<h2 style="font-family:var(--serif);margin-top:0">' + (motivo==='sdk' ? 'Não foi possível carregar o Supabase' : 'Supabase ainda não configurado') + '</h2>' +
      texto +
    '</div>';
  document.getElementById('app-root').style.display = 'none';
}

function renderAuthScreen(){
  var msgHtml = authMsg ? '<div class="auth-msg ' + authMsg.tipo + '">' + escapeHtml(authMsg.texto) + '</div>' : '';
  document.getElementById('auth-root').innerHTML =
    '<div class="auth-screen"><div class="auth-card">' +
      '<div class="brand" style="flex-direction:column;text-align:center;margin-bottom:18px">' + sunIconSvg(150) + '<span style="color:var(--ink-soft);font-size:12.5px;margin-top:6px">orçamentos de aluguel de usinas</span></div>' +
      '<div class="auth-tabs">' +
        '<button class="auth-tab-btn' + (authMode==='signin'?' active':'') + '" data-action="auth-set-mode" data-mode="signin">Entrar</button>' +
        '<button class="auth-tab-btn' + (authMode==='signup'?' active':'') + '" data-action="auth-set-mode" data-mode="signup">Criar conta</button>' +
      '</div>' +
      msgHtml +
      '<div class="field"><label>E-mail</label><input type="text" id="auth-email" autocomplete="username" placeholder="voce@exemplo.com"></div>' +
      '<div class="field"><label>Senha</label><input type="password" id="auth-password" autocomplete="' + (authMode==='signin'?'current-password':'new-password') + '" placeholder="••••••••"></div>' +
      '<div class="btn-row"><button class="btn btn-primary btn-block" style="width:100%;justify-content:center" data-action="' + (authMode==='signin'?'sign-in':'sign-up') + '">' + (authMode==='signin'?'Entrar':'Criar conta') + '</button></div>' +
    '</div></div>';
  document.getElementById('app-root').style.display = 'none';
}

function setAuthMode(mode){ authMode = mode; authMsg = null; renderAuthScreen(); }

async function onSignIn(){
  var email = txt('auth-email'), senha = document.getElementById('auth-password').value;
  if(!email || !senha){ authMsg = {tipo:'error', texto:'Preencha e-mail e senha.'}; renderAuthScreen(); return; }
  var resp = await supabaseClient.auth.signInWithPassword({ email: email, password: senha });
  if(resp.error){ authMsg = {tipo:'error', texto: resp.error.message}; renderAuthScreen(); return; }
  /* onAuthStateChange cuida do resto (carregar dados e mostrar o app) */
}
async function onSignUp(){
  var email = txt('auth-email'), senha = document.getElementById('auth-password').value;
  if(!email || !senha){ authMsg = {tipo:'error', texto:'Preencha e-mail e senha.'}; renderAuthScreen(); return; }
  if(senha.length < 6){ authMsg = {tipo:'error', texto:'A senha precisa ter pelo menos 6 caracteres.'}; renderAuthScreen(); return; }
  var resp = await supabaseClient.auth.signUp({ email: email, password: senha });
  if(resp.error){ authMsg = {tipo:'error', texto: resp.error.message}; renderAuthScreen(); return; }
  if(resp.data && resp.data.user && !resp.data.session){
    authMsg = {tipo:'info', texto:'Conta criada! Verifique seu e-mail para confirmar antes de entrar.'};
    authMode = 'signin';
    renderAuthScreen();
  }
  /* se a confirmação por e-mail estiver desativada no projeto, já vem uma sessão pronta
     e onAuthStateChange cuida de mostrar o app automaticamente. */
}
async function onSignOut(){
  await supabaseClient.auth.signOut();
  /* onAuthStateChange cuida de limpar o estado e voltar pra tela de login */
}

async function aoLogar(user){
  currentUser = user;
  document.getElementById('auth-root').innerHTML = '';
  document.getElementById('app-root').style.display = '';
  state.profiles = []; state.clients = []; state.quotes = []; state.docConfig = docConfigPadrao();
  state.selectedClientId = null; state.activeTab = 'novo'; state.editingProfileId = null; state.lastDraft = null;
  await loadAll();
  renderAll();
}
function aoDeslogar(){
  currentUser = null;
  state.profiles = []; state.clients = []; state.quotes = []; state.docConfig = docConfigPadrao();
  state.selectedClientId = null; state.lastDraft = null;
  authMsg = null; authMode = 'signin';
  renderAuthScreen();
}

/* ============================================================
   RENDER GERAL
   ============================================================ */
function renderTabContent(){
  var el = document.getElementById('tab-content');
  el.style.opacity = '0';
  el.style.transform = 'translateY(6px)';
  if(state.activeTab === 'novo') renderNovoOrcamento();
  else if(state.activeTab === 'historico') renderHistorico();
  else if(state.activeTab === 'perfis') renderPerfis();
  else renderConfig();
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';
    });
  });
}
function renderAll(){ renderSidebar(); renderTopbar(); renderTabs(); renderTabContent(); }

/* ============================================================
   EVENTOS (DELEGAÇÃO)
   ============================================================ */
document.addEventListener('input', function(e){
  if(e.target.classList && e.target.classList.contains('v-rotulo')){
    var row = e.target.closest('.var-row');
    var chaveInput = row ? row.querySelector('.v-chave') : null;
    if(chaveInput && chaveInput.dataset.touched !== '1'){ chaveInput.value = slugify(e.target.value); }
  }
  if(e.target.classList && e.target.classList.contains('v-chave')){ e.target.dataset.touched = '1'; }
});

/* Auto-salva um rascunho local (com atraso curto) sempre que o usuário digita
   nos campos do orçamento — assim, se a página recarregar (ex.: ao abrir um
   PDF gerado e voltar), o que já foi digitado não se perde. */
var _rascunhoTimer = null;
document.addEventListener('input', function(e){
  var t = e.target;
  var relevante = t.id === 'f-ref-mes' || t.id === 'f-ref-ano' || t.id === 'f-ajuste' || t.id === 'f-observacoes' ||
    (t.classList && (t.classList.contains('in-mensal') || t.classList.contains('item-nome') || t.classList.contains('item-val')));
  if(!relevante) return;
  clearTimeout(_rascunhoTimer);
  _rascunhoTimer = setTimeout(salvarRascunhoAtual, 400);
});

/* Dentro de "Pontos de consumo", no máximo um ponto pode ser "principal" por vez —
   marcar um desmarca os outros automaticamente (comportamento de rádio). */
document.addEventListener('change', function(e){
  var t = e.target;
  if(t.classList && t.classList.contains('item-val-checkbox') && t.dataset.chave === 'pontoPrincipal' && t.checked){
    var wrap = document.getElementById('pontos-container');
    if(!wrap) return;
    wrap.querySelectorAll('.item-val-checkbox[data-chave="pontoPrincipal"]').forEach(function(cb){
      if(cb !== t) cb.checked = false;
    });
  }
});

document.addEventListener('click', function(e){
  var overlay = e.target.closest('[data-action="close-modal-bg"]');
  if(overlay && !e.target.closest('[data-stop-close]')){ closeModal(); return; }

  var el = e.target.closest('[data-action]');
  if(!el) return;
  var action = el.dataset.action;
  var id = el.dataset.id;

  switch(action){
    case 'auth-set-mode': setAuthMode(el.dataset.mode); break;
    case 'sign-in': onSignIn(); break;
    case 'sign-up': onSignUp(); break;
    case 'sign-out': onSignOut(); break;

    case 'select-client': selectClient(id); break;
    case 'new-client': openClientModal(null); break;
    case 'edit-client': openClientModal(id); break;
    case 'delete-client-confirm': handleConfirmClick(el, function(){ deleteClient(id); }); break;
    case 'close-modal': closeModal(); break;
    case 'save-client': saveClientFromModal(id || null); break;
    case 'set-tab': setTab(el.dataset.tab); break;

    case 'add-ponto': addPontoRow(); break;
    case 'remove-ponto': removePontoRow(id); break;
    case 'calcular': onCalcular(); break;
    case 'salvar-historico': onSalvarHistorico(); break;
    case 'baixar-doc': baixarDoc(); break;
    case 'baixar-png': baixarPng(); break;
    case 'baixar-pdf': baixarPdf('cliente'); break;
    case 'baixar-pdf-interno': baixarPdf('interno'); break;

    case 'duplicar-quote': duplicarQuote(id); break;
    case 'delete-quote-confirm': handleConfirmClick(el, function(){ deleteQuote(id); }); break;

    case 'new-profile': onNewProfile(); break;
    case 'edit-profile': onEditProfile(id); break;
    case 'duplicate-profile': onDuplicateProfile(id); break;
    case 'delete-profile-confirm': handleConfirmClick(el, function(){ onDeleteProfile(id); }); break;
    case 'cancel-edit-profile': onCancelEditProfile(); break;
    case 'save-profile': onSaveProfile(el.dataset.new === '1'); break;
    case 'testar-formulas': onTestarFormulas(); break;
    case 'add-var-row': addVarRow(); break;
    case 'remove-var-row': removeVarRow(id); break;
    case 'add-itemvar-row': addItemVarRow(); break;
    case 'remove-itemvar-row': removeItemVarRow(id); break;

    case 'atualizar-modelos-padrao': atualizarModelosPadrao(); break;
    case 'remove-logo': removerLogo(); break;
    case 'add-dc-telefone': addDcTelefoneRow(); break;
    case 'remove-dc-telefone': removeDcTelefoneRow(el); break;
    case 'salvar-doc-config': salvarDocConfig(); break;
    case 'salvar-campos-padrao': salvarCamposComoPadrao(); break;
    case 'reset-all-confirm': handleConfirmClick(el, function(){ resetAllData(); }); break;
  }
});

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  if(!SUPABASE_CONFIGURADO){ renderAuthConfigWarning('config'); return; }
  if(!SUPABASE_SDK_OK){ renderAuthConfigWarning('sdk'); return; }

  supabaseClient.auth.onAuthStateChange(function(event, session){
    if(session && session.user){
      if(!currentUser || currentUser.id !== session.user.id){ aoLogar(session.user); }
    } else {
      if(currentUser){ aoDeslogar(); } else { renderAuthScreen(); }
    }
  });

  var sessionResp = await supabaseClient.auth.getSession();
  if(sessionResp.data && sessionResp.data.session && sessionResp.data.session.user){
    await aoLogar(sessionResp.data.session.user);
  } else {
    renderAuthScreen();
  }
})();

})();
</script>
